notes: 'Read the full API Terms of Use (fetched with curl WITHOUT a browser User-Agent, which FRED blocks)
  and the FRED Services Terms of Use. FRED frames use as "non-commercial, educational, and personal";
  commercial use is allowed only subject to extra restrictions and per-series status: "Copyrighted: Pre-approval
  required" series need the owner''s permission for anything beyond personal use, "Copyrighted: Citation
  required" series may be used with attribution, "Public Domain: Citation requested" series are free.
  Prohibited uses include presenting FRED data as a unique product/replicating the FRED experience, altering
  FRED visualizations, disruptive scraping, and using FRED content to develop or train software/ML/AI
  systems. Termination clause requires destroying API copies on termination (storage_caching left unknown).
  Apps must show the "not endorsed" notice and link to the API terms. Result depends on which series are
  used, so ambiguous (yellow); many series (BLS, BEA, Fed) are likely usable with citation but this was
  not verified per series.'
