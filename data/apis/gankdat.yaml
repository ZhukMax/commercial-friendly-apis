notes: Terms section 7 gives a per-dataset licence table (OGL v3 for most UK datasets, TED Commission
  Decision, SAM.gov public domain) and a general commercial-use grant subject to each source licence;
  reselling/mirroring the API itself is forbidden. Sanctions and exclusion datasets are restricted to
  compliance/due-diligence/research use, and 'Blind Mode' datasets forbid identifying individuals. Caching/storage
  of responses is not addressed, so storage_caching unknown and verdict unknown. Requires an API key (free
  tier exists).
