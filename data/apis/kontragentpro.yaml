  API terms (API docs at /api/v2/docs mention prepaid deposit, per-key rate limit). auth updated: API
  v2 uses a Bearer key (only the basic company card works without a key at a lower rate limit). Underlying
  data is Russian state registers (FNS, FSSP, GIR BO etc.); upstream terms not checked.'
