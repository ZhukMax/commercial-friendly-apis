notes: Read the Blizzard Developer API Terms of Use (last updated 2019-10-01; the developer portal pages
  are an SPA, the terms live on blizzard.com/legal). The licence allows distributing Data to end users
  via a registered Application, but forbids using APIs/Data for marketing or monetization, displaying
  Data in any advertising, selling/licensing Data, charging premiums for the app, and requires a 30-day
  maximum data TTL and a privacy policy. A site with ads or affiliate links is outside the licence ->
  red. Blizzard reserves the right to charge in future. Game data (WoW, Diablo III, Hearthstone, StarCraft
  II) is Blizzard IP; the API terms grant no other IP rights. develop.battle.net 301-redirects to community.developer.battle.net.
