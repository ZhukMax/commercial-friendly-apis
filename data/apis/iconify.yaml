notes: 'Iconify is an aggregator of 200+ third-party open-source icon sets (264-280 sets). The API/software
  is Apache-2.0 and the public API servers are free to use, with no commercial-use restriction found,
  but the icon data licence is per set: from the live /collections endpoint, about 148 sets are MIT, 53
  CC BY 4.0, 31 Apache-2.0, 13 OFL, plus CC0, ISC, BSD, Unlicense, and also CC BY-SA, GPL and two non-commercial
  sets (CC BY-NC 4.0, CC BY-NC-SA 4.0). So attribution and share-alike obligations, and even commercial
  permission, depend on the specific set; choose permissive sets (MIT/Apache/CC0) and record each icon''s
  licence. Public API limits are not quantified; the docs say it is mainly meant for Iconify components
  loading icons on demand and other use must not be abused, and recommend self-hosting for unlimited use.
  No separate ToS page was found.'
