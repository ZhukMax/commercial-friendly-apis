notes: 'Developer ToS forbid caching/storing local copies (only session-based caching of the formatted
  display), selling the data or running a clone/proxy, and require the Exhibit A attribution (Wordnik
  logo/credit). Commercial apps are explicitly allowed; "commercial uses" banned in the ToS means charging
  end users for the data itself. The free Basic plan is described as for nonprofit or research use with
  only a free trial for commercial use, so commercial use needs a paid plan (Hobby $10/mo and up): marked
  paid-only, medium confidence. Data is a mix of upstream dictionaries (AHD, Century, Wiktionary, GNU,
  WordNet) whose own licences may add conditions (not assessed). Data licence not stated on a page read;
  characterised as: proprietary / mixed upstream (AHD, Century, Wiktionary, GNU International Dictionary,
  WordNet).'
