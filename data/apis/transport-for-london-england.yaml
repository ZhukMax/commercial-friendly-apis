notes: The API portal (api-portal.tfl.gov.uk) says the open data is for use in own software and services
  under the transport data terms and conditions; those terms (page rendered via Playwright; curl got an
  empty shell) give a worldwide, perpetual, royalty-free OGL-style licence incl. commercial exploitation,
  with attribution and branding-guideline conditions. share_alike = no inferred from the absence of an
  SA clause. Caching is covered only by the generic "copy" right (no explicit cache rule) and TfL may
  revise the licence without notice and does not guarantee continued supply. Does not allow scraping the
  Oyster, Congestion Charging or Santander Cycles websites. Registration with an app key is needed.
