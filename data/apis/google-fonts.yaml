notes: 'Pages read: developers.google.com/fonts/terms (API ToS, defers to Google APIs ToS), developers.google.com/terms
  (Section 5e Prohibitions on Content), fonts.google.com/faq (read via Playwright in a fresh context because
  JS-rendered), Developer API page. Two levels: the fonts themselves are open source and free for commercial
  use under their licences (OFL etc.), but the Developer API metadata falls under the Google APIs ToS,
  which, unless the content owner permits, bars building databases or permanent copies, keeping cache
  longer than the cache header, and distributing/publicly displaying API content to third parties. Because
  the font licences (content owner permission) and the API ToS pull in different directions for storing/showing
  the metadata, storage and display are ambiguous (yellow). Per-font licence still has to be honoured
  (OFL has a reserved-name rule and no selling fonts alone).'
