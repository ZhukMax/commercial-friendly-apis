notes: 'Read via Playwright (JS pages): Blockchain.com API Terms (/legal/api-terms), the Explorer API
  docs and pricing page (Free 300 req/day up to Enterprise; Basic is ''for personal projects, development,
  and testing''; no commercial-use statement). API Terms (older API Program, key-based) allow retrieving
  public Bitcoin blockchain data and market prices only for the ''Permitted Use''; forbid commercialising
  (sell/rent/lease), copying, storing or caching the content beyond the agreement, distributing it from
  any place other than your Site, and require Certification of the display. No explicit statement allowing
  or forbidding ad-supported commercial use, hence ambiguous. Unclear whether these API Terms still govern
  the newer Explorer API (the legal footer still links them). blockchain.com and blockchain.info are the
  same company (docs page shows ''Advertise on Blockchain.info''). Sibling entry exists with the same
  terms (blockchain / blockchain-blockchain). Underlying data is public blockchain data; market prices
  are aggregated from multiple sources. data_license left unknown: proprietary terms, no named licence.
  Merged duplicate entry `blockchain-blockchain`.'
