notes: Read the API page (metmuseum.github.io) and the Open Access GitHub README. CC0 applies to the Open
  Access datasets and to public-domain images the API returns; artworks still under copyright are identified
  in the data but their images are excluded. Attribution is only requested ('consider'), not required.
  The linked site terms page (metmuseum.org/information/terms-and-conditions) timed out in the browser
  and curl hits a Vercel bot checkpoint, so it was not read; hence medium confidence.
