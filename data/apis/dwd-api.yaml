notes: dwd.api.bund.dev is an unofficial community OpenAPI description (bundesAPI) of the undocumented
  DWD app backend (app-prod-ws.warnwetter.de); it is not an official DWD API and carries no terms of its
  own. DWD legal notice (German) says all freely accessible geodata and geo services of DWD may be reused
  under CC BY 4.0 with a source note. Whether the app backend is formally covered, and its stability,
  is not stated, so commercial_use is ambiguous and confidence low. Official DWD open data (opendata.dwd.de)
  is the safer source. Storage/display not addressed explicitly.
