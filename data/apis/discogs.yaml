notes: 'API Terms of Use (last updated May 27 2025) read via Playwright (Zendesk page); the developers
  page https://www.discogs.com/developers/ also read. Two tiers: CC0 data (release titles, track lists,
  credits, artist/label names) and Restricted Data (user data, marketplace data, images etc.) which may
  not be used for any commercial purpose or transferred to third parties. Commercial use of the API is
  ''generally permitted'' but listed prohibited uses include selling access to the API/Content and driving
  traffic to non-Discogs sites (affiliate links are a risk), at Discogs'' sole discretion, hence ambiguous.
  Content older than 6 hours must not be displayed and may not be stored longer than needed; a mandatory
  dofollow backlink is required, so at best yellow. Unauthenticated use ends 1 Dec per the developers
  page. Images are mostly third-party (cover art) and not CC0.'
