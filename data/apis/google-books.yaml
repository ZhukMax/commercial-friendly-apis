notes: 'Books-specific terms (last modified 2012) add: no fee charged to users of the app without Google
  permission; remove infringing content on request. Ad or affiliate monetisation is not a user fee, so
  not barred in the text read, but commercial use is not expressly granted either, hence ambiguous. Google
  APIs ToS (developers.google.com/terms, "Prohibited" list) forbids permanent copies/databases and caching
  beyond the cache header, and also lists copying/publicly displaying API content to third parties; display
  of Books API content is the normal use case but the generic clause is vague. Books Branding Guidelines
  (attribution/links) not read. Treat as: live API only, no long-term storage.'
