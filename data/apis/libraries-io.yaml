notes: Terms and Conditions page states the data is CC BY-SA 4.0 and the footer repeats 'Data is available under CC-BY-SA 4.0 license'; the CC BY-SA 4.0 deed was read for the copy/redistribute grant. Free
  API needs a registered account and key; larger-scale access is sold by Tidelift. Libraries.io Terms also say the name/logos are Tidelift trademarks and may not be used without permission. Data is 'scraped
  from the internet and not validated' (data page), including package licence fields drawn from upstream registries whose own terms were not checked. Share-alike makes this yellow.
