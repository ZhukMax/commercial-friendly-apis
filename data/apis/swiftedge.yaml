notes: 'Read https://swiftedge.uk/terms and /developers. Free API/MCP: own tools, bots, articles and AI
  apps with a visible credit and link; showing data in another website/app/product is barred unless on
  the Business plan (paid, prices not verified). Storing/redistributing the data or history needs written
  permission; building a competing feed or reselling is banned. Free-tier display in an ad-supported site
  is therefore ambiguous; paid Business plan explicitly allows showing data to others. Data comes from
  exchanges (e.g. Hyperliquid, Lighter) and the terms say Swiftedge is not affiliated with them; upstream
  terms not checked and may be stricter.'
