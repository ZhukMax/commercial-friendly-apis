notes: 'Developer API page: free, key-free, fair-use, display allowed if a visible crawlable credit link
  is kept; also keep the "estimate, confirm on official AT simulator" note. Site Terms (updated Aug 2026)
  forbid commercial use of website content without authorisation and say the API is provided "on a fair-use
  basis ... may change or be unavailable at any time"; neither page says outright that ads/affiliate sites
  may use API results, nor addresses storage, so commercial_use=ambiguous, storage unknown. Self-hosting
  applies to the open-source calculators (ISV/IUC), not necessarily the valuation data (built from live
  Portuguese listings, third-party rights not assessed). Open-data page /en/open-data returned 404. Data
  licence not stated on a page read; characterised as: proprietary / unknown (no data licence stated).'
