notes: 'Free, keyless API (docs: no account, no key; auth fixed none). Terms of Service license users
  to call the endpoints and show or quote responses, keeping cited sources and the disclaimer, and forbid
  reselling or republishing the knowledge base as a whole or a substantial part. Terms do not mention
  commercial use either way (ambiguous); they say ''No fee applies''. Long-term storage not addressed
  beyond the 1-hour HTTP cache hint. Responses must not be presented as medical advice or diagnosis. Records
  aggregate ClinVar, PharmGKB, CPIC, DPWG, dbSNP, OMIM etc., whose own licences may be stricter (explicitly
  not changed by DeepDNA). Terms last updated 14 Nov 2026.'
