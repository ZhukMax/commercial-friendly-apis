notes: 'Read the developer page (Polish). FAQ says commercial use is allowed while keeping source licences
  and crediting Mapa Oswiatowa. Licence depends on the field: OpenStreetMap-derived fields (hours, accessibility,
  social profiles, whole entries without a register id) are ODbL 1.0 (share-alike for derived data); PRNG/GUS
  BDL/SIO register listing CC BY 4.0, kindergarten sheet and trades set CC0; photos from Wikimedia Commons
  keep their licences. The API must not be used to rebuild the site''s database (referenced regulamin
  not read), so storage is ambiguous. Yellow.'
