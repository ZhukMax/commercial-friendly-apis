notes: 'ToS last updated Oct 20 2026. Very permissive section 6 (commercial, caching/storing, publishing,
  even resale; no attribution; no retention deadline). Not allowed: offering a substitute sports-data
  API/feed, sharing keys, claiming official league data. Data is compiled from third-party sources; the
  ToS says its permission does not clear third-party (league/team) rights, which are the user''s responsibility.
  auth set to apiKey: an account is required (free tier 5 req/min). Free tier scope: terms do not distinguish
  tiers.'
