notes: Read daily.dev ToS section 18 Public API. Licence is for personal internal use or per-user tools
  using each end-user own token; serving API data to others, resale, standing copies/caching beyond need,
  ML training and competing products are banned. Section 18.3(vi) permits displaying titles/summaries/tags
  with attribution and source link, which conflicts with the ban on making data available to others, so
  display is ambiguous. Not usable for a public commercial site.
