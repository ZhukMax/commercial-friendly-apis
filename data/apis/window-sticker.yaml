notes: 'Short terms: use for anything lawful; no warranty. PDFs (manufacturers'' labels): no bulk-harvesting,
  no reselling, no paywall/signup wall; attribution link appreciated but not required. Storing/showing
  rights are spelled out only for the paid parsed fields (Options/Pro plans; not resell/relicense as dataset
  or API); rights for the free label PDFs and decoded spec are not stated beyond the restrictions, so
  storage and display = ambiguous. Toyota/Lexus/Nissan/Infiniti labels come via a third-party dealer-website
  platform or are Nissan "Unofficial Copy" docs; manufacturers hold the underlying copyright. Key becomes
  mandatory 2026-12-02. Data licence not stated on a page read; characterised as: proprietary / manufacturer
  documents (labels are manufacturers'' own PDFs; decoded spec is NHTSA vPIC).'
