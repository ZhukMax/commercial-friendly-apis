notes: 'Read the HUD User API Terms of Service, the FMR and Income Limits API page and the HUD User Disclaimer
  of Liability and Endorsement page. The ToS is the same template as the Census and BEA API terms: you may
  build a service that displays and analyzes the data, must show the non-endorsement notice prominently and
  must not modify content while naming HUD User as the source. It never says commercial use is allowed, says
  nothing on storage, and no public-domain or licence statement was found on huduser.gov, hud.gov Web Policies
  or the HUD ArcGIS items for Fair Market Rents (2026-11-22), hence commercial_use ambiguous and verdict yellow,
  like census-gov. Nothing forbids commercial display. A free access token is required.'
