notes: 'Read https://allratestoday.com/terms (updated Nov 2026) and the central-bank-rates page. ToS:
  the free tier and keyless official-rate endpoints may NOT be used in a commercial product, paid service
  or public display (websites, apps, kiosks); these uses require a paid plan. Exception: open ECB endpoint,
  /api/compat/ and widgets may be used commercially keyless with a visible link. With an API key attribution
  is appreciated but not required (except digital signage). Reselling/redistributing API data without
  permission is banned. Caching is suggested on the product page but not formally granted in the ToS,
  so storage_caching rests on that weak marketing sentence (treat as medium). Aggregator: rates come from
  121+ central banks and tax authorities; those publishers'' own licences (often attribution/non-alteration)
  were NOT checked and may be stricter. Paid plan prices not verified. Description says keyless latest
  table, which is the part restricted by the commercial clause.'
