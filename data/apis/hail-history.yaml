notes: hail-history-noaa.netlify.app/api-docs.html 301-redirects to whathitmyhouse.com/api-docs.html (service "What Hit My House"); the API docs page returned only a stub via curl (JS-rendered, not read).
  Its Terms of service (whathitmyhouse.com/terms, updated 11 August 2026) say the data is built on public-domain federal sources (NOAA NEXRAD hail detections, NWS storm reports) and mention a free keyless
  API, but state nothing about commercial use, caching or display of API data; acceptable use forbids reselling their reports and bulk scraping the site. Terms fields left unknown. The business sells reports
  and sells leads to roofers, so reuse of its derived data may be limited; ask the operator.
