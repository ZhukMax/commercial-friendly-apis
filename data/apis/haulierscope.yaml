notes: 'Read developers page and Terms of use (Part A). API is free, keyless, usable with attribution
  within rate limits; but terms forbid bulk copying/republishing or building a database/directory/service
  from the site or database (they point to DVSA''s own OGL file instead). Commercial use not explicitly
  addressed (monitoring is sold to businesses); caching up to 5 min recommended, longer ''fine for most
  uses'' vs no database-building: storage and display ambiguous. Underlying DVSA data is OGL v3.0 and
  can be taken directly from DVSA.'
