notes: 'Read via Playwright (fresh context): API docs (api-d7 REST, read-only, JSON/XML), Drupal.org Terms of Service (content is CC BY-SA 2.0, code GPL v2+, ''except where the content is shared from a
  third-party source where the license is cited'', so per-item licences can differ) and the ''Use of Automation Tools, including AI'' page (reads allowed by default but rate limited; passive tools may be
  blocked; automations that act on the site need approval). CC BY-SA 2.0 deed read for commercial use/attribution/share-alike. Share-alike makes this yellow. The API also exposes user and comment records
  (personal data), which the licence does not clear for reuse. Docs ask for an appropriate User-Agent and single-threaded requests.'
