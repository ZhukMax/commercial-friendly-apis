notes: 'Read /nutzungsbedingungen (5 Nov 2026), /docs and the root page. Aggregator of third-party open
  data: the hub adds no licence of its own, each response carries source licence and a licence_status
  (green = commercial reuse allowed, yellow = check source terms, share-alike). Terms warn that some sources
  are non-commercial and some are share-alike, and that for source-routes endpoints only the source''s
  own terms apply. So commercial use, caching and display are decided per source/endpoint and cannot be
  given a blanket yes (verdict yellow; individual green endpoints exist). Resale of the service as your
  own offering needs consent. Free, no key, no SLA; single-person operator.'
