notes: 'The portal is a JS app; read with Playwright: /download and the RIDB API Access Agreement (https://ridb.recreation.gov/access-agreement-ridb).
  Agreement is between user and API vendor (Booz Allen Hamilton for the Forest Service). It does not explicitly
  allow or forbid commercial use, caching or display; it forbids copying/distributing the API Vendor Materials
  (API, documentation, key), sharing the key, building a substitute API, implying government endorsement,
  misrepresenting the source, and using the data with content about gambling, tobacco, drugs, etc. Daily
  CSV/JSON bulk download and historical reservation files are offered. Core fields not confirmed, so ambiguous/unknown;
  a data licence for the content (US government data) is not stated. Requires API key.'
