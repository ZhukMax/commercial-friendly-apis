notes: 'Two levels. DATA: ODbL 1.0 allows commercial use with attribution and share-alike for adapted databases (produced works are different; legal check needed). SERVICE: the listed ''API'' is the editing
  API, which the OSMF says is not for read-only use or projects; heavy users must use planet.osm/extracts, Overpass or their own server, and OSMF warns that access of commercial services may be withdrawn
  at any point. Public Nominatim/tile servers have their own policies (not part of this entry; Nominatim forbids autocomplete, bulk and reselling geocoding). So commercial_use applies to the data / self-hosted
  or third-party OSM services, not to the free public API. Verdict yellow because of share-alike and service restrictions.'
