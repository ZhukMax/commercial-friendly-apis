notes: Read DeepScout General Terms and Conditions (deepscout.ai/en/terms) and docs.deepscout.ai intro.
  It is a paid scraping and product-matching service for competitor monitoring (pay per product; trial
  credit); the terms say the data is scraped from public websites and the user is solely responsible for
  legal compliance (copyright, privacy), forbid misuse/resale/unauthorized redistribution of data and
  sharing access outside the organisation. 'Unauthorized purposes' is undefined, so commercial use and
  display are ambiguous. Marketing pages mention building price-comparison sites, but that is not a licence.
  Upstream shop data (prices, images) belongs to the scraped retailers and may be stricter. Storage terms
  not found.
