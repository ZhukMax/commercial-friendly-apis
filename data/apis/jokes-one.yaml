  to all the restrictions listed under section #2", yet the same section lets you reproduce the jokes
  in your applications with credit. That is contradictory for a commercial site, so commercial use is
  ambiguous (verdict yellow, resolve with the owner before relying). Cache/store limit 8 hours. Scraping
  jokes.one content for other products is forbidden. Jokes are user-submitted content of unclear authorship;
