notes: 'Read the API Terms of Service. Default licence is non-commercial only; commercial use needs a
  separate commercial use agreement via partners@last.fm (terms not public; Last.fm reserves a right to
  share in revenue), hence commercial_use=ambiguous (not paid-only: no page says a paid plan). Storage
  is capped at a 100 MB Reasonable Usage Cap, and caching must follow HTTP headers. Public pages using
  the API need prior written approval from Last.fm (clause 2.7) and a mandatory "powered by AudioScrobbler"
  button (more than plain credit). Data includes artwork and tags tied to third-party music rights; the
  API grants no rights in the underlying music. Rate limits are set at Last.fm discretion (clause 4.4),
  no number given.'
