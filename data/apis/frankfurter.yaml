notes: 'Homepage FAQ: free for commercial use (blended rates are Frankfurter''s own calculation; direct
  provider-endpoint queries remain subject to each provider''s terms), storing rates locally encouraged.
  License page: data are public reference rates from ~112 central banks/official sources; Frankfurter
  ''can''t give you rights the provider doesn''t'' and lists each provider''s terms (many ''None published'',
  some with Terms links, not individually checked). Hence display/redistribution = ambiguous (depends
  on upstream provider), attribution unknown (the ''Provider Attribution'' heading only describes the
  expand=providers option). Code MIT, self-hosting possible.'
