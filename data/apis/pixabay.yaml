notes: 'Read https://pixabay.com/api/docs/ (curl) and /service/terms/ and /service/license-summary/ (Playwright,
  curl is blocked). Content License allows commercial use without attribution for the images themselves,
  but the API docs ask API users to show where images come from (plain source credit). Permanent hotlinking
  of image URLs is forbidden: download images to your own server first (videos may be embedded); API responses
  must be cached 24 hours. Prohibited: selling/distributing Content on a standalone basis, using it as
  part of a trademark/business name, mass scraping, lots of automated queries. Content showing recognisable
  people, logos or brands carries third-party rights (the licence says consent may be needed for commercial
  use); Pixabay grants no rights in those. Free API key required. The listed URL is the Slovak-language
  page; docs read in English.'
