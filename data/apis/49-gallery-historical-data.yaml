notes: 'Read /terms and /docs (Chinese). Dataset is Macau/Hong Kong lottery gallery and result history
  (third-party public content with source URLs and images; the API operator does not claim a licence over
  it and gives no upstream licence). Terms: free, suited to archiving, development and statistical research;
  credit source name + URL when displaying publicly; do not claim official authorisation; prohibited:
  betting transactions, top-ups/prize redemption, profit guarantees. Commercial use is never addressed
  (ambiguous); a commercial/ads site about lotteries risks conflict with the betting ban and with local
  gambling laws. Caching is expected of the caller but no duration/limit given. Image copyrights belong
  to upstream sources (not checked).'
