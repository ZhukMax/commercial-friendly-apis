notes: Read img.icons8.com (OMG-IMG hotlink service) and icons8.com/license (read via a fresh Playwright
  page; icons8.com is behind a Cloudflare check for curl). Free use is conditional on a visible link to
  icons8.com on every page using the icons (website footer acceptable), or a paid licence; the full licence
  text ('Read full license') and Terms and Conditions (/terms 404, link in footer) were not read, so commercial
  use of the free licence is not stated explicitly (commercial_use ambiguous) and storage/caching is not
  addressed (the OMG-IMG page only says you do not need to store icons). The mandatory backlink on all
  pages makes this at best yellow. Free output is limited to PNG up to 512px; app/web service integrations
  are pointed to the paid API.
