  key (higher limits); upstream says none. Caveats: do not try to identify sole traders/persons shown
  without names; unsolicited marketing to companies from this data is generally unlawful under UWG section
  7; reuser is responsible for data protection compliance. Single-person operator; terms may change (4
  weeks notice for shutting API). Administrative boundaries are BKG dl-de/by-2-0.'
