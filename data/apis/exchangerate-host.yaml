notes: Official terms at https://exchangerate.host/terms (service run by apilayer, Austria; the text names
  exchangeratehost.com). Keyless access ended in 2023; an API key is required and limits depend on subscription
  plan (home page advertises a free 100 requests/month plan). Terms grant a limited, revocable licence
  to display data to end users 'for their own personal use' and 'for reference'; the restrictions list
  contradictorily forbids to 'reproduce, copy ... display ... exploit' the data, forbids storing after
  termination, and forbids end users storing/distributing it. No explicit ban or grant of commercial use
  of the site. Internal conflict and vague wording = ambiguous; caching/storing rates in own DB appears
  not permitted, so treat as display-only live proxying at best. Attribution is only 'highly appreciated'.
  Consider ECB-based Frankfurter instead.
