notes: 'Read the AirNow API FAQ and the AirNow Data Exchange Guidelines (PDF, Aug 2025, read via pdftotext). Conditions: credit the source agencies and EPA AirNow, do not alter values/forecasts, show the
  official AQI colours, label observations as preliminary, tell the agencies about products. Caching hourly/daily is recommended; filling your own database through the web services needs contact with the
  AirNow DMC (hence limited). No sentence states whether commercial use is allowed, so commercial_use is unknown (verdict unknown) even though nothing prohibits it.'
