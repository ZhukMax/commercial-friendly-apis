notes: Read the PubAPI docs (/news/view/published-data-api) and the Chess.com User Agreement. The PubAPI
  page has no licence, commercial-use or attribution clause, only brand/IP rules (do not reuse Chess.com
  palettes, pieces, sounds) and a request to write to legal@chess.com if unsure. The User Agreement, section
  on User Game Activity (UGA = game records, which PubAPI serves), grants a licence that excludes selling
  or commercial use, data mining/robots and downloading beyond page caching; it also restricts AI training
  without written authorisation. Because the API page invites use but the agreement restricts commercial
  use, commercial_use is ambiguous; display/attribution not stated -> unknown. Profile data and avatars
  are user content.
