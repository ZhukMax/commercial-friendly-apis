notes: Read CGU/CGV (art. 8-9) and docs. Results may be used 'in the course of professional activity'
  but raw data may not be resold without added value and source DBs may not be rebuilt; source licences
  (Etalab 2.0, INPI RNE, ODbL) apply. Nothing explicit on caching/storage of results, so storage_caching
  unknown; display is ambiguous (no explicit display clause, only the resale limit). OSM attribution is
  mandatory only for /route/* results (Business plan). Company-director data has extra restrictions (no
  prospecting lists). Services are B2B only. Not verified that the free Discovery plan has different terms.
