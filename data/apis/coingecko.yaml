notes: 'Listed URL redirects to https://www.coingecko.com/en/api; terms are at /en/api_terms (opened via
  Playwright, Cloudflare blocks plain fetch). The ToS grants a licence to use the API in any application/website/service
  and requires prominent ''Powered by CoinGecko'' (font >= 10) per https://brand.coingecko.com/resources/attribution-guide.
  The pricing page table shows ''License: Commercial'' for Basic/Analyst/Lite/Pro, while the free Demo
  column has no licence label and says ''Attribution required''; the ToS text I read does not state explicitly
  whether Demo may be used on a monetised site, hence ambiguous. ''Commercial redistribution license''
  is listed only under Enterprise, so passing raw data on to third parties (resale/feeds) needs Enterprise;
  showing prices on your own pages is the normal use case. Demo-plan rate limits not captured. Safest
  path for a commercial site: paid plan + ''Powered by CoinGecko'' + cache refresh <= 24h. Terms may be
  changed by CoinGecko; keyless public API exists for prototyping.'
