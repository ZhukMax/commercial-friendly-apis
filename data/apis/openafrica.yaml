notes: 'Portal (CKAN) of Code for Africa. africaopendata.org redirects to open.africa; curl is blocked
  by Cloudflare (403), so pages were read in Playwright (fresh browser context): /about/terms-and-conditions,
  /about/faq, /about. Portal-wide statement: terms are those in each dataset''s licence/constraints field,
  otherwise the Open Government Licence; FAQ says OGL permits commercial use. Datasets are uploaded by
  many organisations/volunteers and per-dataset licences may differ (none were checked), so storage/display/attribution
  stay ambiguous/unknown and confidence is low. FAQ/T&C text appears copied from data.gov.uk (refers to
  data.gov.uk, UK OGL), which adds doubt about which OGL version applies. CfA own content: CC 4.0. Contains
  the CKAN API (no key needed to read public data).'
