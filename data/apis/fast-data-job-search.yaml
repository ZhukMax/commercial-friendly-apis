notes: 'Not a data source in itself: an Apify Actor (scraper/aggregator run on your own Apify account
  with an API token, pay-per-result; there is also an x402 route). Aggregates Arbeitsagentur, Arbeitnow,
  Remote OK, Himalayas and company ATS boards. Apify Actor Terms say the user retains IP rights in Actor
  Output, but that does not grant any rights in the third-party job content. The Actor page only claims
  the data is legal to use (marketing) and says Remote OK and Himalayas postings must link back as those
  sources API terms require; each upstream source (e.g. Bundesagentur Jobsuche API, Arbeitnow, Remote
  OK) has its own terms, not read here. Commercial use, caching and display therefore unknown; attribution
  flagged ambiguous (required for some upstream sources only).'
