notes: Read Foursquare Places API (Self-Service) End User License Agreement (last updated Feb 29, 2024),
  plus Developer Master Terms and the Platform & Acceptable Use Policy. The EULA allows displaying Places
  Data in your own website/product but with mandatory "Powered by Foursquare" credit, no bulk/systematic
  access for third parties, pages must be reasonably protected from crawling, "Calculated Scores" attributes
  may only be used internally, and the AUP bans trial/evaluation credentials for commercial use and share-alike
  open-data mixing. Caching limits live in the developer Usage Guidelines (docs page returned no readable
  text), so storage is limited/unknown in detail. The EULA does not explicitly say "commercial use is
  allowed"; it licenses any site/product/service you own and is pay-as-you-go, so commercial_use=yes is
  an inference from that grant (medium confidence). Enterprise agreements override these terms. Foursquare's
  separate open-source Places dataset was not assessed.
