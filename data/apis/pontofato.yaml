notes: 'Pages read (Portuguese): Termos de uso, API catalogue/llms.txt. The terms state the public /enderecos/ data is ODbL 1.0 and may be used, shared and adapted, even commercially, with credit and a
  link; a published derived database must stay under the same licence (share-alike, hence yellow). The licence explicitly does not cover personal data (LGPD) or the paid resources (neighbourhood beyond
  free quota, reports). Company (CNPJ) data in /api/cep comes from Receita Federal public registries; the ODbL statement names /enderecos/ only, so scope of the free /api/cep lookup is not 100% clear. Storage
  rests on ODbL summary (copy/use database) applied by the site statement. Upstream cors "no" not re-checked; the catalogue says free lookups send Access-Control-Allow-Origin: *.'
