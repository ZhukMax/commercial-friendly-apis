  on public websites without written permission, mirroring, and retaining content beyond what is strictly
  necessary (expanded caching needs a written addendum). The two clauses are in tension for a public site,
  hence ambiguous; leaning restrictive. No explicit commercial-use statement, so commercial_use unknown.
  Device images/specs may carry third-party rights.
