notes: 'Read the portal''s Public Data Usage Policy and Terms (English page). Data licensing is per dataset
  using KOGL types: Type 0 (free use, no attribution) and Type 1 (attribution) allow commercial use; Type
  2 and 4 are non-commercial only; Types 3 and 4 forbid derivative works. So commercial use depends on
  each dataset''s KOGL marker: ambiguous at portal level. Storage/caching and display are not addressed
  at portal level: unknown. API access needs a member account and service key (auth apiKey consistent).
  Rate limits not read.'
