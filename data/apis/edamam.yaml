notes: 'Read API Terms of Use (last revised 28 Feb 2023) and the attribution guidelines via Playwright
  (JS-rendered). Free version: personal / not-for-profit only; commercial use needs Edamam''s express
  authorization / a paid plan (plan-level terms and prices not read). Copying or archiving Edamam Content
  is prohibited without prior written consent, so permanent storage is off the table. The licence lets
  you build an app/site that lets customers use the integration, but also bars ''publicly displaying ...
  except as expressly authorized'', hence display is ambiguous. ''Powered by Edamam'' attribution is required
  on any plan. Third-party content (recipe images, text) carries its own rights.'
