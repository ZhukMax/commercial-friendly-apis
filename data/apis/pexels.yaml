notes: 'Read /license/, /api/ (FAQ) and /api/documentation/ (Guidelines) via Playwright (curl gets a Cloudflare challenge). Two levels: the Pexels License lets content be used commercially (ads, websites,
  apps) but forbids redistributing/selling it on other stock or wallpaper platforms, selling unaltered copies, and implying endorsement by people/brands shown; identifiable people and brands carry third-party
  rights the licence does not clear. API guidelines require a prominent link to Pexels next to results (text link or logo) and credit to photographers when possible: this is a mandatory link, but it is
  a plain credit link, not a logo-only or dofollow demand. Do not copy the core functionality of Pexels (no wallpaper apps). Storage/caching is not addressed on the pages read, so unknown. The /api/ page
  currently says new API key issuance is paused. Terms of Use prohibit scraping outside the API.'
