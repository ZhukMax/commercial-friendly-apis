notes: 'Read https://scrappa.co/legal/terms-of-service (updated 8 Sep 2026; section 8 Data and Content).
  Provider permission: commercial/non-commercial applications, storing, caching, display to users. Reselling
  API output as a standalone dataset/feed or reselling access needs written authorization. The permission
  governs only the relationship with Scrappa: output may contain third-party content, no third-party licence
  is granted, and the user must clear attribution, retention, redistribution and AI/TDM restrictions of
  sources (Google, Maps, review sites). Hence verdict_override yellow. attribution_required left unknown
  (no attribution clause found). Requires API key.'
