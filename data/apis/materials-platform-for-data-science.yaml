notes: 'Read via Playwright (the terms open as a JS dialog at mpds.io/#formal/api and #formal/terms).
  Only a limited "open" subset is CC BY 4.0 and free via API; the rest of the database (about 3M datasheets)
  is proprietary and sold (API full access from EUR 9,500/year per mpds.io pricing). The API licence is
  per single Designated User, non-sublicensable and bans providing the API as a service; CC BY would allow
  commercial reuse of the open subset, but how that combines with the API licence is unclear, hence ambiguous.
  Website terms forbid scraping outside the API. Storage of API results not addressed.'
