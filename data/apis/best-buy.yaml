notes: Read developer.bestbuy.com/legal (API ToS, last updated 23 Feb 2021) in full. Licence is limited,
  revocable and covers apps or websites you operate 'in connection with offers to sell or sales of' Best
  Buy products (affiliate-style); a generic ad-supported site or use for the benefit of third parties/other
  retailers is not covered, hence commercial_use=ambiguous. Content for Games, CDs, DVDs and Blu-ray titles
  is excluded unless Affiliate or separately signed. Caching max 72 h (docs say links expire after 7 days).
  Branding guidelines require the Best Buy logo. Display on your own site is granted but with no modification
  and no removal of ads; kept ambiguous. Data is a retailer's own catalogue.
