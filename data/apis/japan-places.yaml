notes: 'Read /terms (updated 2026-10-21), /attribution, /limitations and the home page. Free tier (CC
  BY 4.0) explicitly allows storing, caching, modifying, commercial use and redistribution with attribution;
  the attribution page repeats this ("Storage & caching: Permitted (unlike Google Places)"). Per-record
  upstream licences and attributions (Overture CDLA-Permissive/Apache/CC0, Japanese municipal CC BY/PDL,
  MLIT, e-Stat, custom licences for MOJ registry maps and block-level reference) must be preserved when
  redistributing raw POI data, so downstream obligations vary by record. Only the municipality and quality
  endpoints are free; paid signals need a paid plan or x402 payment. New service (young, self-run), hence
  medium confidence.'
