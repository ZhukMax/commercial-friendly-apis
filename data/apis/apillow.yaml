notes: Read apillow.co/terms.html (effective 2026-08-26), /docs.html and home page. Third-party scraper
  of zillow.com. APIllow licenses you to use responses inside your own application during your subscription,
  but states the data belongs to Zillow, makes no representation that any use is authorised by Zillow,
  and puts the burden of complying with Zillow's own terms on you (Zillow's terms were not read here;
  Zillow generally restricts scraping and republication of listing data, so treat as high risk). Resale
  as a competing API is banned. Caching after the subscription ends is not addressed; commercial use is
  neither granted nor denied for Zillow's content, hence ambiguous (yellow at best). Photos, agent contact
  data and Zestimates are included in responses, which raises additional rights/privacy issues.
