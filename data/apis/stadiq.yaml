notes: Read the developer page and the Dutch terms (voorwaarden, read via Playwright because the page
  is JS-rendered). Stadiq aggregates public data (GIPOD road works, De Lijn realtime, IRCELINE air quality,
  Antwerp open data); the terms say the underlying data stay with their sources under their own licences,
  so upstream conditions apply and may be stricter. The free Developer plan is "build and evaluate", the
  paid plan (29 EUR/month, for businesses) is "production volume"; no explicit commercial-use sentence,
  hence ambiguous. Terms ban reselling the data as your own product or building a service that directly
  replaces Stadiq. Caching not addressed.
