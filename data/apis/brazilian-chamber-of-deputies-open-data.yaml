notes: Read the open-data portal home, FAQ and 'sobre dados abertos' (data free of charge, no registration,
  no API terms/rate limits stated) and the Câmara's general Terms of Use (termo-de-uso-e-politica-de-privacidade),
  which says portal information is public domain and may be reproduced with source citation. The open-data
  subsite has no licence page of its own, so applying the portal terms to it is an inference; commercial
  use is not mentioned explicitly, hence ambiguous. Personal data of deputies/staff is excluded from the
  dataset (Ato da Mesa 45/2012 limits what is published). Storage/caching not addressed.
