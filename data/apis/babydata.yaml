notes: Read /api/ and /terms/. The API page says the API output is CC BY 4.0 (reuse with attribution),
  but the site Terms of Use say not to scrape or republish content or data commercially without permission,
  and that other commercial use needs written permission. Conflicting, so ambiguous (at best yellow).
  The API is a set of simple calculators (due date, ovulation, SMP) built on NHS/gov.uk rules; underlying
  ONS/NRS/NISRA names data are under their own OGL-type terms (not checked). Calculator results are computed,
  not stored datasets.
