notes: 'Only the vendor FAQ on jobdatafeeds.com/pricing was found to address use: showing postings on
  a job board and storing them in your own DB is allowed, reselling raw postings to third parties is not.
  The binding terms are NOT on the vendor site: its Terms of Service (jobdatafeeds.com/terms, v1.2.0)
  govern only the website and state that API subscriptions via RapidAPI are governed by the RapidAPI terms
  and your subscription agreement, AWS data by the AWS Data Subscription Agreement, and direct deals by
  a signed contract. Those were not read (RapidAPI listing is JS/behind login), so confidence is low.
  Postings are crawled/scraped from third-party portals, ATS pages, employment offices and LinkedIn, so
  upstream rights and terms may be stricter. Free BASIC plan exists on RapidAPI. Attribution not addressed.'
