notes: 'Site-wide Terms of use (updated 2026-10-31) are a short generic text: lawful use only; no reselling,
  redistributing or building a competing data product without written permission; data from ''public listings
  and official databases'', no accuracy guarantee. Nothing explicit on commercial use, caching/storage
  or displaying the figures on a third-party site, so commercial_use and storage unknown and display ambiguous
  (redistribution banned, display not addressed). Pro plan ($29/month) announced but not open. Sold prices
  are derived by watching Vinted/eBay listings; Vinted has no official API and the page says it is not
  affiliated with Vinted, so upstream marketplace terms are unaddressed and may be stricter.'
