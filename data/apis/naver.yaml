notes: 'Read NAVER API service terms (Korean, revised 2026-10-07). Clause 7.3(4) bans showing ads together
  with API result screens for all NAVER APIs; the Search API supplement (2.3) additionally bans copying/storing/caching
  data, providing or selling it to third parties, feeding it to AI, and showing ads on pages with results
  or otherwise earning revenue from the Search API. Only short caching is allowed (2.4). Terms also say
  Search, Search Trend and Shopping Insight are moving to NAVER API HUB (new sign-ups closed from 2026-07-30;
  Shopping/Books/Academic search ended 2026-07-31). Result: a monetised (ads/affiliate) site cannot use
  it. Quotes are Korean text from the terms page.'
