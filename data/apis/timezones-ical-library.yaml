notes: 'No ToS/usage policy for the hosted API (tz.add-to-calendar-technology.com/api/*.ics); the GitHub
  README calls it a ''free and open API'' and the project is Apache-2.0 (code; repo is also an npm package,
  so self-hosting/bundling is easy). Underlying data is the IANA tz database, which declares itself public
  domain; the VTIMEZONE conversion is the project''s own work (Apache-2.0 notice retention applies if
  redistributing the code). Hosted-API rate limits/uptime guarantees not stated. Not a typical data-licence
  entry: it is time-zone reference data, not content.'
