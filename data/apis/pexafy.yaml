notes: 'Read https://docs.pexafy.com (curl and Playwright). The main site pexafy.com and /terms sit behind
  a Cloudflare bot check and were not read, so the service own terms are unread. The docs claim every
  photo is free to use with no attribution required, but the photos come from other libraries whose API/licence
  terms differ: Unsplash API guidelines require photographer and Unsplash credit, and Pexels API guidelines
  require a prominent link to Pexels. The claim therefore conflicts with the upstream rules (attribution_required
  = ambiguous). Commercial use, caching and display rights are not stated on the pages read, so unknown.
  Upstream libraries (data_license left unknown): Unsplash, Pexels, Pixabay, Kaboompics, Burst, StockSnap,
  Picjumbo, Skitterphoto, NegativeSpace, each under its own licence.'
