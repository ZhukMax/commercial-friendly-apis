notes: API Terms of Use read at https://developers.soundcloud.com/docs/api/terms-of-use. Commercial use is only allowed for
  a short list (apps for creating/sharing own content, delivering own content to the uploader's own ad-enabled site, promoting
  own content); apps with advertising, sponsorship or promotion around User Content are listed as unacceptable, so an ad/affiliate
  site is not allowed. Only session-based caching, no offline copies, no AI training, no aggregation services. All audio and
  metadata belong to third-party uploaders/rights holders. Display allowed only with attribution, so redistribution_display
  left unknown.
