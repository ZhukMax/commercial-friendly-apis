notes: Read the API License Agreement via Playwright (fresh context; curl is blocked by eBay's bot challenge).
  Public Display is allowed only to promote eBay and let users search/browse listings, must be visually
  isolated from non-eBay content (no co-mingling), must be kept fresh (6 h for listings, 24 h for other
  content) and deleted when no longer public. The agreement has no explicit ad/affiliate or 'commercial
  use' clause and requires Application Growth Check/certifications for some APIs, so commercial_use and
  display are ambiguous. Attribution/logo rules (Badge Usage Terms) not read. Restricted APIs and Buy
  API terms may be stricter; not assessed. Also relevant for aggregators reselling eBay data.
