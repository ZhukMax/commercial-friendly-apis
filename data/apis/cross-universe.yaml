notes: 'The API (crossuniverse.net/apiDocs, run by a fan translator, Psychpsyo) serves card images and
  metadata of the indie card game Cross Universe; the site says "All content belongs to Cross Universe".
  Read the English TOS page (which defers to the official Japanese terms) and the official Japanese terms
  at crossuniverse.jp (利用規約, read in Japanese). Terms: card images may be used non-commercially and for
  some commercial uses only (videos or games with ads, donations; never selling the video/game itself);
  physical cards/goods are not allowed; commercial media need the author''s permission; companies must
  get permission even for non-commercial use; images may not be modified except cut-outs for explanations;
  credit the site name (link requested). A card database site with ads/affiliate links is not among the
  listed cases, so commercial_use is ambiguous. No statement on storing API data -> unknown. The two catalog
  entries (cross-universe, cross-universe-crossuniverse) are the same service: the older psychpsyo.com
  URL 301-redirects to crossuniverse.net/apiDocs/. Merged duplicate entry `cross-universe-crossuniverse`.'
