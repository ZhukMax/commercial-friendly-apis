notes: 'Read /licensing, /terms and /developers. Two levels: the free tier is personal/evaluation only
  (commercial/bulk needs written permission per /terms); paid tiers ($99 Developer, $499 Pro per month)
  allow commercial use in a product. Raw-data republishing at volume needs a separate written licence;
  caching/storage is not stated beyond ''consistent with cache headers'', hence ambiguous. Upstream feeds
  are police/fire/media reports with their own licences (not assessed). ''Free'' widget/Atom feeds with
  attribution may be a lighter route (not assessed). Redistribution of media-sourced incidents must keep
  the approximate-location caveat.'
