notes: 'Read https://www.worldcoinindex.com/apiservice ("Our API is free of use", key required, asks users
  to state purpose) and https://www.worldcoinindex.com/terms-of-use (last updated 2019). The site Terms
  of Use bar commercial use of the site "Content" without written authority and copying/republishing/distributing
  it; "commercial purpose" is defined as anything beyond personal and private decision making. The API
  page does not say whether the API is exempt, so the two pages conflict or at least are unreconciled:
  ambiguous. Strong risk that an ad-supported site needs written permission; treat as red unless WorldCoinIndex
  confirms in writing. Prices aggregate exchange data (upstream terms unchecked).'
