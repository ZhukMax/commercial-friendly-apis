notes: Only the generic NLM web-policy page was read (DailyMed footer 'Copyright' link points to it);
  the DailyMed web-services page itself has no terms. NLM says government-authored works are free to reuse,
  but DailyMed hosts drug labels (SPL) submitted by manufacturers, which are not government works and
  may be copyrighted (non-government content needs the owner's permission beyond fair use). Attribution
  is requested ('Please acknowledge NLM'), not clearly required. Caching/storage not addressed. Per-label
  rights not assessed, so ambiguous.
