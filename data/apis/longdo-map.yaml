notes: Read the Longdo Map API Terms of Use (map.longdo.com/api/terms) and the general Longdo Map Terms (map.longdo.com/terms). The API terms allow free use for consumer-facing services, paid or unpaid,
  within a monthly free threshold; beyond it a commercial subscription is needed or data stops. Content may only be displayed to end users in the same form and appearance as provided and may not be copied
  or otherwise used, which I read as no storing or reuse (storage_caching no). Logos/notices on map images must stay and the Longdo logo may not be the largest or most prominent element. The general site
  terms (personal/non-commercial or internal business use only) apply to the Longdo Map website, not the API. Terms are broad and partly vague, so medium.
