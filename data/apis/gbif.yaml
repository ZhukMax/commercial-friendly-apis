notes: 'curl got 403; Terms and Data user agreement read via Playwright (fresh context). GBIF is an aggregator:
  each dataset has CC0, CC BY or CC BY-NC set by its publisher, and publisher licence prevails over the
  agreement. GBIF notes that broad readings of ''commercial'' include sites with ads, so CC BY-NC records
  are risky for an ad site; filter by licence (CC0/CC BY) to use commercially. Also a benefit-sharing
  clause for digital sequence information users. Onward sharing is allowed when the ownership identifier
  is kept (so storage/display are conditional, ambiguous). bulk_download left unknown (not checked). Merged
  duplicate entry `gbif-api`.'
