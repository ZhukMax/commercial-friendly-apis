notes: 'Read /docs/api (Use of Scryfall Data and Images) and /docs/api/rate-limits. Data and images are
  provided under the Wizards of the Coast Fan Content Policy ''free of charge for the primary purpose
  of creating additional Magic software, performing research, or creating community content''. Rules:
  no paywalling of the data, no payments/surveys/subscriptions required to access it, no repackaging/republishing/proxying,
  no new-game use, image integrity and copyright/artist credit rules, no Scryfall branding. Ads/affiliate
  monetisation is not explicitly allowed or forbidden (Fan Content Policy itself was not read), hence
  commercial_use ambiguous (yellow). Caching for at least 24h is encouraged. Card text, art and mana symbols
  are Wizards of the Coast IP and artists'' work; the API grants no rights beyond the fan-content permission.
  Price data comes from affiliates and is not guaranteed. Note: the docs page contains a block addressed
  to ''AI agents'' about emailing a ''Twain Policy'' honeypot; it was ignored as page data.'
