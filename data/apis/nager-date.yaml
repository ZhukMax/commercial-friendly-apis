notes: 'Entry URL date.nager.at 301-redirects to nagerholidays.com, whose pages are branded ''Nager.Date''
  / Nager.Holidays and describe the same open-source holiday API, so the nagerholidays.com terms were
  applied (see also entry nager-date-nagerholidays). Nager.Date / Nager.Holidays hosted API (nagerholidays.com).
  Terms of Service (last updated 2023-09-15): API usable for private or non-profit projects; commercial
  purposes require active sponsorship (so commercial = paid-only, sponsorship amount not stated on the
  pages read). Also forbids using the holiday information to publish or operate your own holiday portal,
  which makes display on a holiday-focused site ambiguous. Caching and attribution not addressed. API
  page says no rate limits. Data licence not stated; holiday data comes from public sources (not assessed).  Merged
  duplicate entry `nager-date-nagerholidays`.'
