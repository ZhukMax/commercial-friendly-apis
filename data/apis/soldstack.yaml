notes: 'Terms (soldstack.dev/terms, updated 2026-11-12): all plans may use results for own pricing, research and internal tools; showing results to users of your own product (app, site, extension, customer
  reports) needs the Business plan ($99/month), except keys created before 2026-11-13, which keep display rights on any plan. Raw output may not be resold or redistributed as a feed/bulk export/competing
  API. Storage/caching of results by the customer is not addressed (unknown). Data is scraped from Poshmark public sold listings with no agreement with the marketplace, and the terms make the user responsible
