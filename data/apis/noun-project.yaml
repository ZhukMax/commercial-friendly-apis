notes: 'Read API landing page (thenounproject.com/api/), API docs (api.thenounproject.com getting_started.html),
  and site Terms of Use (which defer to separate API terms on /developers/api-documentation/; the detailed
  ''Icon API terms & license details'' page is on help.thenounproject.com, which is behind Cloudflare
  and was not readable). Marketing page says icons via the API are royalty-free for commercial use; docs
  list ''Distributing icons, including for free'' and AI-training use as unacceptable. Whether icons may
  be stored/cached or what attribution is required was not found, so those stay unknown. API needs a key
  (OAuth 1.0a signing); pricing is a free trial (30 days / $5 cap) then pay-per-use from $25/month; the
  real licence is per-plan, so check help-center terms before use. Redistribution_display left unknown:
  the unacceptable-use list forbids distributing icons but displaying them in an app is the API''s purpose
  and not explicitly addressed.'
