notes: 'freepik.com/api is blocked to curl (403) and redirects to the same site; docs.freepik.com redirects
  to docs.magnific.com (Magnific API docs; the Freepik API appears to live there now, and the docs footer
  links to Magnific''s Terms of Use and ''API Services Terms and Conditions'', October 2026). The API
  Services T&C (read via a fresh Playwright page, as curl gets 403) grant a limited, personal, revocable
  licence to display Magnific Content to end users through a disclosed API client, require an active Subscription
  with Credits (paid; no explicit statement on a free tier), limit caching/storing to technical needs,
  forbid reselling/packaging content, restrict the API to the one disclosed client, and require ''Powered
  by'' attribution for AI-model features. The T&C never states plainly that commercial use is allowed,
  so commercial_use is ambiguous; stock content licensing (free content attribution, premium licences,
  per-asset restrictions, third-party contributor rights) is governed by the Terms of Use and was only
  skimmed. Fix: the entry''s upstream auth apiKey stays correct (x-magnific-api-key).'
