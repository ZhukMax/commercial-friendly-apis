notes: 'Pages read: /api-docs, /open-data, /terms. Two layers: the open-data CSV (only series with open
  source licences) is explicitly reusable commercially with credit (CC BY 4.0 for the compiler''s work,
  each row keeps source licence); the REST/MCP API for 335 public indicators (IMF, World Bank, etc.) carries
  source-specific attribution and reuse metadata and the terms say source terms apply to every use, including
  commercial and redistribution. Redistribution bulk bundles are paid (Data Pro). So API use needs per-series
  check; ambiguous. Terms ban scraping the website when an API endpoint exists and redistributing data
  without complying with source terms.'
