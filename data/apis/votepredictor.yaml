  as permissive but never says ''commercial'' or addresses storage/caching, so commercial_use=yes is an
  inference from ''only ask'' (confidence low) and storage is ambiguous. Footer: forecasts by TabPFN;
  poll data from VoteHub (CC BY 4.0, needs its own credit); member data includes reported net worth from
  other sources whose terms were not checked. Operator: oconnorventures.com LLC. Asking the operator for
  a written licence would settle it.'
