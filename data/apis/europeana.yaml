notes: 'Read Europeana Terms of Use and Usage Guidelines for Metadata (pro.europeana.eu pages are behind
  a Cloudflare challenge; the same terms are on www.europeana.eu). Aggregator: metadata is CC0, but thumbnails
  and linked digital objects (images etc.) from thousands of institutions may be used only per each item''s
  rights statement (edm:rights), which can be stricter (copyright, CC BY-SA, NC), so display is ambiguous.
  Metadata guidelines are goodwill requests (attribution, re-share on same terms), not a legal contract;
  share_alike left as not-required (unspecified legally) but flagged here. Personal API keys are non-production
  only; production needs a Project key. Texts in blogs/exhibitions are CC BY-SA.'
