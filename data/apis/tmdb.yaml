notes: Free key is non-commercial only. Terms list commercial examples including charging users, and revenue from advertising displayed on a website and recommendation/affiliate-style sites; a commercial
  agreement (possibly with fees) is required, so a free-key ad/affiliate site breaches the terms. Hence paid-only/yellow (could be read as red for the free tier). Cache max 6 months. Also bans derivative
  works and ML/AI training use. Original URL redirects to https://developer.themoviedb.org/docs/getting-started; the binding terms are at /api-terms-of-use. Display permission is implied by the attribution
  regime, not stated as a separate sentence.
