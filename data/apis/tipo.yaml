notes: The page links to a Copyright claim (tiponet.tipo.gov.tw/030_OUT_V1/copyRight, Chinese) and to "Data usage regulation" (data.gov.tw/privacy, which is only a privacy/security policy and names no data
  licence). The copyright page says content excluded from copyright (laws, official documents) may be used freely, while other site content is copyright-protected and only fair use / personal or family
  non-profit copying is allowed; it does not clearly cover the open-data API. The Taiwan Open Government Data License v1.0 (data.gov.tw/en/license) allows any use but the TIPO page does not say it applies
  to this API, so it is not applied. All terms unknown. Access needs an API verification code application (DOCX/ODT form), so apiKey is plausible.
