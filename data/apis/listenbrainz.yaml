notes: 'Two levels: the ListenBrainz database dumps are CC0 and the MetaBrainz dumps page says commercial
  use is allowed but financial support from commercial users is strongly urged. The API documentation
  (read) contains no licence or commercial-use clause, so commercial_use for the live API is ambiguous;
  storage/display/attribution are inferred from the CC0 dump licence only. Data is user-submitted listening
  history (personal data, GDPR). API doc requires a meaningful User-Agent. auth: public reads need no
  token, submissions need a user token.'
