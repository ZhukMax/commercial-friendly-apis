notes: 'Read FAQ, documentation and the GitHub repo page. FAQ answers the for-profit question softly:
  recommends the API for personal projects (community-run, no SLA) but welcomes the dataset in any project
  with credit - hence commercial_use ambiguous; use the downloadable dataset (breweries.json/csv/sql)
  for production. Repo page shows an MIT licence. FAQ states data was initially scraped from the Brewers
  Association (2018) and later community-edited: upstream rights not assessed. No standalone ToS page
  exists (/terms 404). Share-alike: no (MIT).'
