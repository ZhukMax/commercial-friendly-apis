notes: 'Read the Terms of Service (shown on https://www.registerwire.uk/signup.html, updated 27 Aug 2026;
  terms.html just points there), privacy page and docs. Allowed: building a product that shows notifications
  to your own end users; forbidden: reselling/redistributing the underlying Companies House stream or
  the processed feed to third parties, and circumventing limits. The terms never say ''commercial use''
  explicitly and do not address storage duration or attribution (OGL attribution of Companies House data
  is implied by ''subject to Companies House''s own terms'' but not stated), so commercial_use/redistribution_display
  are ambiguous; a public ad-supported site is not the product''s target (lenders/compliance teams). Upstream
  data are Companies House under OGL (alert/change-event feed).'
