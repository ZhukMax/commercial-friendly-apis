notes: 'Read krakenkeys.com/terms (updated Oct 25, 2026) and krakenkeys.com/api-docs. Conflict: the general
  terms say the site is for "personal, non-commercial purposes", while the API docs invite you to "Build
  bots, tools, and sites on top of KrakenKeys" and say the API is free and intended to stay so. Mandatory
  condition: price links must go through KrakenKeys'' affiliate redirect (/out/{id}); stripping or replacing
  them with direct store links is forbidden and keys may be revoked. Resale or republication as a competing
  price-comparison service is forbidden. Storage/caching and attribution are not addressed (unknown).
  Game metadata and cover images are from IGDB and store prices come from third-party stores; no rights
  to that content are granted by KrakenKeys. Needs a free account API key.'
