notes: 'Unofficial API run by Opendata.ch (not by SBB/OTD). It has no separate terms of service; its Licenses page lists upstream sources and points to opentransportdata.swiss terms of use for the timetable,
  real-time, occupancy and fare data. Those upstream terms (read) allow processing, analysis and publication incl. by companies, with source citation and regular updating. Other sources: OSM (ODbL, share-alike/attribution
  for addresses/places), sharedmobility.ch (BY), swisstopo OGD. The API operator makes no explicit statement on commercial use, so confidence is low; upstream terms are the only evidence. Shared hobby-run
  service with no SLA.'
