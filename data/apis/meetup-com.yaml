notes: Read Meetup API license terms (published May 10, 2021, read via Playwright because help.meetup.com
  blocks curl) and the GraphQL API intro. API access needs a Meetup Pro subscription and registration;
  commercial use needs Meetup's written consent, and replicating the Platform is barred. Display on third-party
  pages is not expressly addressed, so redistribution_display unknown. Auth is OAuth2 access tokens (upstream
  said apiKey). The attribution duty is a disclosure that the app is unverified, not a credit line.
