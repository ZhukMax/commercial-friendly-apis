  part, selling or giving API access to the data itself, and building a substitute data product; it is
  not stated that it governs this API, so commercial_use is ambiguous (yellow). Storage/caching not addressed.
  Underlying BEA/BLS data are US government statistics (their own terms not checked). Free keyless API,
  no paid plan.
