notes: Read api_reference.php (the 'Usage Terms' section is one short statement; no separate ToS) and
  the home page. 'Free to use however you wish' is broad but informal; storage/display rely on it, so
  confidence medium. Data is the FCC amateur licence database (US government public data; contains licensee
  names and mailing addresses, i.e. personal data). Latitude/longitude/gridsquare come from the Bing Maps
  geocoder, whose own terms may restrict storing/reusing coordinates (not checked). Site has no ads and
  asks for donations. No attribution requirement found.
