  incl. licence terms must be visible to end users. The mix means commercial use, storage and display
  depend on each record''s provider, so they are ambiguous rather than yes. The CC BY legal text was not
  cited here. The service calls itself a non-commercial, non-profit service (about the operator, not a
  use restriction).'
