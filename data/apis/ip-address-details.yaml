notes: 'Read /lite (IPinfo Lite page and FAQ), /pricing and the Terms of Service (updated 2024-06-03). The free tier is IPinfo Lite: country-level geolocation + ASN only, CC BY-SA 4.0 with mandatory attribution;
  share-alike makes the verdict yellow. City-level data (Core/Max) is paid; the pricing comparison lists a "Commercial License ... Attribution required" row, but the table cell values per plan were not
  readable, so paid-plan terms are unconfirmed. The Terms of Service cover the website content: internal business use only, external commercial use needs contact with IPinfo. The old keyless access no longer
  applies: an access token is required (auth changed to apiKey). Lite is also downloadable as a database (bulk/self-host).'
