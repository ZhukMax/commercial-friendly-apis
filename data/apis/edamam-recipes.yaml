notes: 'Read the Edamam API Terms of Use (https://www.edamam.com/terms/api, revised Feb 28, 2023; JS page
  read with Playwright in a fresh tab) plus the product docs page. The free version is limited to personal/not-for-profit
  use; commercial use needs Edamam''s express authorization (heading ''Fees for Commercial Use''), but
  no page read states what paid plans allow, so commercial_use is ambiguous, not paid-only. Terms forbid
  copying/archiving Edamam Content without consent (but also refer to cache-header limits), and bar public
  display/republishing except as expressly authorized, while licensing use in your own website: storage
  and display left ambiguous. Logo + link attribution is mandatory. Recipe Search API returns web recipes
  whose copyright Edamam does not hold (docs page: it provides the source URL, not instructions); third-party
  content rights stay with the owners, so upstream terms may be stricter.'
