notes: Read the ADS Terms of Use (adsabs.github.io/help/terms/) including the API terms. The API terms
  forbid redistributing data to third parties and making a partial/full copy, and say to contact ADS before
  regularly storing data; abstracts and full texts are publisher-copyrighted. Showing data on a public
  site is redistribution to third parties, so display and storage are marked no => red. Commercial use
  per se is not addressed (only systematic downloads "commercial or not" are banned). Requires an API
  token (OAuth listed upstream). Rate limit from adsabs-dev-api README example.
