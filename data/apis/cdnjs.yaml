override_reason: No API terms page; MIT is stated for the packages repo that drives the API metadata (mapping inferred) and every library carries its own licence.
notes: 'Pages read: cdnjs.com/about, /api, cdnjs/cdnjs and cdnjs/packages READMEs. There is no terms-of-service page for the API; the site only links Cloudflare''s privacy policy. The cdnjs.com site says
  it is a free, open-source CDN; the MIT licence is stated for the cdnjs and cdnjs/packages repositories (the library manifests the API metadata is generated from); that API output equals this repo content
  is an inference, hence low confidence and yellow override. Each library is released under its own licence (reported in the API''s license field), so a site must check the licence of each library it reuses.
  Mirrors are explicitly welcomed (read-only R2 credentials on request) so bulk_download yes.'
