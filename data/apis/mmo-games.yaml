notes: Read mmobomb.com/api and mmobomb.com/terms-of-use. The API page says it is free for everyone "without
  any restrictions" if MMOBomb.com is credited as the data source, but the site Terms of Use license is
  limited to personal, noncommercial use and forbids commercially exploiting or copying/republishing the
  Site (except as expressly stated). The API page is the express statement for the API, yet it does not
  say "commercial" explicitly, so commercial use is ambiguous. Storage and display are not addressed (unknown).
  The game records (titles, descriptions, thumbnails, screenshots, links) describe third-party games whose
  publishers own the content, plus news and giveaways; the API grants no rights to publisher content.
  How the attribution must look (link/dofollow) is not specified.
