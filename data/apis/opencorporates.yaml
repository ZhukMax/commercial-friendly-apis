notes: Read OpenCorporates Terms of Use (opencorporates.com/terms-of-use-2/), the legal-information hub and the API reference (v0.4.8). Free API keys are only for 'Permitted Users' (journalists, NGOs, academics
  doing public-benefit research; corporations/financial institutions are explicitly excluded) and are share-alike (ODbL; must show contribution back under an open licence). Commercial/proprietary use requires
  a paid non-share-alike key or subscriber contract (Self-serve/Enterprise API ToS documents are linked from /legal-information/ but were not read), so commercial_use=paid-only. Storage/caching not addressed
  on the pages read. Scraping prohibited except search-engine indexing. API reference page says an API key is required (auth apiKey correct). The commercial licence's own terms may differ from the share-alike
  ones read here.
