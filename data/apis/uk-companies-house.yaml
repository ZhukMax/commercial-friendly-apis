notes: 'Companies House public task / Crown copyright statement (GOV.UK): no rules on use of public-register
  information; users must take own advice on third-party copyright, cannot reproduce Crown insignia, and
  must credit Companies House as source (this last list is framed around customers of bulk/purchased data,
  applied here to the API conservatively). The developer hub (developer.company-information.service.gov.uk)
  has no separate API terms/licence page that I could find; "Policies" footer links to the register search
  guidance. Requires an API key / OAuth app. Officer and PSC records are personal data: GDPR duties remain
  with the reuser (not assessed). Secondary web sources that conflict (OGL vs none) were not used.'
