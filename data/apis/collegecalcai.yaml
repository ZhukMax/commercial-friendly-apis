notes: Read /developers ('Terms and limits' section) and /terms. The API page says free for apps with
  two asks (estimates disclaimer, credit link) but never says 'commercial' or addresses ads/storage; the
  general ToS bans scraping and 'automated bulk access'. So commercial_use and storage are ambiguous;
  ask the owner before building a monetised caching product. Display with credit is permitted by the API
  page.
