notes: HKO open data intro page (hko.gov.hk/en/abouthko/opendata_intro.htm) lists datasets but contains
  no licence text; HKO datasets are published on data.gov.hk (e.g. 9-day forecast, with the API documentation
  PDF as data dictionary), so the data.gov.hk Terms and Conditions were applied. They allow commercial
  use on a free-of-charge basis if the source is identified and the Government/Organisations acknowledged;
  they also carry an indemnity clause and "Terms of Use" conditions (not fully reviewed). HKO's own copyright
  pages 404. Medium confidence because the link HKO API to data.gov.hk terms is inferred from the dataset
  listing.
