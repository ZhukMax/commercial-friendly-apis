notes: 'Read the API Terms of Use (api.joshuaproject.net/terms_of_use) and the datasets page. Free API key (request form) but terms forbid any commercial purpose, including using the data to generate revenue,
  so ads/affiliate sites are out (red). Also: attribution link required, no public replication of Joshua Project''s own services/presentation, downloaded/cached data must be deleted on termination. Public
  datasets page (joshuaproject.net/resources/datasets) says ''Free to use'' without a licence; the API terms were treated as controlling. Redisplay only allowed non-replicating, hence display yes only in
  a limited sense. Non-commercial use of the CSV downloads could differ (not assessed).'
