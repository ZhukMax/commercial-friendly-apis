notes: Read the DataCite support docs (harvesting page for the CC0 statement, rate-limit page). CC0 covers
  DOI metadata only (not the described datasets/articles). Metadata fields such as abstracts/descriptions
  are deposited by repositories and may mention third-party rights, but DataCite states all of it is CC0.
  Harvesting guidance recommends OAI-PMH/public data file for large volumes.
