notes: 'Read https://www.seodata.dev/terms (last updated 16 Oct 2026). One sentence grants use of results
  in own products, reports, content and datasets, including commercially; I read it as covering storage
  and display, but it is not an explicit caching clause. Restrictions: do not resell raw API access as
  a competing keyword-data service, no scraping the website at volume. The terms say the figures are estimates
  gathered from third-party sources (upstream source and its rights not named). No attribution clause
  found, left unknown.'
