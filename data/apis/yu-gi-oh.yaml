notes: Read the YGOPRODeck API guide (db.ygoprodeck.com/api-guide redirects to ygoprodeck.com/api-guide/).
  It explicitly asks users to store API data locally and re-host card images (no hotlinking), so storage
  is yes, but the guide has no licence, commercial-use or attribution statement and no terms of service
  page was found (/terms and similar return 404). The site footer states card images, card text and symbols
  are copyright 4K Media Inc / Konami and that the site is not affiliated with them, so no rights in the
  card content are granted. Card price fields come from third-party marketplaces (tcgplayer_data removed
  in v7). Commercial use unknown.
