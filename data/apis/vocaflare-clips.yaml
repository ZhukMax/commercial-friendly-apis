notes: 'Metadata-only API (clip ids, CEFR levels, transcript cues, word timestamps); video playback must
  use the official YouTube embed under YouTube terms, and clips can disappear when owners remove them.
  Trial is evaluation only; Starter/Growth plans list Commercial use = Yes with attribution required.
  Prohibited: reselling/redistributing the index as a dataset, bulk dumps, competing clip index, hiding
  the player branding. Transcripts are YouTube automatic captions; third-party creator rights not assessed.
  Terms and pricing pages read from clips.vocaflare.com. Data licence not stated on a page read; characterised
  as: proprietary (VocaFlare Clips index); videos belong to their creators on YouTube.'
