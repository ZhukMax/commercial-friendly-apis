notes: 'Free, keyless API. The developer page requires the credit line and says every record keeps its
  source licence (/api/v1/sources: CDC NASS ''Public Domain (work of the US federal government)''; FertilityClinics
  editors ''All rights reserved''; enrichment ''source''). The Terms page does not address API reuse or
  commercial use. Because part of the data is ''All rights reserved'' and no commercial grant is stated,
  commercial_use is ambiguous. Caching: only HTTP Cache-Control hints (max-age 60s), no storage policy.
  The site has affiliate products (not relevant to the data). Per-record licences should be checked via
  meta.sources.'
