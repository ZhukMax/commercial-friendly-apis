notes: 'Read the developer page (pricing, FAQ) and the API terms (CGV, French). Free Découverte plan is non-commercial only; commercial use from the Solo plan (19 EUR/month). Attribution returned
  by the API must be shown next to displayed routes. Storage: terms forbid reselling API access and building a route database by mass requests; ordinary caching is not addressed (server keeps
  responses 24 h for itself), hence limited. Underlying data are OpenStreetMap (ODbL, share-alike on derived databases) and for addresses IGN BAN (Licence Ouverte 2.0); their upstream terms may
  add conditions.'
