notes: patentsview.org/apis/purpose, /license and the FAQ all redirect to the USPTO Open Data Portal transition guide (JS page, read with Playwright). That guide says the legacy PatentsView website is migrating
  to ODP from 2026-03-20; ODP now requires a USPTO.gov account (with MFA) and API key. No PatentsView licence text or ODP data terms were found on the pages read, so all terms fields stay unknown. A third
  party (PatentRef) states PatentsView bulk data is CC BY 4.0, but that is not the source and is not used here. The old keyless PatentsView API appears to be gone (auth likely apiKey via ODP, not confirmed).
