verdict_override: yellow
override_reason: Commercial use requires a commercial partnership agreement with IGDB (details not public)
  on top of the Twitch Developer Service Agreement, which was not read; game images/artwork are third-party
  content.
notes: Read the IGDB API docs (Getting Started, Business FAQ). Free for non-commercial use under the Twitch
  Developer Service Agreement (not read); commercial projects need a free commercial partnership via partner@igdb.com
  with visible attribution. FAQ confirms local storage/caching is allowed and data may be kept after the
  partnership ends. Auth is Twitch OAuth client credentials (Twitch account with 2FA). Covers, screenshots,
  artworks and descriptions are publisher/developer content; the API does not grant rights to them. Without
  the partnership, commercial use is not permitted, hence the override to yellow.
