notes: The Clash Royale API (developer portal is an SPA; read via Playwright) points to the Supercell
  Fan Content Policy as its "API Terms and Conditions" (same pointer on the Clash of Clans, Clash Royale
  and Brawl Stars portals). The policy requires Fan Content to be non-commercial and forbids charging
  fees, except monetization through ads, donations or coaching; promotions/ads are allowed. It is unclear
  whether affiliate links or a data-driven commercial site count, so commercial_use is ambiguous. An unofficiality
  disclaimer must be shown. The policy governs use of Supercell Assets (copyrights/trademarks from the
  games); display of API data is not separately addressed and storage is not mentioned. Supercell may
  revoke the licence at any time. The general Supercell Terms of Service restrict the Service to non-commercial
  personal entertainment (not an API term). API keys are IP-bound and rate limited. No rights in game
  art/IP are granted beyond the policy.
