notes: 'Pages read: /terms (updated 5 Nov 2026), /api, /data-licensing, /api/licensing.json. Only the
  auction record ledger is explicitly CC BY 4.0 (commercial use allowed with credit); the terms say the
  licence does not apply to every dataset on the site. Live listings, reviews and other public-API data
  have no stated blanket licence, and third-party dealer feeds/images/descriptions are excluded. Free
  "Prototype" package says attribution required for public use; a paid Builder commercial licence exists
  for apps and dashboards. Caching is requested ("reasonable ... caching") but no storage limit stated.
  Site itself carries affiliate links. Needs per-dataset check before use.'
