notes: 'Read https://score.get-scala.com/terms (2 Oct 2026) and the API page https://score.get-scala.com/api/. Free data: personal and research use only; commercial use requires a paid API subscription
  (the data-shop page says the downloadable datasets are CC-BY-NC-4.0 and ''Commercial use requires Enterprise API plan'', so which paid plan suffices is unclear). Aggregator of 250M+ records from national
  registries: each API response includes a data_licences object; some countries are share-alike (CC BY-SA 4.0 for Colombian records: ''share them under the same license'') and countries marked to_verify
  must not be redistributed, so upstream terms can be stricter than the API terms. Scores must not be presented as credit/solvency judgments. Storage/caching and public display of data were not addressed
  beyond these conditions: left unknown. The ''Data sources & licences'' page (/sources) was not read.'
