notes: 'Terms and Conditions PDF (linked from the market-data docs): Content is for personal, non-commercial
  use; public display/republication needs Alpaca prior written consent. The same section says anyone wanting
  commercial usage or to make data available through their own application must give 30 days written notice
  and Alpaca may restrict or disallow connectivity, so commercial use is a discretionary arrangement (ambiguous),
  not a plain licence. Docs also mention Broker API plans for business integrators and exchange agreements
  (Nasdaq, OPRA) that bind paid plans; not read. Exchange data redistribution limits apply. Pricing: Basic
  free (IEX only), Algo Trader Plus $99/mo.'
