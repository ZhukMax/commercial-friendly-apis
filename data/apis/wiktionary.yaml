notes: 'Text is CC BY-SA 4.0 / GFDL (reuse incl. commercial with attribution and share-alike) so the verdict
  is yellow because of share-alike. API etiquette: send an informative User-Agent, make requests in series,
  admins may block abusive clients (curl without UA got HTTP 429). Not everything on Wiktionary is covered:
  media/images and some embedded material have separate licences (see Wiktionary:Copyrights). Attribution
  rule quoted loosely ("properly identifying the source"); CC BY-SA requires credit, licence link and
  indicating changes. Wikimedia Terms of Use, Copyrights and API Etiquette pages read.'
