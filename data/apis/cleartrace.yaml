notes: 'Terms of Service (updated 2026-10-28, /terms.html; the OpenAPI docs page at /docs is a JS app
  read via Playwright): API users must comply with rate limits, not resell or redistribute API data without
  permission, and attribute ClearTrace; no statement on commercial use or caching, and the homepage mentions
  an ''open dataset'' without a licence. Data is on-chain analytics built on third-party providers (Dune
  Analytics, DefiLlama, Polymarket per ToS section 7, and a Dune price feed), whose terms may be stricter;
  ''public blockchain data'' is excluded from ClearTrace IP. Whether showing figures on a commercial page
  counts as ''redistribute'' is unclear (ambiguous). Free API key gives higher rate limits.'
