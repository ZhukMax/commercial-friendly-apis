notes: Read the Traveller Map API doc (free, "no charge", asks to be emailed, donations welcome) and the
  Mongoose Traveller Fair Use Policy PDF (read with pdftotext) that the doc footer links to next to the
  Mongoose copyright notice. The API doc itself states no licence or commercial terms; the linked policy
  allows non-commercial use only ("If you are selling what you copy or reproduce, then you violate Fair
  Use") and requires a copyright disclaimer, which suggests ads/affiliate sites are not covered. Whether
  the policy governs API data (world/sector data, maps) is not stated, so ambiguous. Storage, display
  and attribution left unknown.
