  from other contributors, and the terms say re-users must respect the licence attached to each dataset,
  so check per dataset. The API tutorial says an API key is needed for write operations only (upstream
  auth apiKey applies to writes; reads not stated as keyless). Entry URL redirects to /fr/; read the English
  pages via curl.'
