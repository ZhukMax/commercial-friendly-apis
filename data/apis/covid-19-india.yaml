notes: 'data.covid19india.org itself states no licence (home page read). The licence comes from the project''s
  archived GitHub repo (covid19india/api: LICENSE_DATA = CC BY 4.0, LICENSE_CODE = MIT; repo is read-only,
  archived Oct 2021, ''Moved to covid19india/data''). Inference: LICENSE_DATA covers the published data;
  CC BY has no NonCommercial restriction (full legal code read, deed not). The project was community-crowdsourced
  from state bulletins, so upstream government sources may carry their own terms (not assessed). The site
  says the API/repo were deprecated on 13 August; JSON endpoints except v4 deprecated, CSV/v4 remain.
  Data is frozen/historical. Confidence low: licence applicability to the hosted endpoint is inferred.'
