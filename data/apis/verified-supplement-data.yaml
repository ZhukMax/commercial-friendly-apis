notes: 'About and Free Dataset pages state the site''s data is CC BY 4.0 and free to use commercially
  with credit; Terms say research is free to cite/quote/embed with attribution and a link, and forbid
  scraping at a rate that degrades the site. The pages do not name the /api/v1 JSON endpoints specifically
  (OpenAPI says ''for AI assistant integration''), so applying the site-wide CC BY statement to the API
  is an inference. Aggregator: prices come from Amazon/brand sites and label data from NIH DSLD, PubMed,
  NSF, USP; upstream terms (notably Amazon price data) may be stricter. The listed URL redirects within
  the same site to the OpenAPI document.'
