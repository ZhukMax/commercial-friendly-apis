notes: 'Conflicting pages. ToS section 6 (updated 2026-11-16) bans scraping and, without written permission,
  using data from the Service (incl. its API and data) to build any database/product or to resell, redistribute
  or publish it; but says API access is governed by plan + API docs, and the API docs invite mirroring
  the archived inventory onto your own site and sell credits for lots, images, VIN history. No page states
  whether commercial display/storage on third-party sites is allowed, so commercial_use/storage/display
  = ambiguous (not read: refund/plan pages). Data is IAA/Copart/GovDeals auction content (lots, photos,
  VIN history) whose owners likely have stricter terms; SalvageAlert states it is not affiliated with
  them. Account-scoped key required. Data licence not stated on a page read; characterised as: proprietary
  / unknown (auction data from IAA, Copart, GovDeals).'
