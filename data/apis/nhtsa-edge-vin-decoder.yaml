notes: 'Independent third-party edge mirror of NHTSA vPIC (not affiliated with NHTSA). Only the operator''s
  own README (Legal section) was found: vPIC data is a US Government work in the public domain; the code
  is MIT. No ToS or SLA page; the root URL returns only a JSON status document. NHTSA''s own vPIC terms
  were not read. Attribution not addressed (unknown). The /unified endpoint also merges US EPA and EU
  RDW data, and a leaked-password lookup endpoint (Pwned Passwords) is unrelated to vehicle data; their
  terms were not checked. Free service run by a small company: continuity risk.'
