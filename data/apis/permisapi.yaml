notes: 'Read the CGV/CGU (French). Sitadel permits are under Licence Ouverte 2.0 (commercial reuse with
  source). Terms add duties: cite source and date, do not modify data, no resale or transfer to third
  parties, no phone/email contact of individuals without consent, no profiling files of individuals, remove
  permits listed as withdrawn within 30 days, do not make neighbouring-sales data indexable by search
  engines. Free plan open to anyone; paid plans professionals only. Public display on a site is not explicitly
  allowed or denied; treat as ambiguous (personal data in permits, GDPR).'
