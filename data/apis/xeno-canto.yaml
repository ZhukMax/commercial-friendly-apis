notes: 'Read the Terms of Use and API v3 page (both behind an Anubis proof-of-work check; read in a fresh
  Playwright context after it passed on its own, curl only gets the challenge page). Recordings carry
  per-recording CC licences chosen by each recordist; some are NC (BY-NC-ND forbids commercial use and
  alteration), BY-SA allows commercial use with share-alike for derivatives. A commercial site could only
  safely use recordings filtered to BY/BY-SA-type licences, so commercial_use and display are ambiguous.
  Caching/storage of API results not addressed (unknown); mass downloads are discouraged. Auth fixed:
  API v3 requires a key (free for verified members). Rights belong to the individual recordists, not xeno-canto.'
