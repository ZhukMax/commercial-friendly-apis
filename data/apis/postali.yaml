notes: 'Pages read (Spanish): Terminos de uso, API page, MX data page. For Mexico (the product focus, "Mexico Zip Codes API"), Postali relays that Sepomex forbids commercialisation in whole or in part and
  says that condition carries over to anyone reusing the data, so a commercial/ad-supported site is not covered (red). Colombia and Spain data come from GeoNames (CC BY 4.0, attribution to GeoNames): those
  would be fine commercially, but that is outside the Mexico use case. The Sepomex page itself was not opened (relayed by Postali). Caching is encouraged ("guarda en cache lo que consultes seguido") but
  moot for the verdict.'
