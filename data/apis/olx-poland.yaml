notes: Read the OLX API Terms (Regulamin OLX API, pomoc.olx.pl, in Polish) via Playwright (developer.olx.pl
  blocks curl with CloudFront 403; one fresh context). It is an account-scoped partner API for publishing
  and managing adverts, orders and messages on behalf of OLX users; not a public data source. The terms
  grant a limited licence for such integrations and forbid scraping OLX content without OLX consent, competitor
  use, and presenting users' statistics without permission. Nothing addresses commercial reuse, caching
  or public display of OLX listing data, so core fields unknown. Needs registered Developer Account and
  API key.
