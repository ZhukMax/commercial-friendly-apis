notes: Read /terms (updated 27 Oct 2026) and the API docs. Stats endpoints are free, no key; every response
  carries meta.attribution. Commercial use of statistics is allowed with credit to Namedesk and the listed
  sources, but no reselling as a dataset and no competing stats service. Caching/storage is not addressed
  explicitly (use in own products implied), so ambiguous. Separate registry-lookup data (ICANN CZDS) is
  research-only and excluded from the stats rule. Appraisal endpoints are paid credits (not assessed).
  Access can be withdrawn at any time.
