notes: 'Pages read: /legal/terms-and-conditions, /pricing, home. Terms (Demografix, same family as genderize.io
  and nationalize.io) apply to all tiers incl. the free tier, and say any lawful commercial use is allowed.
  Restrictions: do not resell raw predictions as a standalone dataset, do not use output to build a competing
  name-to-demographics service, do not present results as verified facts about individuals. A programmatic-SEO
  site publishing bulk name->age tables could be read as a standalone dataset or competing service, so
  keep the output as one ingredient of a page (doubt). No attribution clause found in the terms (attribution_required
  left unknown). Licence for responses is non-exclusive, valid while the subscription is active; cached
  results may be used after it ends.'
