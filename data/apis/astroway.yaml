notes: 'API ToS (Ukrainian, effective 2026-04-12, read at api.astroway.info/terms/) allow commercial use
  "according to the chosen plan", unlimited caching of calculated data, building paid products on top.
  Reference texts (/v1/natal-texts) stay AstroWay property: a free site key only lets you show them on
  your site; paid products (reports, PDFs, subscriptions) with those texts need a paid plan from Indie;
  translated/edited texts must not be republished as a collection; paid reports must carry an AstroWay
  authorship line and the entertainment disclaimer; AI disclaimers must not be removed. Resale of API
  access (white-label proxy) and bulk scraping are forbidden. commercial_use is ambiguous because which
  activities the free plan covers is plan-dependent and not spelled out; a plain ad-supported site showing
  results is probably fine but not stated. The separate consumer-site terms (astroway.info) were not used.
  Calculations rest on NASA JPL ephemerides (upstream not checked). auth set to apiKey (key-based plans;
  a few public no-key endpoints exist).'
