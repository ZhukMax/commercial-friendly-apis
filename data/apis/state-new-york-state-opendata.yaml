notes: 'Terms are a 6-page PDF (OPEN-NY Terms of Use, last modified 2013-03-08) attached as a dataset
  on data.ny.gov, read via pdftotext of the file download. Only requirement: lawful use (no malware, no
  illegal purposes); the State may ask you to stop if you violate terms. The terms also say other terms
  may be imposed on specific Content, so check dataset pages. Socrata (SODA) API; upstream auth OAuth
  is for optional app tokens/auth, API-level throttling terms not read.'
