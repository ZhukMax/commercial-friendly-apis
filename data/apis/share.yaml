notes: 'The API at share.osf.io/api/v2/ still answers; the SHARE site now presents as "trove" (share.osf.io/trove/docs),
  whose docs link to the Center for Open Science Terms of Use (read from GitHub). Terms: public OSF content
  is available for commercial and non-commercial use under the licence the administrator applied; no licence
  = copyrighted by default. SHARE is an aggregator of metadata about scholarly works from many providers,
  so per-record terms vary; no dedicated SHARE/trove data licence or caching statement was found. The
  OSF API code is Apache-2.0 (code, not data).'
