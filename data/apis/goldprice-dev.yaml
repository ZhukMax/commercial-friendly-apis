notes: 'Read the full Terms of Service v0.7.3 (section 6 Commercial Use and Redistribution). Displaying
  prices to your own end users is allowed on every plan; Free needs a visible credit link, paid plans
  none. Hard limits: no resale/redistribution of raw or derived data through your own API, SDK, feed,
  file export or dataset; no bulk export beyond tier limits. Caching/storage is not addressed explicitly,
  so storage_caching stays unknown (hence verdict unknown under the project rules, although display use
  looks fine). Upstream spot prices come from licensed market-data providers whose terms are stricter
  ("do not allow customers to pass them on as data"); users of investment products may need their own
  benchmark/exchange licences. Data is not an official benchmark.'
