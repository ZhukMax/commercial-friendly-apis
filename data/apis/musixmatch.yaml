notes: developer.musixmatch.com redirects to a login page; sign-up leads to https://www.musixmatch.com/pro/api/pricing (read).
  Paid plans from $49/mo; the Grow plan is described 'For growing apps generating revenue', Basic 'prototyping and small applications'.
  Lyrics caching is listed as NOT INCLUDED in Basic, Grow and Scale and only included in Enterprise. No actual API terms of
  service found (https://about.musixmatch.com/api-terms is 404; the EULA at /eula is a consumer licence), so confidence is
  low. Lyrics are copyrighted by publishers/songwriters; the API sells access under Musixmatch's licences, not ownership.
  Display/attribution terms unknown. redirect target of the catalogued URL is the login page.
