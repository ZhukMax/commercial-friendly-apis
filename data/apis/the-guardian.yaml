notes: 'Conflicting pages: the access page restricts the free Developer key to non-commercial use (students,
  hackathons, nonprofits) and offers a paid-by-usage Commercial key for commercial enterprises, while
  the OP Terms (cl. 8) allow attaching third-party ads to Your Website if you keep the Guardian-supplied
  ads embedded in the content, and bar selling ad space that attaches to OP content. Hence commercial_use=ambiguous;
  a commercial key is the safe route. Further conditions: re-request or delete content every 24 hours;
  keep the Powered by The Guardian logo; end users only for personal/non-commercial use; no AI/ML training,
  text-data mining, scraping or bots; syndicating/reselling or building a site entirely around OP content
  needs permission. Redistribution quote is a licence grant for Your Website(s) with these conditions.
  Pages read: the terms and the access page via curl.'
