notes: 'Octopart API v4 is now the ''Nexar Legacy API'' (docs say Nexar API is the up-to-date version;
  plans on nexar.com/compare-plans are tiered by matched parts: free evaluation 100, Standard 2,000, Pro
  15,000, Enterprise). Read octopart.com/terms: it covers the website (''intended for personal and commercial
  use'') and is not the API licence, so I did not use it as evidence. No API/Nexar terms of use, data
  licence or display/caching rules could be found (no terms link on nexar.com/api; nexar.com/terms 404).
  Part data and offers come from distributors and manufacturers, so upstream terms apply. All core fields
  unknown. Needs API token.'
