notes: Google APIs Terms of Service read (developers.google.com/terms). It contains no general non-commercial
  clause, but section 'Prohibitions on Content' bars building databases, permanent copies and public display
  of API content 'unless expressly permitted by the content owner or by applicable law'. For this API
  the content is the authorizing user's own data (not a public dataset), so whether storing/displaying
  it is permitted depends on that user's consent and the Google API Services User Data Policy; recorded
  as ambiguous. Commercial use is not addressed explicitly, so left unknown. This is a per-user OAuth
  data API, not an open data source. Gmail API terms page (developers.google.com/workspace/gmail/api/terms)
  read; it points to the Google APIs ToS and the User Data Policy.
