notes: 'Read Sportmonks'' own Terms of Service (https://www.sportmonks.com/terms-of-service/, via Playwright
  because curl gets a Cloudflare 403) and the v3 API FAQ. The ToS allows distribution, transfer and storage
  of data provided by the services but forbids reselling; an earlier sentence says storage of ''our services''
  needs permission, read as referring to the product, not the data. ''Usage of material from Sportmonks
  is strictly for personal and non-commercial use'' sits in the copyright paragraph about website material,
  not the API. No page states that commercial use (ads/affiliate site) is allowed or tied to a plan; the
  API FAQ says ''verify ... applicable commercial usage rights before launch'', so commercial_use stays
  unknown. Logos/photos belong to third parties; user must arrange rights. Data comes from licensed upstream
  providers, upstream terms may be stricter. '
