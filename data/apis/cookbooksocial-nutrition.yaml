notes: 'Read https://cookbooksocial.app/api and the Terms of Service section 14 (API access) at /terms,
  both JS-rendered pages parsed from the served HTML. Terms say the data may be used in own applications
  and cached as needed, but never mention commercial use explicitly (neither allowed nor forbidden) and
  ban reselling/redistributing the 41-field compilation as a standalone or derived database and systematic
  retrieval of the catalog (bulk is licensed separately); hence commercial_use ambiguous. API access is
  described as paid programmatic access while the API page lists a Free plan. Underlying data: USDA public
  domain; Ciqual CC BY 4.0 (rights of the underlying values stay as the licence grants).'
