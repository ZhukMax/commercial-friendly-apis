  applicable fees'', free plan is $0). Not allowed: reselling/redistributing raw data, making data available
  in bulk. Caching/storage not addressed and licence is limited to the subscription period, so ambiguous.
  Third-party items need credit (DB-IP geolocation CC BY 4.0; aircraft photos need visible photographer
  credit and link). Attribution to Travel Code only ''where we ask''; ambiguous. Some data originates
  from government advisories whose own terms were not checked.'
