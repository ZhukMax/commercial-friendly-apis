notes: 'Terms of Use read (help.inspirehep.net) plus the REST API doc README on GitHub which points to
  it. Metadata is reusable under the CC0 waiver; caveats: downloading email addresses is not permitted,
  abstracts are reusable only when abstracts.source is arXiv or CERN, keywords only when source is author/absent
  or schema INSPIRE, and full texts must not be reconstructed from snippets. Item 1 says the service is
  ''free of charge for educational and informational use'', which is not an explicit commercial ban but
  adds slight doubt. Attribution not required (CC0). Rate limits not recorded.'
