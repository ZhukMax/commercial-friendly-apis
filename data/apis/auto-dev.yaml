notes: 'Read Terms of Service sec. 2, 4 (last updated 2026-09-16). Permitted: integrate data into applications,
  build automotive software products, legitimate business purposes (no non-commercial restriction on the
  Free plan was found). But the data licence is "solely for your internal business purposes", reselling/redistributing
  data to third parties is banned, and no derivative databases. That makes public display, storage and
  caching on an ad/affiliate site ambiguous; there is no explicit caching rule on the page. Listings/photos
  data come from upstream dealers/marketplaces (not assessed). No attribution clause found, brand/logo
  use needs written permission.'
