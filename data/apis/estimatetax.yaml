  a mandatory link. The terms say keys, quotas or pricing may be introduced later with notice and that
  a commercial arrangement exists for higher volumes. Output must not be passed off as professional tax
  advice. Federal/state figures come from IRS and state sources (public). Medium confidence: terms are
  informal prose and the API is described as currently open.'
