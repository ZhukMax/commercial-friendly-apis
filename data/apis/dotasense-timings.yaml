notes: Cheat-sheet page invites tool builders to use the free JSON/CSV endpoints (no auth, CORS open)
  and says to cache the response and link/cite the canonical page when quoting a timing (a suggestion,
  not clearly mandatory). The site Terms of Service (dotasense.com/terms) are written for the app/website
  and limit the publicly deployed version to "personal, non-commercial gaming purposes only"; the data
  endpoints are not covered explicitly, hence commercial_use=ambiguous. No data licence stated; timings
  are facts derived from Valve patch notes (Valve is not affiliated). The JSON endpoint returned usage_exceeded
  when probed, so its fields were not seen.
