notes: 'OSV.dev aggregates advisories from many databases and publishes no single data licence for the
  API. The data sources page lists per-source licences: mostly CC-BY 4.0, CC0, Apache 2.0 or MIT, but
  Ubuntu and Alpine are CC-BY-SA 4.0 and Chainguard/Wolfi is CC-BY-NC-ND 4.0 with a separate commercial-scanner
  licence. No site-level terms found covering API use, storage or display, so storage_caching is unknown
  and commercial use ambiguous (depends on which source records you show). The osv.dev software is Apache-2.0
  (not the data). Data dumps are available at gs://osv-vulnerabilities.'
