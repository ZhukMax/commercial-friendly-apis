notes: API Terms of Use (last updated 30 May 2025; read via Playwright, curl 403; /platform/api-user-agreement/
  and /platform/api/ redirect/lead to the new platform docs). Licence is to build an Application; resale
  or use "for direct commercial or monetary gain" is prohibited, while indirect gain from supporting the
  Application is allowed, so ad/affiliate monetisation is a grey area (ambiguous). Terms are written around
  organizer/User content and OAuth tokens (auth stays OAuth); this is partly an account-scoped API, and
  which endpoints expose public event search was not verified. Eventbrite trademarks may not be used.
evidence:
- field: commercial_use
  url: https://support.eventbrite.com/hc/en-us/articles/34860283116434-API-Terms-of-Use
  quote: for direct commercial or monetary gain (as opposed to indirect commercial or monetary gain associated
    with supporting your Application)
  checked_at: '2026-11-21'
- field: storage_caching
  url: https://support.eventbrite.com/hc/en-us/articles/34860283116434-API-Terms-of-Use
  quote: you may store Site Content relating to future events, but you may not store any Site Content
    relating to events that have occurred
  checked_at: '2026-11-21'
- field: redistribution_display
  url: https://support.eventbrite.com/hc/en-us/articles/34860283116434-API-Terms-of-Use
  quote: your Application must display the event title and display a direct link to the Eventbrite webpage
    associated with that event on the Services.
  checked_at: '2026-11-21'
- field: attribution_required
  url: https://support.eventbrite.com/hc/en-us/articles/34860283116434-API-Terms-of-Use
  quote: The link may not include a "nofollow" attribute and must be crawlable by search engines.
  checked_at: '2026-11-21'
- field: rate_limits
  url: https://support.eventbrite.com/hc/en-us/articles/34860283116434-API-Terms-of-Use
  quote: The rate limit is 1000 calls per hour on each OAuth token.
  checked_at: '2026-11-21'
