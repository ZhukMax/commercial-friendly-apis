notes: Read the Terms of Service (updated 2026-11-16). Own apps, tools and sites are allowed and the user
  is responsible for anything built or sold with the data; reselling raw API access as your own feed needs
  consent. Storage/caching is not addressed (docs describe keeping your own copy of odds, no rule), attribution
  not required in the terms. The service sells bet365 odds as data and says it is not affiliated with
  bet365; the indemnity clause mentions claims by bet365, so upstream/bookmaker rights are a real risk.
  Free plan exists, paid plans have their own terms (not read). Verdict unknown because storage is unconfirmed.
