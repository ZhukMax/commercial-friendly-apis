notes: 'Read NCBI Web Policies (ncbi.nlm.nih.gov/home/about/policies/) and the NLM bulk-data terms (nlm.nih.gov/databases/download/terms_and_conditions.html,
  which require "Courtesy of the U.S. National Library of Medicine" acknowledgement and current-version
  redistribution; those cover FTP downloads, not E-utilities explicitly). The E-utilities documentation
  page (NBK25497, API usage guidelines: key, 3 req/s) is behind a browser check (reCAPTCHA) that curl
  and the browser could not pass, so rate/usage terms were NOT read. Content returned by E-utilities is
  mixed: molecular data unrestricted by NCBI (submitters may claim rights), but PubMed abstracts/PMC/Bookshelf
  carry publisher copyright. Hence ambiguous, not green. Aggregator of third-party data.'
