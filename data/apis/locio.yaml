notes: Read /legal/ (Licensing and terms), /pricing/ and /docs/. Address data is G-NAF (CC BY 4.0, plus
  the G-NAF EULA which was not read in full); the attribution duty belongs to the data (footer line naming
  G-NAF and Geoscape Australia), not to Locio. Localities come from GeoNames (CC BY 4.0) and places from
  OpenStreetMap and operator feeds (ODbL, share-alike not assessed), so share_alike left unknown. The
  free tier has the same data as paid plans. Medium confidence because the G-NAF EULA and the ODbL layer
  were not reviewed.
