notes: 'Read the Russian-language ''Terms of use of individual Yandex Maps services'' (the English legal
  page returned 404) plus the English Geocoder product page (paid licences from $10,000/year, ''Capability
  to store and modify data'' in the Advanced tier). Free use: only on sites free and open to everyone,
  1000 requests/day, results only to be shown on a Yandex Maps JS API map (not third-party maps), no storage
  except 30-day cache. Whether an ad-supported site counts as commercial on the free tier is not spelled
  out, hence ambiguous. The entry URL redirects to /maps-api/products/geocoder-api. Quotes are in Russian.'
