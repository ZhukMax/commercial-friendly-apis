notes: 'Public search/discovery index of MCP servers, agents and APIs (Agentic Resource Discovery registry). Read the Swagger page and openapi.json (info.license says Apache-2.0, which describes the API
  spec/software, not clearly the index data) and the privacy statement; /terms and /legal do not exist. One endpoint''s description says its liveness feed needs ''no attribution'' but that is endpoint-specific.
  The registry aggregates metadata published by third-party servers/publishers, whose own terms are not covered. Some calls beyond a free allowance are paid over x402. No usable terms on commercial use,
  storage or display: all unknown.'
