notes: 'Read /licensing (updated Oct 13, 2026), /terms and the API page. Free and API tiers are personal/non-revenue
  only; ads, affiliate links and any revenue need the Business plan ($99/mo), hence paid-only (yellow).
  On Business: caching/storage for your own app is fine, showing prices in your own product is fine, attribution
  optional. Never allowed on any plan: reselling/redistributing the data as a data product or running
  a competing price API. No licence to card images/artwork (owned by rights holders); the provider also
  says it makes no representation about where data comes from (TCGplayer/eBay-sourced prices) or whether
  it holds rights in it, which is a residual upstream risk.'
