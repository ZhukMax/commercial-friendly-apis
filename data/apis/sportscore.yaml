notes: 'Read /developers/terms/ (updated 23 Apr 2026) and /developers/ via Playwright (curl is blocked
  by Cloudflare; the pages loaded normally in a browser, nothing bypassed). Free tier allows monetised
  apps if a visible, crawlable rel=dofollow ''Powered by SportScore'' link is shown on every page using
  the data (nofollow/ugc/sponsored not acceptable, hidden badges forbidden); attribution-free use needs
  a paid/commercial arrangement by contact. Cache allowed; scraping/rehosting raw responses as a competing
  feed and bulk dataset redistribution forbidden. Mandatory dofollow backlink is more than a plain credit
  (consider yellow if that matters). Aggregator: pulls from unnamed upstream providers, so upstream sports-data
  rights may be stricter; data accuracy not guaranteed. Terms sentence ''free tier is ad-free'' describes
  the API tier, not read as a ban on ads on the user''s site (ambiguity noted).'
