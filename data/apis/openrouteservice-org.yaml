notes: 'Pages read via Playwright (JS app, fresh context): https://account.heigit.org/info/tos (the old
  openrouteservice.org/terms-of-service/ 301-redirects there) and /info/plans. The Standard plan is described
  as "Free to use for everyone" and a separate Collaborative plan is for humanitarian/academic/government/NGO
  use, but neither page says explicitly that ads/affiliate (commercial) sites are allowed or forbidden,
  so commercial_use is ambiguous. Results are licensed CC-BY-SA 4.0 (share-alike, attribution link required);
  geocoding sources include OSM (ODbL), OpenAddresses, GeoNames (CC BY), Who''s On First. Storage/caching
  not addressed. On-Premise plan = run your own instance. Elevation results follow SRTM licence terms
  (not checked).'
