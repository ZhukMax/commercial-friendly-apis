notes: 'Pages read via Playwright (JS site): unpaywall.org/products/api and /legal/terms-of-service (rev.
  5 Nov 2020), /products/data-feed. The ToS grant only a limited, revocable licence to the free features
  and prohibit unauthorized reproduction or republication of the Data without written consent; they do
  not mention commercial use or caching, and no data licence (e.g. for the database snapshot) was read
  here. A paid Data Feed exists. Per-article licence info in responses refers to the OA copies, not to
  Unpaywall data. Ambiguous; contact OurResearch for commercial use. 100,000 calls/day limit and database
  snapshot as alternative come from the API page.'
