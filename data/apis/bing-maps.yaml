notes: microsoft.com/maps returns 403 to curl (Microsoft anti-bot page) and redirects to Azure Maps (azure.microsoft.com/products/azure-maps). Azure Maps FAQ says a licence is required to use Azure Maps
  and that usage terms sit in the licensing "use rights" for each programme; the Microsoft product-terms page (microsoft.com/licensing/terms/...) also returned 403, and learn.microsoft.com only states that
  Azure Maps is pay-as-you-go with a free monthly tier of transactions. No usable terms read on caching, display or commercial use, so everything is unknown. Bing Maps for Enterprise users are directed
  to migrate to Azure Maps.
