notes: 'Re-checked 2026-11-26 after a licence change; the 2026-11-21 check (green) found CC BY 4.0 on
  /data/ ("use it, including commercially") and on /terms/ section 6, with CSV/JSON downloads and a keyless
  /api/ask. Now /data/prices.json, prices.csv, offers.json, changes.json and /api/ask return HTTP 403
  "Not available."; /data/ became a page on where prices come from (99 hosts) with no licence or download,
  and /terms/ section 6 keeps only quoting single figures with a link and bans copying or republishing
  the collection, including by programs. The terms still say "Effective 6 November 2026", yet a Wayback
  snapshot of /terms/ (2026-11-15) with that same date, and one of /data/ (2026-11-17), still carry the
  CC BY wording, so the clause was rewritten without a new effective date. Data obtained under CC BY 4.0
  before the change stays licensed for that copy (CC BY is irrevocable), but nothing current may be stored
  or shown in bulk. Commercial use is not addressed separately (left unknown); the verdict follows from
  the copying ban. Prices themselves are provider facts: read them from each provider''s own pricing page
  or API instead.'
