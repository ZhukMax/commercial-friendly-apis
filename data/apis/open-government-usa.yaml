notes: 'Read the Data.gov Privacy/Data Policy (Licensing, Secondary Use, Attribution sections). Data.gov
  is a catalog (CKAN catalog API), not a data owner: federal data is in most cases free and without restriction,
  attribution is requested but not required. Exceptions exist: users must check ''Access & Use Information''
  on each dataset, and non-federal datasets (university, state, multiple sources) may carry other licences.
  So the green verdict applies to federal datasets without exceptions only. Rate limits of the catalog
  API not read.'
