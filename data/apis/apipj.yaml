notes: Clause 8.1 allows commercial use and caching 'as input to your activity, not as the product itself';
  8.2 prohibits reselling/redistributing data or the base as a competing product or mirror API, bulk scraping,
  and omitting source and reference month when displaying data. Display on a monetised site is implied
  by 8.2(i) (attribution required) rather than stated as a permission. Free plan exists (limits set on
  /precos); terms read do not distinguish free from paid use. Data include personal data of partners (LGPD
  applies; user is controller).
