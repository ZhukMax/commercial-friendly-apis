notes: Portal (portail-api.meteofrance.fr, JS app, read via browser) redirects /web. The special terms
  of use (/web/cpu, French) say each API has its own licence shown on the API page and at order; some
  APIs are free public-service (open data) and others are paid. The home page says the open data APIs
  are "free of charge and freely reusable", but no per-API licence page (e.g. Etalab/attribution) was
  read, so commercial_use/storage/display remain unconfirmed. Mixed free and paid offers; check the licence
  of each API.
