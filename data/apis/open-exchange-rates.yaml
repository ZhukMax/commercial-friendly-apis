notes: 'Read: openexchangerates.org/terms (Terms of Website Use, whose ''site'' includes the API), /acceptable-use,
  /services-agreement, /signup (pricing), docs intro. The only commercial-use wording is a consumer clause
  (''private consumer user ... domestic and private use ... not use our site for any commercial or business
  purposes''); no page states that business or ad-supported use is allowed or forbidden, no free-tier
  non-commercial clause was found, and no clause on caching, display or attribution was found. Pricing
  says paid plans are ''for startups, small projects and growing businesses''. Hence ambiguous, others
  unknown. Acceptable Use bans reproducing/re-selling ''any part of our site'' in breach of the terms.
  Data is blended from multiple providers (upstream terms not checked). Old /license page says the License
  Agreement was replaced by the Terms of Website Use.'
