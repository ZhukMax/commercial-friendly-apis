notes: 'Pages read: API Terms of Use (stackoverflow.com/legal/api-terms-of-use), Public Network Terms of Service, api.stackexchange.com/docs. User posts are CC BY-SA 4.0 (share-alike, attribution, link
  to the post and author); the API terms require a visible Stack Exchange source indication, and apps that can be indexed by search engines must follow the full attribution rules of the Terms of Service
  (not reproduced in detail here). Non-commercial restriction in the Public Network ToS carves out Subscriber Content and API-delivered content. Logos/brand and Stack Exchange-owned content are not CC licensed
  (trademark guidelines apply). API docs: apps register on Stack Apps for a key; responses are heavily cached and polling the same request faster than once a minute is abusive. Share-alike makes this yellow.
  Content ingested for AI/LLM use falls under separate Stack Data Licensing terms (not assessed). Auth is optional for read methods (key/OAuth raises quota), but upstream lists OAuth.'
