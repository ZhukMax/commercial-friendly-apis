notes: Read /developers and /terms. Independent aggregator of NHS England published statistics (OGL v3.0,
  which itself permits commercial reuse with attribution); the operator asks users with heavy or commercial
  use to get in touch first, which is a request rather than a prohibition but leaves commercial use ambiguous.
  Live A&E waits are read from individual trusts' own websites (each trust's own estimate; their terms
  not checked) and may be stricter. OGL clause texts not quoted, only the operator's statement. Caching
  explicitly encouraged.
