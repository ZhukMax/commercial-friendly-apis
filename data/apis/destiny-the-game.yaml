  permission; the terms explicitly name ad-revenue sites as commercial. The BSD-3-Clause licence in the
  Bungie-net/api GitHub repo covers the OpenAPI spec files, not the data. Display/attribution rules for
  API Data are not stated beyond the Brand Feature licence -> unknown. Game content/art/music: Bungie
  says it cannot extend third-party licences to users. Entry is the Bungie.net Platform API (Destiny 2
  and Bungie.net accounts).'
