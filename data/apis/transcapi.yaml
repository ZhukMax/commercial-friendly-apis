notes: Read ToS (effective 29 Sep 2026), pricing, docs/data-sources, docs/rate-limits. Aggregator of upstream
  open data (BODS, NaPTAN, Network Rail/National Rail Darwin, TfL, OSM, NTA Ireland, OVapi, Belgian operators);
  upstream licences pass through to you and some are stricter (OSM ODbL share-alike on map/journey data;
  National Rail and TfL have own terms, not read). Free sign-ups temporarily suspended, paid from GBP5/month.
  ToS forbids reselling/sublicensing API access itself. ToS and pricing say nothing on caching/storage
  so storage_caching unknown; share_alike unknown.
