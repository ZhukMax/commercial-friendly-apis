notes: 'Read data.gouv.fr licences page (lists the only licences administrations may use: Licence Ouverte
  2.0 and, with share-alike, ODbL 1.0), the full Licence Ouverte 2.0 text, the Terms of Use (modalités
  d''utilisation) and the API getting-started guide. Etalab 2.0 explicitly allows commercial reuse, copying,
  redistribution and including data in your own product, subject to source attribution. Each dataset states
  its own licence; datasets under ODbL carry share-alike, and special ''homologated'' licences exist,
  so verify per dataset (share_alike left unknown). Platform content is under Licence Ouverte. The API
  guide requires a key only for write operations; reads are open, so upstream auth ''apiKey'' was changed
  to ''none''. No rate limits read.'
