notes: 'Read the current API Use Policy on developer.trakt.tv (updated October 2026; the Apiary docs at
  the listed URL are deprecated) and the Images/Caching pages. Standard access is free for commercial
  use including ad-supported apps, no approval needed; Premium (paid) only raises limits. Display of titles,
  images and ratings is allowed; caching is allowed for app features but a reusable copy of the catalog,
  resale/redistribution as a dataset, and keeping Trakt metadata/artwork after the integration ends are
  not. Not for apps promoting piracy. Trakt''s general Terms of Use (personal non-commercial) govern user-facing
  services, not the API. Images/artwork are third-party (studio) content: ''API access does not grant
  ownership of images or other third-party content''. Verdict yellow because caching is limited.'
