notes: 'Read Demografix Terms and Conditions (sections 4 Permitted Use, 5 Restrictions, 6 Caching, 7 IP).
  Commercial use is allowed. Restrictions: no building a competing name-to-gender service and no reselling
  API results as a standalone dataset (predictions may be an ingredient in your own product); results
  are estimates and must not be presented as verified facts. Bulk-publishing every name lookup as a dataset-like
  page set could fall under the resale ban, hence medium confidence. No attribution clause found. The
  site now offers a free API key (1,000 names/month); keyless calls still worked on 2026-11-21.'
