notes: 'The listed URL is a third-party Python module (Apache-2.0) for the Smithsonian Open Access API;
  the actual service is api.si.edu (api.data.gov key required, ''No api_key was supplied'' otherwise).
  si.edu pages (openaccess, terms of use) return a bot-verification page to curl and were not read, so
  the API''s own terms were not seen. Licence evidence: AWS Open Data registry entry (License CC0, managed
  by SI), the Smithsonian/OpenAccess GitHub repo (CC0-1.0 LICENSE) and the CC0 deed. CC0 covers only the
  ''open access'' subset (about 2.8M of 155M objects; records not flagged CC0 may be restricted, e.g.
  copyrighted or culturally sensitive items), so check each record''s usage flag before storing/displaying.
  Smithsonian API ToS/rate limits not verified. See also cooper-hewitt (CHNDM is one of the units here).'
