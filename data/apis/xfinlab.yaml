notes: Read https://www.xfinlab.com/api-terms.html (API Terms of Service, effective July 31, 2026). The
  page itself says it is an unreviewed working draft. No sentence explicitly permits or forbids commercial
  use (apps/products of the customer are allowed; competing data feeds are not), so commercial_use is
  ambiguous. Cache allowed only for a 'reasonable operational period'. The API aggregates upstream public
  data (SEC, FINRA, EIA, CBOE, FDIC, USDA, CPSC etc.) and the terms forbid uses that make XFINLAB breach
  its upstream providers' terms, so upstream terms may be stricter. Paid tiers are arranged individually;
  their terms were not read.
