notes: 'Pages read: GitHub repo page, README (Licenses section) and LICENSE of APIs-guru/openapi-directory;
  apis.guru and apis.guru/api-doc are JS-rendered and returned no text via curl. Mixed licensing: definitions
  contributed by authors are CC0 1.0, but definitions acquired from public sources are held only under
  a fair-use claim, so a given spec may belong to either group and third-party rights (vendor documentation)
  are not cleared. Hence ambiguous (yellow), not green. The whole collection is downloadable from the
  repo (bulk). No separate terms of use for the REST API.'
