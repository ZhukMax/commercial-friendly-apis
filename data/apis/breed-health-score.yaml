notes: Read developers page, terms page and the CC BY 4.0 deed. API licence is CC BY 4.0 (stated by the
  operator); the terms page repeats "please attribute Breed Health Score and respect the underlying data
  licence". Underlying lifespan data is McMillan et al. 2024 (CC BY 4.0); conditions are compiled from
  RVC VetCompass/AKC/PDSA (indicative, licences not checked); breed photos are via Pexels (Pexels licence
  not checked, not part of the CC BY grant). Attribution is phrased as a request ("we ask") but is also
  a field in the JSON; treated as required. Share-alike not stated (CC BY has none) but left unknown.
