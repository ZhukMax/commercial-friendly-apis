notes: 'Read the 1Forge License Agreement (PDF linked from https://1forge.com/license-agreement, last
  updated 2020-05-01) via pdftotext, the Terms of Use PDF, https://1forge.com/pricing and the API docs
  (JS pages read with Playwright in a fresh context). Licence: any project, commercial or not, as long
  as you do not resell or redistribute the raw feed; FAQ answers YES to website/app/commercial use and
  to publishing derived data, NO to reselling the raw feed. Archiving quotes locally "for internal use"
  is encouraged in the docs, so persistent storage is fine but a public re-publication of raw quotes is
  not. No attribution clause found. Plans are paid (pricing page: Starter 25 USD/month); no free tier
  verified. Quotes come from brokers/liquidity providers; upstream terms unchecked. Terms of Use PDF says
  site content may not be copied (applies to the website, not the data feed). URL redirects to https://1forge.com/api.'
