notes: The listed URL redirects to the data.gouv.fr dataservice catalogue; the API Geo (geo.api.gouv.fr,
  administrative divisions + address) entry was read. It says only that all source data is under "Open
  Data licences" (partners DINUM, INSEE, OpenStreetMap), access is open, without naming a licence per
  dataset; the OSM component may be ODbL (share-alike). The geo.api.gouv.fr FAQ question about the licence
  is JS-loaded and its answer was not read. Commercial use therefore ambiguous; storage/display unknown.
  Address search part is superseded by the Géoplateforme (see adresse-data-gouv-fr).
