notes: Read potterdb.com/about (Copyright Information), the docs intro and the GitHub licence metadata
  (MIT, code repository danielschuster-muc/potter-db). Potter DB states it operates under the MIT licence
  but also that it does not own the data, which was scraped from open sources such as the Harry Potter
  Wiki (Fandom, whose text is normally CC BY-SA, not verified here), and that it is not affiliated with
  J.K. Rowling or Warner Bros. The MIT licence presumably covers the project's own code/compilation; rights
  in the underlying Harry Potter content (characters, film material) stay with their owners and are not
  granted. No explicit commercial-use, caching or attribution statement, hence ambiguous/unknown.
