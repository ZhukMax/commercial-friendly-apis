notes: 'Conflict: the API page offers the content index under CC BY 4.0 (attribution + link), but the
  site Terms say not to scrape or republish content commercially without permission and allow only brief
  quotes. The API page is more specific to the API, but the Terms are not carved out, so ambiguous. The
  API is a page/topic index, not a priced dataset; the site is operated by a lender-affiliated company
  (Best Business Loans Ltd), irrelevant to terms.'
