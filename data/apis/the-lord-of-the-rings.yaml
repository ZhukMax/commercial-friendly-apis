notes: No formal terms of use. Documentation says you are welcome to use the data in your own apps and
  (fun) projects and that the project is non-profit and fan-made; About page calls it a non-commercial,
  open-source project (this describes the project, not an explicit ban on commercial users). An access
  key is required (free sign-up). Data was scraped from Kaggle datasets and covers books and Peter Jackson
  films; Tolkien estate/Middle-earth Enterprises/studio rights apply and are not granted. Caching, display
  and attribution are not addressed. Pages read via Playwright (JS-rendered).
