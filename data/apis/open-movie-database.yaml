notes: 'Generic OMDb Terms of Use (omdbapi.com/legal.htm): Site and Services are for personal use only;
  Contributions (the user-contributed movie data and images, per the home page) may not be used in connection
  with commercial endeavors, built into a business, archived, published or displayed except personal non-commercial
  use (4.1/4.2). The wording is site-wide boilerplate and the home page lists Patreon-funded API tiers
  and many third-party sites using the key, so how it is applied to API customers is unclear; read literally
  it excludes a commercial site. Poster API is patrons-only (home page). Film metadata and posters are
  also owned by studios/third parties; the API grants no rights to them. No attribution clause found.'
