notes: 'Read the Steam Web API Terms of Use (last updated July 2010) at steamcommunity.com/dev/apiterms;
  the wiki URL in the catalog sits behind an anti-bot redirect. Terms say nothing explicit about commercial
  or ad-supported use (only distribution of Steam Data to end users for their personal use via your Application)
  -> commercial_use unknown. Conditions: privacy policy, store only what the user requested and tell them,
  Valve name/logo/links required on pages using the data and links may not be nofollow (a mandatory dofollow
  backlink would cap the verdict at yellow even if commercial use were confirmed), 100,000 calls/day,
  no implying Valve endorsement, must also comply with the Steam Subscriber Agreement (not read). Game
  names, images and store data belong to publishers/Valve. Part of the API is user-scoped (OAuth/OpenID
  sign-in).'
