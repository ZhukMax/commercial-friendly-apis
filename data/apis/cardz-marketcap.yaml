notes: 'Read /data and /terms. Dataset (market cap, price, population figures) is CC BY 4.0 incl. commercial
  use; credit with effective date required. Restrictions: no bulk scraping at unreasonable rate, no reselling
  the raw feed as-is, no misrepresenting the source. Card names, set names, card artwork and imagery belong
  to their rights holders (Pokemon Company, Bandai, etc.) and PSA population data is sourced from third
  parties ("Market data is sourced from third-party platforms"); the licence grants no rights in those
  underlying items and the upstream sources (PSA, sales platforms) were not assessed. Small new site;
  terms dated 2026-10-26. Bulk access is available on request only (not verified further).'
