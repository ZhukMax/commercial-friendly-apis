notes: Read /terms (sections 1-8). Section 4 licenses use of the data in the user's own applications on
  any plan including free, however monetized, with storage allowed; reselling/redistributing as a standalone
  product and replicating the database are excluded; model-derived values may be shown to end users but
  not presented as own metric or redistributed as dataset. Display in own apps is implied by 'use in its
  own applications' (only model values mention end users explicitly), hence medium confidence. Images
  (player photos, posters) are third-party content with NO licence granted (section 5). Data covers pro
  tours (Premier Padel, WPT) so upstream rights may be stricter. Section 2 website-use licence concerns
  the website materials, not API data.
