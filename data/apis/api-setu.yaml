notes: Read the API Setu Terms of Use (docs.apisetu.gov.in/document-central/terms-of-use, subpages Permitted
  Use, API Prohibitions, Intellectual Property, Non-Personal Data Handling, Usage Limits) and the API
  Policy page. API Setu is a gateway/marketplace for many Government of India and private APIs (KYC, DigiLocker,
  education, business); each API needs registration/credentials plus often provider approval (SOP for
  API Access), so upstream auth 'none' is wrong (set to other). Use is limited to 'internal and approved
  use cases'; non-personal data is NDSAP/GODL (free reuse) but personal/KYC data is subject to consent
  rules, data-localisation and ban on profiling. No blanket commercial/ad-site permission; terms per API/provider,
  so ambiguous (yellow at best) and unsuitable as a content source for a public ad/affiliate site without
  per-API approval. Storage/caching and attribution not addressed. GODL text itself not read.
