notes: Read the CCP Developer License Agreement (ESI). The Purpose is an Application for non-commercial,
  non-profit use; the developer may not charge fees or otherwise monetize except in-game currency donations,
  voluntary donations, and general advertisements (e.g. AdSense). Affiliate links or selling products
  based on the Game Data are not permitted without separate agreement, so a commercial site is at best
  ambiguous. Storage, display and attribution rules were not found as separate clauses (Game Data includes
  CCP marks, images, etc.), left unknown. The ESI UI URL redirects to developers.eveonline.com docs; ESI
  also needs OAuth for character data (static/public endpoints exist).
