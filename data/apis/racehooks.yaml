notes: 'Read ToS v1.5 (29 Oct 2026), AUP v1.2 and Attribution pages. AUP explicitly permits building apps, dashboards, fantasy and multi-tenant products and charging own customers; forbids reselling the
  raw feed, bulk-harvesting/archiving the dataset to copy it, and replicating the models. Caching for a product''s own display seems fine but bulk archiving is banned (limited). ''Not required to display
  attribution'' is in the ToS sentence about f1db-sourced historical data; the service credits its own sources on its Attribution page. Not an official data source: F1 data is not sourced via FOM or its
  authorised suppliers; F1 marks belong to Formula One Licensing BV; wagering restrictions apply (not usable as official/sole settlement source). Upstream: f1db (CC BY 4.0), GDELT headlines, NOAA/ERA5 weather.
  Live timing upstream rights not verified. Downstream users must be bound by terms at least as restrictive.'
