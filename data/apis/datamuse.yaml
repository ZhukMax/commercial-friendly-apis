notes: 'Only the API docs page exists (no ToS, no licence page; /terms is 404). ''Usage limits'' section:
  free up to 100,000 requests/day; for a ''customer-facing application'' or custom needs, describe the
  application to the operator by message (unclear whether permission is required). Acknowledgement of
  Datamuse is requested (''kindly''), not mandated, so attribution is ambiguous. Notice on page: from
  1 Feb 2027 an API key will be required and access limited to 100,000 requests/day per key (auth will
  then be apiKey; stays none today). Data sources listed include CMU dict, Google Books Ngrams, word2vec,
  Paraphrase Database, WordNet, OneLook-crawled dictionaries and Wiktionary, whose licences may impose
  their own conditions. Commercial use, storage and display not stated: unknown.'
