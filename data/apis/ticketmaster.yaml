notes: 'General Terms of Use (updated 2023-06-27) prohibit deriving revenue from the API "except as set
  forth below" but nothing below grants a commercial exception, so ads/own monetisation are ambiguous;
  the Affiliate Program (Impact tracking links) is the documented route to monetise, and the terms also
  forbid apps that replicate Ticketmaster.com, require removal of content within 24h on request, and limit
  caching to reasonable periods. FAQ: no right to use official NFL/NBA/MLB/NHL creative by default. Display
  is only implied (licence to build an application), hence ambiguous. A separate Partner API terms page
  exists (not applicable to Discovery API) and was not read.'
