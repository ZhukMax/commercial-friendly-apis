notes: 'Pages read: terms (legal/terms), data attributions, pricing, docs. Hosted API is a paid-SaaS with
  a free tier (50k credits/month) where pricing says commercial use is allowed; ToS section 4 imposes
  no contractual cache/storage limit but says underlying data licences (attribution, share-alike) still
  apply. Underlying data is mostly ODbL (OSM, Overture, some OpenAddresses): the attributions page warns
  that public use of a derivative database can trigger ODbL share-alike, so share_alike left unknown (depends
  on how results are used; storing results alongside your own data per OSMF Geocoding Guideline is usually
  a produced work). Per-country credit lines (ES, AT, IT) apply. Resale of raw API access is forbidden.
  auth is apiKey (free key needed).'
