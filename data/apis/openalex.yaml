notes: 'Pages read: help.openalex.org pricing and API pages (docs.openalex.org redirects to help.openalex.org;
  same service). Data is CC0 with no personal-use carve-out; API is free up to $1/day usage and now needs
  a free API key (auth was none in upstream list). Paid plans sell budget, support and daily sync, not
  data. No separate API ToS page was found (404 on /access/terms/), so confidence medium. Full-text PDFs
  are third-party content with their own licences (not covered by CC0 metadata).'
