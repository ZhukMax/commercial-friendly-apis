notes: Read the API Terms & Guidelines page. Commercial use is allowed unless the app competes with or
  replaces Dribbble (no designer directories, search, hiring/job tools, portfolio display sites except
  with OAuth authorisation by the member). Only data exposed via the API may be used and saving/storing
  it is prohibited; shots must be removed within 24h on request; member content rights stay with members.
  OAuth needed. Developer docs site itself is CC BY, which is unrelated to the API data. Verdict overridden
  to red because storage is forbidden and display is restricted to the point a catalog/aggregator site
  cannot use it.
