notes: API page states the data (16 MBTI types, OEJTS test items and scoring) is CC0 and free of attribution
  duty; static data, no LLM. The separate site Terms of Service (personality.fyi/terms) tell users not
  to scrape content at scale or submit automated queries, which is about the consumer site and AI features;
  the API page invites use, but this slight tension keeps confidence medium. Only the small static API
  (/api/v1) is covered, not the AI career/compatibility features. MBTI is a trademark; the data here is
  descriptive text by the site (not checked for third-party sources beyond its own OEJTS public-domain
  note).
