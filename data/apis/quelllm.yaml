notes: Link redirects to /api/index.html (same site). The page states the API is CC BY 4.0, free to use
  including commercially with a clickable attribution link to quelllm.fr. Storage/display/no-share-alike
  derived from the CC BY 4.0 deed, which the site names as its licence (CC BY has no share-alike). Data
  is generated from public sources (HuggingFace, Ollama, papers, community tests) with no per-source licence
  review; model licences listed inside the data are the models' own. No key, CORS enabled. Only the API
  page was read, not a separate ToS.
