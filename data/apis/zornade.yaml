notes: 'Read the Zornade Terms of Service (updated 31 Oct 2026, Italian). Free plan explicitly allows
  commercial products, displaying data to own users/customers and storing it as long as needed, with mandatory
  visible Zornade attribution plus original source attributions (never waivable). Underlying sources carry
  different licences (some ODbL, OMI under Agenzia delle Entrate terms): share-alike effects not assessed,
  and "do not resell raw downloaded data without attribution". Rate limit in terms (10,000/h) differs
  from the marketing page (1,000/h free). Merged duplicate entry `zornade-zornade`.'
