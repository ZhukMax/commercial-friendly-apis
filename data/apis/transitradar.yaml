notes: Read /faq, /data, /get-key (no separate API terms page found; /terms is 404; Scalar API reference
  page is JS-only). The site is a presentation layer over Network Rail, National Rail Enquiries (Darwin),
  BODS and OSM data. FAQ says the underlying data belongs to its publishers and advises getting the feeds
  yourself rather than treating this site as the source; only its own punctuality aggregates are explicitly
  reusable with credit, while reason texts and per-train rows are feed data it cannot license and formation
  data has separate non-redistributable terms. So commercial use and display are ambiguous. Storage/caching
  unknown. Upstream terms (National Rail, Network Rail) may be stricter and were not read.
