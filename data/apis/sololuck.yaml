notes: Read https://sololuck.io/api and https://sololuck.io/terms (effective 2026-07-02). Only the Solo
  Block Record dataset (/api/legends/v1/blocks.json|csv) is labelled "open data under CC BY 4.0" (CC BY
  allows commercial use with attribution, but the page quote does not spell that out). The pool/miner
  stats endpoints carry no licence statement and the site Terms cover only the mining service (acceptable
  use, liability), not data reuse, so commercial_use is ambiguous overall and storage/display/attribution
  are left unknown. Pool stats are operational data of a mining pool, not a licensed dataset.
