  only. Caveats: multimedia and content inside downloadable documents always need prior approval; datasets
  by other publishers may state their own restrictions (''Where prior permission is required ... restrictions
  on reuse are explicitly stated''), so check per dataset. The ''API'' is a DCAT-AP metadata export plus
  an experimental LDF server, no rate limits stated. Home link redirects to a language-selection page.'
