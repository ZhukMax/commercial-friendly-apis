notes: 'Read /data (re-use page), /terms-and-conditions, /fair-use-policy and the OGL v3.0 text. Gazette
  content is OGL v3.0 unless stated otherwise, but OGL does NOT cover personal data: insolvency, probate
  and similar notices name individuals, so storing/displaying them on a commercial site raises UK GDPR
  issues the licence does not resolve. Free linked-data API (SPARQL/JSON/XML; docs on GitHub TheGazette/DevDocs)
  plus a paid subscription Data Service with separate T&Cs (not assessed in depth). Auth listed as OAuth
  upstream; fair-use page governs bot access. Not legal advice.'
