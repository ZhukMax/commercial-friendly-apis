notes: 'API and Data Licensing page plus Terms of Service (TheTVDB, a Whip Media company). Pricing is
  by project revenue: free with attribution under $50k/year, $1,000/yr for $50k-$250k, $10,000/yr for
  $250k-$1M, custom above (signup page), so commercial use is allowed on all tiers. The ToS API licence
  is limited to the approved product; displaying metadata with attribution is clearly intended, but distributing/reselling
  the Data is prohibited, hence display ambiguous. Images, trailers and programming are explicitly NOT
  licensed: you must clear rights with the content owners. Caching/storage not addressed. Film/TV metadata
  and artwork carry third-party (studio) rights.'
