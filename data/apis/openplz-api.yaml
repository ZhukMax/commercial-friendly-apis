notes: 'Pages read: OpenPLZ FAQ, data-sources page, ODbL 1.0 summary (opendatacommons.org). The FAQ says use is free and permitted in commercial projects and that the processed data is under ODbL; there
  is no separate terms-of-service page. Storage/display/attribution/share-alike come from the ODbL summary, which applies because the FAQ states ODbL. Share-alike only bites if you publish an adapted database;
