notes: Firmbase Terms read. Data comes from the Belgian KBO/CBE and National Bank annual accounts; the terms say source data 'is subject to their reuse terms' (upstream not checked) and the site footer
  says no contact details of sole traders, as the KBO licence requires. Terms prohibit offering responses as a database/extract to outside parties, reselling, and republishing as a competing API. Commercial-use
  wording is 'your own product', no explicit non-commercial clause; plan-limited (free plan has a daily cap).
