notes: 'Terms page read (core.ac.uk/terms) plus /services/api. Only the ODC-By datasets are clearly open
  for commercial use. The API and other datasets need a licence: free for individuals/public research
  organisations in non-monetised use; anyone building something that might be monetised must contact CORE,
  so a commercial ad/affiliate site is negotiated, not self-serve (ambiguous). CORE says it does not own
  the underlying papers (aggregator of repositories; rights stay with original rightsholders; licence
  info is often not machine-readable) and forbids unauthorised scraping. Terms also say CORE is reviewing
  its data-licensing framework. Storage/display left unknown.'
