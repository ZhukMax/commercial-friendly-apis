notes: 'Read apidocs.cheapshark.com (Postman docs, via Playwright; www.cheapshark.com/api redirects there)
  and the site terms footer. Free, no key. Condition: deal links must go through CheapShark redirect links;
  use of your own affiliate links for any tracked store is forbidden, but ads, subscriptions and donations
  are allowed. So an affiliate-link site cannot use it with its own affiliate IDs. Not designed for bulk
  caching (permanent block risk) -> storage limited. Prices belong to the stores; site states "Copyrights
  and trademarks are the property of their respective owners". Attribution only appreciated.'
