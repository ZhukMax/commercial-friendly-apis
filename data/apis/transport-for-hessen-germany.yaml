notes: 'Link redirects to rmv.de/s/de/rmv-open-data; API access needs a registered key (form with intended
  purpose; no entitlement to a key), so auth is apiKey. Read the German API Nutzungsbedingungen: timetable
  results may be used only for passenger information, only as single queries shown to end users (natural
  persons), storage/copying of a substantial part is forbidden, RMV must be credited with logo, test version
  must be given to RMV. Terms never say outright whether ads/commercial sites are allowed (only that ads
  on the same page must be lawful), so commercial_use is ambiguous. The downloadable stop list has a broad
  copy/distribute right limited to the declared purpose.'
