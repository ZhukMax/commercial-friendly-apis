notes: api.nasa.gov is a JS signup page with no terms text (key via api.data.gov); its API terms and rate
  limits were not read. The NASA Images and Media Usage Guidelines (general NASA content, not API-specific)
  say NASA content is generally not copyrighted in the US and may be used commercially if no endorsement
  is implied, but third-party copyrighted items, logos and identifiable persons need clearance and individual
  endpoints (APOD, etc.) may carry third-party images. Hence ambiguous/yellow, low confidence. Needs per-endpoint
  check.
