notes: 'Open data page: static JSON/CSV files (no key, CORS open) of Clutch''s own NBA win probabilities
  under CC BY 4.0. Only Clutch''s own numbers are covered, not NBA data. The site Terms of Use (app) forbid
  scraping the app data but do not address the open-data files. Not a query API: downloadable files rebuilt
  four times a day. CC BY terms (commercial, copying) cover storage/display.'
