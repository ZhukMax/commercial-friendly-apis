notes: 'Not a public data source: Smartcar is an OAuth, account-scoped vehicle connectivity API (data
  and commands for vehicles whose owners consent). Developer ToS (effective 2025-01-28) let developers
  build applications and offer them to Developer Customers/End Users; resale of the Smartcar services
  standalone is prohibited. Storage, display and attribution rules were not found in the ToS text read
  (data handling is tied to End User consent), so left unknown; Free pricing plan is described as for
  individuals exploring (1 connected vehicle). OEMs may restrict data at will. commercial_use=yes is low
  confidence for a site with ads, since the data is private user data, not publishable content. Link redirects
  to /docs/getting-started/introduction. Data licence not stated on a page read; characterised as: proprietary
  (Smartcar Developer Terms of Service).'
