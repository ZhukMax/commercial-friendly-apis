  the employers wishes, so redistribution_display=ambiguous. Commercial use, caching unknown; ATS vendors
  (e.g. SmartRecruiters asks automated tools not to read its API) and employers may have stricter terms,
  not assessed. The /api page is only the Apify API usage page; the Actor page was read too.'
