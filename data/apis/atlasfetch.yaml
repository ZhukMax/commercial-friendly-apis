notes: Read ToS (updated 20 Oct 2026) and the data attribution page via curl. The ToS allows building
  products on the lookups and forbids bulk extraction or republishing the data as a dataset or reselling
  raw API access; it says nothing about caching individual results, so storage_caching is ambiguous. Boundary/street
  data is OSM-derived under ODbL, so attribution and share-alike pass through to the user. Municipal address
  data (Cape Town etc.) has its own open-data terms (not assessed). Free-tier commercial scope not explicitly
  stated; ToS has no non-commercial clause.
