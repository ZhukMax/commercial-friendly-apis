notes: 'Read the API Terms of Service (last update 1 March 2021) and the apidocs pricing page. The ToS
  says the Free plan is free for commercial use up to 20,000 requests/month and 100,000 MAU or 500,000
  page views, but the pricing page says Free is ''non-commercial projects only'' and lists ''Commercial
  use'' under the $149/month Business plan: conflicting, so commercial_use ambiguous. Backlink to RAWG
  required on every page using the data (verdict_override yellow). ToS 4.3(5) forbids using the Services
  ''for the purposes of further distribution'' and 6.2 forbids copying content to another server/website
  for commercial purposes without written consent, so storage/caching is unclear (left ambiguous-leaning,
  recorded unknown). Game metadata, screenshots and artwork belong to publishers/developers/third parties;
  RAWG disclaims ownership and grants no rights to them.'
