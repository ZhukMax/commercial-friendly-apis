notes: 'French CGU (legal/cgu, last updated March 2026; text is delivered in the Next.js page payload,
  read via curl). Art. 4: no reselling/redistributing the raw data to third parties without written permission,
  no scraping outside the API, no mass requests to rebuild the database, use only for professional activity;
  but integrating data into the user''s own product or service is allowed with credit to ''Sparepilot''.
  Storage/caching length not stated (unknown). Art. 5: product data (names, references, public prices)
  come from public sources and remain the property of their holders, so upstream rights may apply. API
  key requires an account with business details (SIRET); bulk export is on the Pro plan (developer page
  shows Pro as 500 EUR/month in the header and 49 EUR/month in the comparison table, inconsistent). Free
  Basic plan is ''free during beta''.'
