notes: 'Read ToS sections 5, 6, 8, 9, 12 on adanos.com (the /docs page links there; api.adanos.com/terms
  is 404). Free and Hobby are non-commercial; a Professional plan is needed for customer-facing/commercial
  use. Storage is allowed only for permitted internal use; publishing or exposing Source Content/Raw Mention
  Data to unrelated third parties and redistribution as a data feed are prohibited, so public display
  is ambiguous. Aggregator of Reddit, X/Twitter, news and Polymarket content: upstream platform terms
  may be stricter and the ToS says you must assess onward use of Source Content yourself.'
