notes: 'Read /terms (updated 2026-11-05), /faq and /pricing and docs. The FAQ (provider''s own page) states
  commercial use is allowed on all plans incl. Free, storing/caching allowed with no deletion deadline,
  no attribution needed; forbidden: reselling/redistributing the raw feed or re-exposing it as an API,
  and use on live-streaming/pirate streaming sites. ToS 4.2/7.1 only say ''resell or redistribute API
  data without authorization'' and ''may not ... create competing services'' so the generous commitments
  rest on the FAQ rather than the formal ToS text (medium confidence). Aggregator of public sources: the
  service holds no league licence, is not affiliated with any league, and team names/logos/league marks
  you display are your own responsibility (upstream league/odds data rights may be stricter). Data includes
  betting odds; informational only, 20-30 s delay, no SLA.'
