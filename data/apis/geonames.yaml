notes: Terms page says "cc-by licence" without a version number; data_license is "CC-BY" because the page
  gives no version number. Free web services require a registered free username (auth set to apiKey, source
  list said none). Daily allCountries.zip dump is downloadable, so storage/self-host is covered by the
  CC-BY data licence; the page does not discuss caching of web-service responses explicitly. Data is provided
  "as is". API is HTTP on api.geonames.org per docs.
