notes: 'Polygon.io was renamed Massive.com on 2025-10-30 (blog post confirms same APIs/accounts); polygon.io
  redirects to massive.com. Terms: individual plans (including free) are personal non-commercial only;
  business use needs Massive for Businesses plan (Order Form). Business terms allow storing and displaying
  market data in own websites/apps, but forbid redistribution, data feeds or machine-readable delivery
  to end users, require third-party-provider attribution/delay labels, and are subject to exchange (Third-Party
  Provider) agreements and market-data fees; separate Market Data Terms not read. Non-display / derived-data
  use needs extra licence. Pricing not read. Merged duplicate entry `polygon-io`.'
