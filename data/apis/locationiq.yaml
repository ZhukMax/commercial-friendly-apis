notes: 'Read /tos, /pricing (FAQ: licensing terms and caching policy) and /attribution. Free plan is allowed
  in commercial projects with a link back (pricing page calls it "Limited Commercial Use"); paid plans
  list "Commercial Use". Caching terms are internally inconsistent: ToS prohibit collecting request-response
  pairs beyond temporary caching, give free accounts 48 hours and customers the duration of the relationship,
  yet also say "You can store response data forever", and forbid server-side tile caching. Hence storage_caching
  ambiguous. Upstream data (OSM ODbL, GeoNames CC BY, OpenAddresses, Who''s On First) is credited on /attribution;
  ODbL implications for stored results not assessed. Old URL locationiq.org/docs redirects to docs.locationiq.com.'
