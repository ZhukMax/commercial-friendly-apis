notes: Read /developers and /terms (v6, 31 Jul 2026) via Playwright (Cloudflare blocks curl). The Developer
  API page offers a free public read-only API with no key but contains no licence, attribution or reuse
  terms. The general Terms of Service say content is licensed for personal use only and may not be copied
  or distributed without permission; unclear whether that covers API data, hence ambiguous for commercial
  use and display. Storage/caching and attribution unknown. Data is third-party owner listings on a marketplace;
  no explicit permission to republish prices/availability.
