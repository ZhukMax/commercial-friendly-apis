notes: 'Pages read: GitHub Terms of Service (Section H API Terms, D User-Generated Content), Acceptable
  Use Policies (section 6 services usage limits, 7 information usage restrictions), REST rate-limit docs.
  The API has no general commercial-use ban, but Section H says all API use is subject to the ToS, bars
  using data for spamming or selling users'' personal information, and says subscription access is for
  uses that would result in resale of the service. The AUP forbids reselling or exploiting the Service
  without written permission. API output is mostly user content owned by individual authors under their
  own repository licences (e.g. MIT, GPL, or none), so there is no single data licence. Hence ambiguous
  (yellow), not green; storage/caching not addressed in the pages read. Link redirects to docs.github.com/en/rest.
  Merged duplicate entry `github`.'
