notes: 'Terms page: free and paid keyed plans both allowed for commercial use; storing/re-using retrieved
  data permitted (''caching is for customer end-use only''). Redistribution of the data is not permitted,
  data only for end purposes, not in a service offering programmatic access to rates. Displaying rates
  in your own store/site is the advertised use case (localized pricing), but the ''no re-distribution''
  wording leaves public display ambiguous, so redistribution_display=ambiguous (yellow). Attribution:
  keyed Free/Pro plans need none; the keyless open-access endpoint requires a link (docs/free). Data is
  blended from central banks and commercial sources (per homepage), upstream terms not checked.'
