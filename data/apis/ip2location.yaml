notes: Read the IP2Location Master License Agreement (/terms), which covers Licensed Products incl. Web
  Services, and the legacy web-service page. This legacy service no longer accepts new registrations (redirects
  to IP2Location.io, see entry ip2location-io). The MLA limits use to paid licensees for "internal business
  operations" (content localization etc.) and forbids redistribution to third parties and displaying the
  Licensed Products to others without a Redistribution Licence; it says nothing specific about caching
  of web-service results. Showing localised content on your own site is arguably internal use, but displaying
  raw data to visitors is arguably forbidden, hence ambiguous display and storage. Yellow at best; legal
  review advisable.
