notes: Read /terms (Nov 2026) and /docs. Docs say the API is free for personal, hobbyist, academic and
  open-source projects; neither page mentions commercial/ads/affiliate use, so commercial_use is ambiguous
  (not read as a ban). ToS permits querying the public API/MCP provided Touchline Wire is cited as source
  when reproducing insights, bans DoS, proxy-allowlist bypass and republishing the whole platform as a
  competing mirror. Storage/caching not addressed (only 'respect caching headers'). Homepage states stats
  use 'API-Sports Pro' data and lineups/injuries/rumours come from live feeds, press conferences and news
  outlets, so upstream (API-Sports, league, publisher) terms may be stricter. Site disclaims any affiliation
  with the Premier League/clubs; club names are fair-use identifiers.
