notes: 'No explicit data licence: the Licensing page only says the Internet Archive asserts no new rights,
  and warns of possible existing rights issues on contributions. The API page says APIs serve open/mission-aligned,
  human-centered lookup and are not for high-traffic commercial infrastructure (no outright ban on commercial
  use). Small ad/affiliate site is a grey area; heavy use should use monthly data dumps or contact openlibrary@archive.org.
  Page last edited 2026-11-17. Cached responses are encouraged. Attribution not stated on pages read.
  Cover images have separate per-image rights, not checked.'
