  terms. GitHub''s licence API reports MIT, but the repository root listing (master) has no LICENSE file
  and the README has no licence text, so the grant cannot be confirmed and commercial_use is ambiguous.
  No ToS, rate-limit or availability statement for emojihub.yurace.pro (the old emojihub.herokuapp.com
  link in the README is stale). Emoji metadata (names, codes) derives from Unicode data; the artwork/glyphs
  are not provided. Self-hosting via Dockerfile is possible.'
