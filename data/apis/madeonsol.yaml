notes: ToS section 5a. Free/Pro/Ultra plans = internal use only; showing data to your own users needs
  the Business plan (one product, "Powered by MadeOnSol" attribution); raw/bulk redistribution forbidden
  on all plans; retention beyond 24h or a queryable dataset needs Enterprise. So a public commercial site
