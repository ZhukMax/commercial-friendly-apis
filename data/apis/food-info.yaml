notes: Read the Developer API page (https://food-info.org/developer; Cloudflare blocks curl, read with
  Playwright) and the site Terms & Conditions (updated 2026-08-21). The Developer page has no licence/commercial
  terms. The site T&C allow referencing site data only for 'personal, non-commercial use' and forbid mass
  extraction 'for commercial redistribution'; it is unclear whether that governs the API, so commercial_use
  is ambiguous and storage/display left unknown. The service aggregates USDA FoodData Central (public
  domain), CoFID (OGL v3.0), Ciqual, Danish, AUSNUT and Open Food Facts data; upstream terms may be stricter
  (e.g. Ciqual CC BY, OFF ODbL) and were not assessed per dataset.
