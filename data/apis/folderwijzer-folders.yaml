  link to eerste.nl''. It states the files are cached and refreshed daily; storage/retention by the consumer
  is not addressed, so storage_caching unknown (verdict therefore unknown). Only alcohol offers carry
  full labels; other categories only folder level plus deeplink. The folders are retailers'' promotional
