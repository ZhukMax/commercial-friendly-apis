notes: Read the API wiki page ("Attribution and use policy") and the GitHub repo page (code is GPL-3.0, which covers software, not hosted user data). The wiki imposes mandatory attribution and respect for
  map privacy (unlisted/private maps must not be indexed or exposed). No statement on commercial use, caching or a data licence; cartes.io /terms and app.cartes.io /terms returned nothing. Maps/markers
  are community-contributed content with unknown rights, so core fields stay unknown. Self-hosting possible (open source repo); the repo is described as Laravel app.
