notes: 'The OpenFEMA dataset page (fema.gov, read in a browser because curl gets HTTP 403) offers v1.20 (December
  2025) downloads and says the NRI terms are on the National Risk Index Census Tracts item; those terms were
  read from that ArcGIS item (licenseInfo, via the ArcGIS REST URL used as evidence). End use is not controlled,
  but: the data are meant for planning purposes only and are not a substitute for a localized risk assessment
  (state this on pages); cite the dataset with its version and the retrieval date; show the non-endorsement
  notice; do not reverse engineer or derive the underlying input datasets; FEMA may rescind use and ask you
  to destroy copies, hence storage_caching limited and verdict yellow. The general OpenFEMA API terms (fema.gov/about/openfema/terms-conditions)
  add a no re-identification clause and say data are used "solely for statistical research or as a reporting
  record". hazards.fema.gov (the old NRI site) did not answer from curl or the browser on 2026-11-22. No data
  licence is stated.'
