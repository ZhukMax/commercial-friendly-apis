  the data as an equivalent API/feed. Quotes come from the exchange-rate (and CEP) service; ToS says quotes
  come from ''fontes do mercado financeiro'' (unnamed), so upstream terms may be stricter - not verified.
  Docs page https://docs.awesomeapi.com.br/api-de-moedas also read.'
