notes: 'wger.de (hosted site, ToS, API page and about pages) sits behind an Anubis proof-of-work bot challenge
  for curl; not bypassed, so hosted-service terms were NOT read. Read the project docs on wger.readthedocs.io
  (API usage, licence section): public endpoints such as exercises and ingredients need no authentication
  (upstream ''apiKey'' is only for user-owned data, so auth set to none); rate limits listed. Licence
  statement covers only the ''initial'' exercise/ingredient data (CC-BY-SA 3.0, stated by the project);
  licence of later community-contributed exercises and of ingredient data (likely imported from other
  sources) and wger.de''s own terms were not verified, hence commercial_use=ambiguous and confidence low.
  The CC deed (3.0) itself permits commercial use with attribution and share-alike, and some images come
  from Wikipedia with separate licences. Self-hosting is supported (AGPL software, Docker). Share-alike
  applies to adaptations you distribute.'
