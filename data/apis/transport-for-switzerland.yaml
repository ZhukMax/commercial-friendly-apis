notes: Read the General Terms and Conditions of Use of the Swiss Open data platform mobility (SBB operates
  it for FOT). Data are open for any "private individual or company", may be processed and published,
  only source citation and authorship rules apply; service-based data (APIs) need free registration and
  have request limits. The terms do not use the word "commercial" and do not state a share-alike duty,
  and caching is only implied by the duty to update, so those readings are inferred; confidence medium.
  Some linked datasets (e.g. third-party TDP data, FEDRO) have their own terms.
