  reports (source_details lists each source) and the per-resort attribution_required flag tells to treat
  unchecked as true, so upstream terms may be stricter; the site admits some sources'' terms don''t allow
  reading. Only the ski map layer is stated under ODbL (OpenSkiData, (c) OpenStreetMap contributors).
