notes: Read the Tetra Channel API doc and the TETR.IO Terms of Service. The API doc says "Do not use the
  API in ways that break the TETR.IO Terms of Service" and asks to honor cache times (re-request rule,
  not a storage licence). The ToS restricts exploiting game "Content" outside intended use without permission;
  it is unclear whether API player/leaderboard data counts, and there is no explicit API data licence,
  so commercial use and display are ambiguous. Main game API (tetr.io/api) is not allowed without written
  consent. Storage and attribution left unknown.
