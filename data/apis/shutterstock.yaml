notes: 'Read the API reference (https://api-reference.shutterstock.com/, overview and subscription table)
  and the Shutterstock License Agreement (https://www.shutterstock.com/license, general TOS; pages return
  403 to bots but render in a browser, read with Playwright). The dedicated API terms of service (accepted
  when registering an app) were NOT read: no public URL found. Content is third-party (contributors) and
  sold per licence: commercial use of the images needs a paid licence/subscription; the API itself returns
  watermarked previews. The licence forbids reselling/redistributing content and displaying it as a searchable
  "gallery" for third parties, so a catalogue/affiliate site built on the previews is at best ambiguous.
  Caching/storage of metadata and previews unknown. Editorial-only content cannot be used commercially.'
