notes: API Terms of Service and Singapore Open Data Licence v1.0 read via the redirected apidocs site
  (the JS page was read with Playwright in a fresh context only to find the two legal links; legal pages
  read with curl). Commercial and non-commercial use allowed; use of the datasets is governed by the SODL,
  which permits download, copying, distribution and modification, requires a conspicuous source notice
  and forbids implying official endorsement. The API terms say individual API pages may carry additional
  terms and the licence excludes personal data, third-party rights, trademarks; the registration-gated
  Developer Agreement and per-API pages were not read, so confidence is medium. Rate limits not found.
