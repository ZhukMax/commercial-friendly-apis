notes: Read /terms-conditions and the API docs. Licence grant covers personal or commercial purposes;
  public display requires visible credit with a link to pokewallet.io (plain credit, no logo). Terms say
  nothing about storage/caching duration, so storage_caching unknown (yellow). Terms 4.2 forbid bots/scrapers
  without permission and rate limits/quotas apply per plan (not quantified here). Pokemon and other TCG
  IP belongs to its owners (5.2 says PokéWallet claims no ownership); prices come from TCGplayer/Cardmarket,
  whose upstream terms were not assessed; the licence grants no rights in card images/artwork.
