notes: Read lichess.org/terms-of-service (modified 1 Aug 2026; Cloudflare blocks curl, read via Playwright), the database.lichess.org page and the API spec (lichess-org/api). ToS invites commercial use
  of the services (API access listed) but says licences differ per service ("different licenses may apply to different services") and that Lichess can change licensing or revoke access. Only the database
  exports are explicitly CC0; for live API responses storage, display and attribution are not stated, so those fields stay unknown (verdict yellow). User-submitted content (games, studies, blogs) stays
  with its authors under the ToS content clause. Much of the API is account/OAuth-scoped; public endpoints (users, games, puzzles) are usable without a token.
