notes: Section 5.5 prohibits copying/distributing site content for commercial purposes and extracting
  or reusing a substantial part of the database, except with written authorisation or an API plan whose
  conditions expressly allow it. The API docs and pricing markdown describe plans (Gratis for prototypes;
  production from 29 EUR/month) but I found no API licence text stating that paid plans grant commercial
  display/storage rights; hence ambiguous. The underlying IAE/CNAE codes are official AEAT/INE data (source
  attribution section 5.2). Free plan locks the IAE-CNAE crosswalk field.
