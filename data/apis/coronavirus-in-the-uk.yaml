notes: 'The listed URL (coronavirus.data.gov.uk/details/developers-guide) now 301-redirects to the new
  UKHSA data dashboard; its COVID-19 archive page refers to the ''decommissioned Coronavirus (COVID-19)
  in the UK dashboard'', so the old API is retired and the UKHSA dashboard API (api.ukhsa-dashboard.data.gov.uk)
  is the successor. Terms read are those of the new service: all content OGL v3.0 except where otherwise
  stated; OGL text read at nationalarchives.gov.uk. The old dashboard''s API itself is no longer available;
  the entry''s data now means the new API/archive downloads (COVID-19 archive 1.4 GB). Statement ''except
  where otherwise stated'' means individual datasets could carry other terms (not checked). Rate limits
  not read.'
