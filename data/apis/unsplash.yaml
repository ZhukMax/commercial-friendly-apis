notes: 'Read https://unsplash.com/developers and /documentation, and the API Guidelines articles on help.unsplash.com (attribution, hotlinking, download tracking) via Playwright. unsplash.com/api-terms,
  /license and /terms are behind a proof-of-work bot challenge that was not bypassed, so the API Terms and the Unsplash License themselves were NOT read: commercial_use stays unknown (verdict unknown) although
  nothing read forbids commercial apps. Guidelines read: images must be hotlinked from the API URLs, a download event must be sent to download_location when a user picks a photo, photographer + Unsplash
  credit with profile link and utm parameters is mandatory, no unaltered resale (prints, products), no replicating Unsplash (wallpaper apps), API for non-automated authentic experiences, no Unsplash name
  in the app name. Photos may show people, brands or artworks with rights the licence does not clear. Demo-mode apps need production approval for higher limits.'
