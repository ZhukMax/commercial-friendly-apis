notes: 'Read the developer docs (https://developers.giphy.com/docs/, via curl) and the GIPHY API Terms of Service (Playwright, effective 2018-05-23). API ToS grant a limited licence "solely to allow for
  the creation of software applications that interface with Giphy" (no explicit commercial grant or ban: commercial_use unknown; a production-key upgrade is required before launch). Docs forbid caching/storing
  responses or media and proxying; ToS forbid building a GIF database/index and commingling results with other providers. Mandatory "Powered By GIPHY" logo plus creator attribution (more than plain credit).
  GIFs and stickers are user/brand/studio content with third-party rights; no rights to the underlying content are granted. verdict.py gives unknown because commercial_use is unconfirmed; the storage ban
  makes it unsuitable for stored data (consider red).'
