  not in that list, so no data licence is claimed. The URLhaus API page (urlhaus.abuse.ch/api) also says
  the free Community API is under fair use and commercial users may need the paid API. Storage, display
  and attribution not addressed. Merged duplicate entry `urlhaus`.'
