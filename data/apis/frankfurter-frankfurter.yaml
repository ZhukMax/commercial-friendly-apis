notes: 'Listed URL frankfurter.app/docs redirects to https://frankfurter.dev/ (v2 API; docs/FAQ at https://frankfurter.dev/,
  terms at https://frankfurter.dev/license/). Code is MIT; rates are public data from central banks (112
  providers in v2, ECB being the original source) and each provider''s own terms apply, so there is no
  single data licence. ECB terms (copyright page): free use if accurate and ECB cited as source; if incorporated
  in documents that are sold, buyers must be told it is free from the ECB site. Other providers (e.g.
  Fed, BoE-type sources, Coin Metrics, IMF) have their own terms linked from the licence page and were
  NOT checked; verdict covers ECB-sourced rates only. FAQ: direct provider endpoints stay subject to provider
  terms, blended rates are Frankfurter''s own calculation. Self-hostable via Docker. No SLA.'
