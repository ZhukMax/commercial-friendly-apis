notes: 'Conflict between pages: api-docs advertises 76 open endpoints usable with no account/key (higher
  limits with keys: Free 100/day, Basic 1,000/day, ...) and no licence or usage terms, while the Terms
  of Service (updated 1 March 2026; read via Playwright because the page is a JS app) list ''Automated
  scraping or data extraction from VantaSpec without permission'' as prohibited conduct. Nothing on commercial
  use, caching or display of API data, so these are ambiguous. Prices/availability are aggregated from
  third-party UK retailers (affiliate-funded comparison site); product names, brands and images belong
  to their owners per ToS, so upstream retailer terms may be stricter. Also: the API contains session/admin
  endpoints that are account-scoped; only the open read endpoints are relevant.'
