notes: Site ToS licence covers "materials" on the website for commercial use if the administrator is notified;
  it lists as prohibited (a) reuse for distribution to third parties, (b) sharing API keys, (c) redistributing
  content without crediting MalShare. Whether showing sample data on a public page counts as distribution
  to third parties is unclear, hence redistribution_display ambiguous. Storage/caching and dataset licence
  not addressed. Data is a malware repository ("not all files are malicious", feeds "as is"; about page).
  Free API key required.
