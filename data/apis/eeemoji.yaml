notes: 'curl/WebFetch hit a Vercel security checkpoint (429); read via a fresh Playwright page (eeemoji.com/api,
  /terms). The API page has a Licence and attribution section: MIT, commercial use fine, credit optional.
  Data are Unicode CLDR-derived emoji metadata (names, keywords, categories, shortcodes; NOT the emoji
  artwork, which belongs to vendors), and the Unicode licence notice reproduced on the API page should
  travel with redistributed data. The general Terms of Service (/terms) forbid copying/redistributing
  the ''service'' and its written content without permission and excessive automated use; the API page''s
  MIT grant is more specific for API data, but the two are not reconciled, hence medium confidence.'
