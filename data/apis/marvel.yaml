notes: 'The live developer portal (developer.marvel.com) now redirects to the marvel.com homepage and
  returns 403 to scripts, so the terms were read from the Internet Archive snapshot (2025-10-08) of developer.marvel.com/terms
  and the attribution page; current live status of the API and terms is unverified (gateway.marvel.com
  returned a generic server error without a key). Under those terms: Apps must be free, no advertising
  or sponsorship, no monetization or commercial purpose unless approved in writing by Marvel -> red for
  an ads/affiliate site. Comic data, covers and characters are Marvel/Disney IP. Mandatory attribution
  text and link.'
