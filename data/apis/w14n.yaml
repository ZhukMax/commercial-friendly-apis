notes: 'Read w14n.dev/terms (updated 2026-10-08), the API discovery index (api.w14n.dev/v1) and the ODbL summary. Datasets are ODbL 1.0 ''partial samples'' of Brazilian open data (companies by CNPJ in agribusiness/mining/meat,
  CNAE establishment counts, municipality coordinates); service/code/docs not covered by ODbL. ODbL: attribution required and share-alike for adapted databases (produced works can be shared under other
  terms, subject to ODbL notices). Free access is revocable; paid plans or keys may be introduced and free access creates no right to continuation. Upstream source of the data (Receita Federal CNPJ open
  data, IBGE) not checked; CNPJ records may include data on sole traders. Only samples, not complete coverage. ODbL summary page used for licence terms (deed, not full legal text).'
