notes: 'Page read: https://apifreaks.com/terms (full ToS). The standard licence only lets you process
  and display API data to individual end users of your application for their own personal use, with no
  end-user storing or distribution and no transfer of the data outside your application. Commercial use,
  storage and redistribution of API data within products are described as an extended Commercial & Distribution
  License available only under a custom enterprise agreement; hence paid-only (enterprise) and storage/redistribution
  ambiguous (standard licence silent on own caching but forbids end-user storage). The hub covers many
  APIs (IP geolocation, WHOIS, DNS, weather, currency, scraping); upstream third-party data licences per
  API (e.g. IP geolocation databases) were not read.'
