  customer displays'' (a fit description, not an explicit display grant), so redistribution_display stays
  unknown. /terms (Terms of Use) only says free API is for lightweight lookup/reporting/spreadsheet use
  and bans bulk scraping/abuse. Nothing on caching or attribution (the embeddable widget carries an FXpeek
  link). Source-linked reference rates; upstream sources not checked.'
