notes: Read /for-agents ('API & AI Agents') and /disclaimer; there is no ToS page (/terms is 404, only Privacy Policy and Disclaimer). Coinlib states its market data (prices, market caps, volumes) is licensed
  from CoinMarketCap and CoinGecko and cannot be redistributed through an API, so it offers no market-data API and disallows those routes in robots.txt; the old 'Crypto Currency Prices' API appears discontinued.
  A remaining /api/v1 covers only Coinlib's own analysis/FAQ/newsroom articles (key, licence and reuse terms for them not stated; not assessed). Upstream CMC/CoinGecko terms apply to the price data. Verdict
  red refers to the price data the listing describes.
