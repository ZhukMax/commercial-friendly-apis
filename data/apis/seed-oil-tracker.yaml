notes: 'Read ai-tool page, Terms of Use & Data Attribution and open-data page (server returned 503 ''busy''
  at first; later reads succeeded). Two tiers: chain-level CSV/JSON open data is CC BY 4.0 (commercial
  reuse fine with credit); the live API/AI-tool responses and item-level data are (c) Seed Oil Tracker
  - bulk copying via API and building a competing database are forbidden, item-level data is non-commercial
  on request. So a commercial site relying on the open-data files is fine, relying on API storage is unclear:
  ambiguous. Values are estimates built from published nutrition data (not medical advice).'
