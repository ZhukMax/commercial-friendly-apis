notes: Read the API landing page, Worldometers disclaimer. The page invites free use in widgets, mobile
  apps and integrations but states no licence, commercial-use, caching or attribution terms. The data
  is sourced from Worldometers (copyright all rights reserved, no reuse licence found), so upstream terms
  may be stricter. Dataflow Kit's general site Terms (a scraping SaaS) was not read in detail and does
  not obviously cover this free API. Example data dated April 2025; coverage may be stale.
