notes: Collins Dictionary API (HarperCollins) is key-gated. API documentation page (WADL-style, 403 to
  curl, read via Playwright) lists endpoints but contains no licence terms; the API licence/terms were
  not accessible. The consumer site Terms (collinsdictionary.com/us/terms-and-conditions) say content
  is "displayed for personal, non-commercial use only" and may not be stored or commercially exploited,
  but those cover the website, not the licensed API, so not transferred. All terms left unknown; commercial
  licence presumably needs to be agreed with HarperCollins (not confirmed by any page).
