notes: 'The wiki API:Main page says any use of the API must comply with ArenaNet''s Content Terms of Use
  and Website Terms of Use; read the Content Terms of Use (updated 28 Oct 2025; the old guildwars2.com
  URL redirects to arena.net) via Playwright. Policy covers fan projects by individuals only (no companies);
  must be non-commercial, with narrow exceptions: passive non-intrusive website ad revenue on fan sites,
  and application sales/limited in-app purchases. It forbids affiliate/commercial business use without
  a separate written agreement, so a commercial site is red. API may not be sold, sublicensed or provided
  to third parties. Game content/artwork is ArenaNet/NCSOFT IP. Storage and display left unknown (not
  explicit). User Agreement not read.'
