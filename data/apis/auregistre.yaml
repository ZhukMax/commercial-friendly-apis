notes: 'Read /api, /cgu and the Licence Ouverte 2.0 PDF. Data is BODACC/Sirene/INPI data under Licence
  Ouverte 2.0 (commercial reuse allowed with attribution). The site''s own CGU forbids mass automated
  extraction of site content (pointing users to the original producers for bulk downloads) and use of
  personal data for canvassing, so storage/caching is ambiguous: normal API use is fine but bulk copying
  of the whole dataset via this API is not. Personal data (officers'' names) has extra restrictions. Share-alike,
  bulk_download and self-host not confirmed (left unset). Licence text quoted from the official Etalab
  GitHub repository (English version of Licence Ouverte 2.0).'
