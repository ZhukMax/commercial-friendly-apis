notes: 'Terms of Use, API docs and API recommended-practices pages read via Playwright (curl is blocked
  with 403). API use is subject to the Terms of Use; the API is for application development, not data
  scraping (bulk via exports or the GBIF dataset). The Terms do not give a blanket data licence: contributed
  content defaults to CC BY-NC unless the contributor chooses otherwise, and photos on static.inaturalist.org
  have no open licence, so a commercial site must filter per record by licence. Terms also prohibit using
  data for commercial AI training. Caching/storage not addressed.'
