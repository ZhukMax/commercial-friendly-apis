notes: Read full Terms & Conditions (section 5). Basic is internal use only; Standard/Advanced allow commercial
  products showing "something of your own built from" the data; showing the price data itself to users
  (e.g. prices on a website) needs the Enterprise distribution licence. Storage is in-memory only except
  on Enterprise. So a price-display site needs Enterprise (contact sales) = ambiguous/yellow. Prices are
  broker mid-market prices derived from exchange-traded futures (ICE, NYMEX), not exchange feeds; no exchange
  redistribution licence is stated.
