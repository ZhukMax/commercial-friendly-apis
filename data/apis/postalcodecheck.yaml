notes: 'Pages read: API page, Terms of Use, About & Data Sources. API page says free for personal and
  commercial use; terms ask users to cache and not to resell the free keyless API or rotate IPs. Data
  is the GeoNames postal dataset (CC BY 4.0, stated on About page and in each response "source" field);
  CC BY deed cited for copy/display only together with that statement. The API says attribution is "appreciated"
  (not mandatory) but CC BY itself requires credit to GeoNames, hence ambiguous. Responses are marked
  cacheable for 24 h; no storage limit stated. Higher volumes need an IPNOVA API key (separate portal
  terms, not read; paid plans from $19/mo with a commercial licence).'
