notes: 'Read the API Developers Guide intro, the FTP bulk-download page and the v5 page (guides.rescuegroups.org), plus rescuegroups.org/terms-of-service (that ToS is for shelters that upload data, not
  API consumers; it grants RescueGroups a licence to shelter-uploaded data and pictures). No page read states whether commercial use of the API data is permitted, so commercial_use stays unknown and verdict
  unknown. Auth fixed: an API key is required (request form). FTP download is announced to be discontinued in 2026. Data and pictures are owned by the individual shelters/rescues; no licence from them to
  API users was found. Test-environment data may not be used in production. Entry url redirects to the support-guides home; the API guide lives at the share linked in api_terms_url.'
