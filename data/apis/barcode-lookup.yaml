notes: 'Product page says the dataset is a self-hosted copy of Open Food Facts (and sibling Open Facts
  databases) under ODbL 1.0: attribution required, share-alike for database derivatives (this is upstream''s
  licence, whose text I did not open). The host''s own short Terms of Service (dataandapis.com/terms-of-service,
  21 Nov 2026) forbid ''unauthorized commercial purposes'' and ''copying or distributing any part of the
  Services'' without defining them, so commercial use, storage and display conflict with ODbL''s permissions
  and are ambiguous. Product images come from Open Food Facts and may carry separate (CC BY-SA) terms,
  not checked. Entry is one API among a 125+ API marketplace.'
