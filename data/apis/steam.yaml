notes: The entry URL (steamapi.xpaw.me) is a community documentation site by xPaw for Valve's Steam Web
  API; terms are Valve's Steam Web API Terms of Use (last updated July 2010), which I read at steamcommunity.com/dev/apiterms.
  The licence lets you present Steam Data to end users for their personal use via a registered Application,
  with an API key personal to you; user data may only be retrieved as requested by the user and stored
  with notice; 100,000 calls/day; Valve brand and links (no nofollow) required; terms also point to the
  Steam Subscriber Agreement and Web API documentation (not read). Commercial use is neither granted nor
  forbidden, hence ambiguous. Game metadata/artwork belongs to publishers and developers; the API grants
  no rights to it.
