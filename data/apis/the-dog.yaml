notes: Read the API Terms of Service (effective 2023-07-01) at thedogapi.com/terms; redirect from thedogapi.com to www.thedogapi.com/en only. Monetisation with ads is explicitly allowed (free tier). Free
  tier requires a prominent disclosure that the app uses The Dog API (store description and in-app intro/about page); waived on paid account. Must not resell the service or use the API logo. Terms say nothing
  on caching/storage or display of the data, so those stay unknown. Images are contributed by users and breed data by others; the terms grant no rights in the underlying images (third-party rights not addressed;
  a separate 'Data Licensing' page was not read). Section 6 concerns images you upload to the API, not consumers.
