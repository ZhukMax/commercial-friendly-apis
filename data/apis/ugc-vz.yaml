notes: 'Read the AGB (https://ugc-vz.de/agb, German), section 10 ''Maschinelle Nutzung (API, MCP und KI-Agenten)'': no key needed, using the interface means accepting the AGB; contact data returned after
  a request may be used only for that request (no databases, no passing on); systematic copying or reuse of substantial parts of the directory is prohibited, as is building a competing directory. Free for
  brands. A commercial site that stores or displays creator profiles/contact data is therefore out of scope (red); doubt: showing a few individual profiles or linking to them is not clearly forbidden. Creator
  profiles are personal data (DSGVO). commercial_use not stated, left unknown.'
