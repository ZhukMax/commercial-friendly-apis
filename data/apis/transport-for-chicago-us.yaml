notes: Read Developer License Agreement & Terms of Use (limited, revocable licence). Licence is limited
  to the purpose of assisting transit riders or promoting public transport; any other purpose needs CTA
  permission, and the agreement does not say whether ads/affiliate monetisation is allowed, so commercial_use
  is ambiguous (a general ad/affiliate site that is not rider-focused is likely outside the licence).
  Cannot sell data separately from the application; no implying CTA endorsement; trademark guidelines
  apply. Data must be deleted on termination. Requires API key (Bus/Train Tracker).
