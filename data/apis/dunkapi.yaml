notes: 'Read the DunkAPI Terms of Service (section 7 Acceptable use, section 9 Data sources). Commercial
  apps/websites allowed; showing data to own end users, storing and deriving values allowed; forbidden:
  reselling or redistributing data as a standalone product, feed, file, dataset or API, and redistributing
  raw odds/lines/prices as a bulk feed because third-party sources limit their use. ''Some sources limit
  how their data may be used; you agree to pass those limits on to your own users'': upstream/sportsbook
  terms may be stricter and the service tells users when they apply. Do not imply league endorsement;
  logos and marks not licensed. No general attribution duty found except crediting nflverse if its data
  is republished. Sister service of DunkAPI/FastballAPI/NoPunt (same operator template). NBA/WNBA/college
  basketball.'
