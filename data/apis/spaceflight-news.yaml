notes: 'No terms on spaceflightnewsapi.net itself (docs site/OpenAPI say only that the API is free to
  use). Terms found in The Space Devs FAQ on GitHub (Terms of use section), which state they apply to
  the Launch Library 2 API and the Spaceflight News API: free use in any way, attribution optional, forward
  only with added value. SNAPI FAQ: free for everyone, a commercial project is only asked to consider
  donating. Caching: the FAQ heavily encourages caching on your side (written for TSD APIs generally).
  Caveat: the data are titles, summaries, links and images of articles aggregated from 35+ third-party
  news sites (NASA, NYT, Reuters, WSJ etc.), whose own copyright/terms are upstream and may be stricter;
  informal GitHub FAQ rather than a formal ToS, so confidence is medium. Pages read: the SNAPI FAQ, TSD
  FAQ, GitHub README, OpenAPI info.'
