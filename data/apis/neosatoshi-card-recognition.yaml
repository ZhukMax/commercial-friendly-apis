notes: 'Read https://neosatoshi.com/termsofuse (incl. ''API terms'' section) and the API docs page. The
  API recognises cards from the user''s own photos and is account/credit based, so it is a tool rather
  than a general data source (applicable: false). Purpose clause limits use to recognising, pricing and
  listing cards you own/sell or handle for customers; catalog copying, bulk reading, ML training and passing
  images on as a collection are forbidden; stored prices/images must be refreshed or deleted within 30
  days. Commercial use for sellers looks intended but the terms do not state it generally for ad/affiliate
  sites, so commercial_use left unknown. Card data and artwork belong to rights holders (The Pokemon Company,
  Wizards of the Coast, Konami etc.); the API grants no rights to them, and some data comes from third
  parties (Cardmarket, TCGplayer, Scryfall, Yugipedia CC BY-SA) whose terms apply in addition.'
