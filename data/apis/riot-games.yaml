notes: Read Riot Games API Terms & Conditions (dated 2013-12-09) and the General Policies page (Core Policies,
  Product Registration, Monetization). Monetization is allowed for registered products with Approved/Acknowledged
  status; a free tier (may include ads) is required; no betting/gambling; charging requires transformative
  content; no ads inside Riot properties. A mandatory unofficial-product disclaimer must be shown. Storage/caching
  is not addressed on these pages (data ingestion must use supported services) -> unknown. Game information,
  art and marks remain Riot IP (separate Data Dragon/press-kit asset rules). Affiliate links are not mentioned.
  Per-game policy pages (LoL, TFT, VALORANT, LoR) were not read.
