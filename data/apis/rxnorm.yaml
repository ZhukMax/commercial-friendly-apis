notes: 'Terms of Service of NLM''s RxNav read. RxNorm/RxTerms/Prescribable RxNorm APIs are free, no licence
  needed; the ''one exception'' is RxClass, which includes SNOMED CT (needs UMLS/SNOMED affiliate licence).
  The terms do not mention commercial use explicitly (no restriction found; apps invited) and do not set
  a storage rule: NLM only recommends 12-24 h caching to reduce load, and offers RxNav-in-a-Box for local
  copies, so storage is ambiguous. The attribution statement is requested (''We request''), shown as yes.
  Developers may not use the NLM name/logo. Medical disclaimer applies. Site will be renamed ''RxNorm
  Tools'' in 2027.'
