notes: 'IPstack is now part of APILayer (Idera). Pricing page lists "Commercial Use" as not included on the Free plan (100 requests/month) and included on paid plans; the FAQ says the free plan is for testing
  on a non-production site. Read the APILayer Master SaaS Subscription Agreement (6-page PDF via ideracorp.com/legal/APILayer, two-column, skimmed with pdftotext): it says Freeware is provided for testing
  only and a commercial subscription brings the full agreement; I found no explicit clause on caching/storage or on displaying results to end users, so storage_caching and redistribution_display stay unknown.
  Free plan returns location fields only.'
