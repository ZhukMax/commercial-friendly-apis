notes: 'Read home page, API docs and the ''Privacy and terms'' page (short terms paragraph at the end).
  The service is free with no key and no non-commercial clause, but says nothing explicit about commercial
  use or storing results, and states that logos/icons are not licensed to the user: use only as trademark
  law allows (e.g. to refer to a company or product). So commercial use and display depend on the rights
  of each icon''s owner; the service only fetches and resizes. Docs say results are cached at the edge
  for 1 day and recommend nothing on local storage. Sources: the site''s own icon tags/manifest, Wikidata
  and Wikimedia Commons for name lookups (their licences not checked).'
