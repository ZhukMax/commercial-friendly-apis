notes: 'Estonian Data Portal (andmed.eesti.ee) is a catalogue of datasets from many publishers: each dataset
  carries its own ''use licence'' field (if set), so terms vary per dataset. The RIA help centre says
  open data is generally given for reuse without conditions/licence and that CC licences are recommended,
  but that is guidance to publishers, not a portal-wide grant. The old API-instructions URL now shows
  a ''page not found'' in the portal; the portal is a JS app (read via Playwright and the abi.ria.ee help
  centre). Whether the portal API needs a key for reading was not verified.'
