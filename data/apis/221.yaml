notes: 'Read /conditions-utilisation (updated 2026-11-14, French; sections 5, 8, 10), /sources and docs
  home. API/data access is free; reuse is governed per dataset. Only the ANSD geography set is CC BY 4.0;
  jours feries, operator prefixes, banks, transport, institutions, health, etc. are ''données publiques,
  licence non précisée'' and 221 states it cannot relicense them, so commercial use, caching and redisplay
  are ambiguous per dataset (verdict yellow, not usable as a blanket green). Also: do not present data
  as official/certified by 221; personal data in sources makes the reuser a controller (Senegal law 2008-12;
  no re-identification or unsolicited prospecting); extraction beyond quotas and resale of API access/keys
  prohibited. Operator Orvene Labs also runs a payments product (221 Pay), whose terms are irrelevant
  here.'
