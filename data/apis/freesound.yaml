notes: Read https://freesound.org/docs/api/terms_of_use.html and the full API terms https://freesound.org/help/tos_api/.
  Free API access is for non-commercial purposes; commercial API use is negotiated case by case (price
  not stated, 'We may charge'), so ambiguous rather than paid-only. Each sound has its own Creative Commons
  licence from the uploader, so whether a given sound can be used commercially depends on that licence
  (CC BY-NC sounds cannot). The API must not be used to replicate Freesound or make full copies of the
  database.
