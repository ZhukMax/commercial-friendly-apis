notes: 'Read the Terms of Use (2025-07-01), the API guide and the pricing page. Free tier: "development
  projects" only, no app-store publishing; paid tiers (EUR 8 / EUR 20 per month) may develop "apps and
  services". The word commercial is never used, so commercial_use is ambiguous (not paid-only). Content
  may be copied/stored via official endpoints; reselling the API is forbidden; third-party content needs
  the owner''s permission; most artwork is user-created fan art with unclear rights and only some is flagged
  CC (strCreativeCommons), and artist/album/track metadata concerns third-party music rights. Display/redistribution
  not explicit: unknown.'
