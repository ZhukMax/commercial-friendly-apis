notes: 'Read the user agreement (Chinese, effective 2026-11-01) and the data-docs page. Section 6.2: no
  copying, republishing, selling or commercial use of service content without written permission; only
  personal non-commercial quotation with credit. 4.1 forbids bulk scraping/mirroring. The API docs (data-docs)
  describe a points-billed data API and even suggest local caching with TTLs, which conflicts with the
  agreement''s copy ban, so storage_caching=ambiguous; the agreement does not carve out API data for commercial
  use. Match data comes from third-party public sources (6.4); upstream rights remain with original owners.
  Service is football analytics tied to Chinese lottery products (no betting advice).'
