notes: 'Read /en/open-data and /en/terms. Data page: scores/ranks CC BY 4.0 with credit, crosswalk CC0,
  and bulk CSV/NDJSON downloads offered. The Terms page, however, says bulk copying of the dataset is
  not permitted and scores may be quoted with a link back: conflicts with the CC BY bulk files, so storage_caching
  is ambiguous. Averages from individual rating sources (Open Library, Google Books, Hardcover, Wikipedia)
  fall under those sources'' terms (upstream may be stricter); titles, covers and descriptions belong
  to rights holders. Site uses Amazon affiliate links itself.'
