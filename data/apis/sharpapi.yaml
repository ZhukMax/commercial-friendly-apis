notes: 'Read the Terms of Service (updated 2026-10-25). Allowed: displaying odds inside your own app to
  your end users (also side by side from several books) with an active subscription; this applies by usage,
  not industry. Forbidden: reselling/redistributing raw data, offering multi-sportsbook odds comparison
  as a product in its own right (comparison grid is what users come for) without a separate agreement,
  competing aggregation. Stored data is for internal use; showing stored data to end users as feed/export/archive
  needs a separate agreement. Credit ''Data provided by SharpAPI'' mandatory from 2026-12-01. Free plan
  exists; the terms do not clearly say whether the Free plan counts as an ''appropriate tier'' for end-user
  display, so commercial_use_scope any is an assumption of the text, check the plan. Odds data originates
  from third-party sportsbooks: upstream terms may be stricter. A pure odds-comparison site is likely
  excluded.'
