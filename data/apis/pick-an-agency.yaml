notes: 'Read the developer page (https://www.pickanagency.com/developers) and site Terms (https://www.pickanagency.com/terms,
  Mar 2026). API data licensed CC BY 4.0 with link-back; CC deed says commercial use allowed. Caching
  is encouraged; no retention limit stated, but bulk data needs a request by email and the site ToS bans
  scraping beyond normal use. share_alike=no: CC BY is not share-alike (deed read). Doubt: directory listings
  include information sourced from public data, user submissions and third-party platforms (per ToS) and
  client reviews, so upstream/third-party rights (review text, logos belong to owners) may be stricter;
  whether the CC BY claim covers review text was not verified.'
