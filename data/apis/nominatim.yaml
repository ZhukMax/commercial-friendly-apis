notes: 'Public instance policy does not forbid commercial use (no commercial ban found) but gives no SLA: heavy use is withdrawn at OSMF discretion, bulk geocoding discouraged, periodic app requests count
  as bulk. Caching is required. Underlying OSM data is ODbL: attribution plus share-alike. Storing geocoding results in your own database may create a derivative database subject to ODbL share-alike; a
  single produced result shown on a page is generally a Produced Work (attribution only), but this is a legal question - not verified. Self-hosting Nominatim removes usage limits but ODbL still applies.
  Yellow due to share-alike and revocable access.'
