notes: 'Stock-video marketplace: the keyless API only searches clip metadata; clips are bought at about
  $2 each (API page) or via a subscription, under a limited non-transferable licence for the buyer''s
  own marketing, advertising and content use. Terms (/terms, read via Playwright/curl) forbid reselling,
  redistributing, scraping or bulk-collecting clips and building a competing library, so a catalogue/aggregation
  site is not covered; whether showing search previews on a third-party page is allowed is not stated
  (ambiguous). Clips are creator-owned third-party content. Not a data source for storing/showing on own
  pages; yellow at best. Terms page also bans use for certain categories (gambling, adult, etc.). Public
  API rate limit stated on https://ugcdrop.com/api: 60 requests a minute per IP.'
