notes: Read /terms (updated 2026-10-31), /docs/api and the credits link. The service is described as a
  free non-commercial catalog; descriptions may be reused only non-commercially (commercial reuse not
  permitted because of upstream source terms), and any commercial product needs prior contact. Bulk download,
  mirroring and republishing the catalog or artwork are forbidden. Box art, screenshots and logos belong
  to their owners and the terms grant no rights in them. The API page mentions a 'Pro' tier (unmetered)
  but nothing states it permits commercial use. Verdict red for commercial site; could change if the project
  grants a commercial licence.
