notes: 'Read /licenses, /api-developers and the Terms of Service header (full ToS 58k chars not read in
  detail). Free licence (account needed): CC BY-ND 4.0 modified to allow commercial use, credit required,
  new downloads limited to the account duration, 1M CDN requests for embed. PRO licences are paid (no
  credit needed; 2.4 forbids reselling icons as standalone files or using them as the core of an icon
  library). Because ND forbids derivatives, recolouring/customising may need PRO or only the in-product
  customisation. The API (/api-developers) is for apps offering icon pickers; access needs an account/project
  (demo mode, then project verification for full access) so upstream auth ''none'' is probably stale (docs
  pages are JS-rendered and were not read, so not changed). The evidence for redistribution_display is
  only the free licence''s CC BY-ND base (sharing allowed with credit); the API terms for displaying icons
  to your own users were not read in detail.'
