notes: Read the EMBL-EBI Terms of Use (revised 14 Oct 2026); the ENA-specific /about and /policies pages
  are JS shells and returned nothing. EMBL-EBI adds no restriction beyond the original data owners; it
  does not mention 'commercial' explicitly, so commercial_use=yes is inferred from 'no additional restrictions
  on use' (medium confidence). Submitted sequences may carry third-party rights (patent, copyright, Access
  and Benefit Sharing), and human/controlled-access data have separate rules. Specific resources may override
  these terms. Attribution is 'expected', soft requirement.
