notes: Read API docs (api.artic.edu/docs) and the museum Terms page. Terms say 'certain' data/images are
  CC0 and you may use those labelled 'CC0 Public Domain Designation' or otherwise stated as CC0 commercially;
  the rest of site Materials is noncommercial/fair-use only. The API docs defer to the Terms and Image
  Licensing pages and recommend using only images of artworks tagged is_public_domain (images are served
  via a separate IIIF server; non-public-domain images, copyrighted artworks and descriptive texts may
  be restricted). Treat as green for API metadata/public-domain images only. Docs ask scrapers to stay
  at <=1 request/second and use weekly data dumps (github art-institute-of-chicago/api-data) for bulk.
