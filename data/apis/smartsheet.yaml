notes: 'Not an open data source: the API reads/writes a customer''s own Smartsheet account data (OAuth
  or access token), so the ''data'' are the user''s own content. Read the Developer Program Agreement
  (https://www.smartsheet.com/legal/developer-program-agreement). A developer may charge end users for
  an approved Developer Application, but may not commercially sell or redistribute Smartsheet Properties
  (which include Smartsheet data), and the application needs Smartsheet''s written approval before distribution
  to end users. The agreement does not address caching/storage duration or public display of data; end-user
  content must be handled per privacy law. commercial_use ambiguous; other core fields unknown. Only the
  Developer Program Agreement and its section titles were read, not the general user agreement or the
  API limits policy.'
