notes: Read the Wargaming API Terms of Use and the API Policy on one page (developers.wargaming.net/documentation/rules/).
  Licence is for "publicly available Applications"; permanent copies of API Data are forbidden; commercial
  distribution/exploitation of API Data needs prior written consent; the API Data may contain third-party
  IP (game content is Wargaming property). Policy allows advertising in a free app (ads for unrelated
  goods need agreement) and bans ads in paid apps; data obtained under the programme must not be given
  to search engines or advertising networks. Hence commercial_use=ambiguous (ads allowed, exploitation
  of data restricted) and verdict forced to red because storage is forbidden. Needs an application_id
  key (free, account required).
