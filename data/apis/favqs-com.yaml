notes: 'Read FavQs API Terms of Service (revised 2026-11-06) and the general Terms. Apps and sites showing
  quotes are allowed with author credit and a link to the quote page on FavQs; cache max 24 hours; no
  republishing of the collection, no AI training datasets, no replacing FavQs, no storing users favorites
  outside FavQs, no reselling API access; portraits only with the author quotes and not stored on own
  servers. Fees: API is free today, FavQs may charge for heavy or commercial use later; commercial use
  is not forbidden but the clause makes the status ambiguous. Quotes are submitted by users and FavQs
  says it cannot give rights in them. Most endpoints need an API key.'
