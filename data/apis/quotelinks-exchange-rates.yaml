  own policy, but the Quotelinks API does not pass that on, so use the ECB feed directly for commercial
  sites (Frankfurter-compatible alternatives exist). Display in non-commercial projects is allowed with
  credit (hence ambiguous, not no). Caching is requested for fair use but storage rules are not stated.'
