notes: 'Read the Luchtmeetnet open-data page (Dutch; also read via the Postman API docs, which point to
  it) and the CC BY-ND 4.0 deed. Data is CC BY-ND: commercial use and verbatim sharing allowed with source
  credit, but NoDerivatives forbids adapted/transformed versions, so storage/processing is ambiguous (yellow).
  The page also says availability is not guaranteed, data are unvalidated hourly values and a fair use
  policy applies. Quotes from the open-data page are in Dutch; pages are JS-rendered (read via Playwright).'
