notes: 'Read Google Maps Platform Terms (3.2.3: no scraping/pre-fetch/store/rehost, no caching except
  as allowed) and Maps Service Specific Terms (per-API caching, e.g. 30 days for lat/lng, no use with
  a non-Google map). The terms are a paid commercial contract (billing account, pay-as-you-go/subscription)
  and contain no non-commercial restriction, hence commercial_use yes (no single explicit ''commercial
  use allowed'' sentence; evidence is the Customer Application definition). Results generally may only
  be shown on a Google map; many API-specific rules exist.'
