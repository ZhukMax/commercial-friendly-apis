notes: 'Read /data-api/license (API licence), /terms and /data-api. Licence says free tier is ''With attribution''
  for anyone (last 30 days, 1,000 rows/day); Developer key (.99/mo) for individuals/companies under $1M
  revenue inside own app; investment firms managing outside money need a licence. Showing rows in own
  product with attribution is allowed; redistribution/resale of the served corpus is not; bulk/full archive
  only under signed licence. Caching/storage of rows is not addressed (history windows are limited), so
  ambiguous. Congressional amounts are ranges: do not present midpoints as exact amounts or infer motive.
  The main ToS clause banning redistribution refers to the website; it points to the API licence for API
  data. Upstream auth said none; keyless free tier exists, key optional.'
