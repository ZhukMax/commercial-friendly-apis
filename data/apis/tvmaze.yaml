notes: 'Data licence CC BY-SA (link on the API page points to by-sa/4.0): commercial use allowed, but share-alike means derivative
  datasets must be shared under the same licence, so yellow. Storage: the page recommends caching images locally and the licence
  permits copying; no explicit cap on text data. Rights caveat: show posters, descriptions and cast photos can carry third-party
  studio rights; TVmaze''s copyright policy says it only accepts facts, press material, CC-licensed or user-created content
  (https://www.tvmaze.com/site/copyright) but the API licence grants no rights beyond TVmaze''s own. A paid Enterprise API
  exists for other needs. Site is reachable over HTTPS although the catalogued URL is http. Pages read: /api, /site/tos, /site/copyright.'
