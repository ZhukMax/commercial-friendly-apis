notes: 'Pages read (Portuguese, via Playwright for the portal home and curl for FAQ and open-data pages): Programa Queimadas FAQ and Dados Abertos page. The FAQ says all data and products are freely accessible
  at no cost and asks that INPE data be cited per ABNT NBR 6023 (attribution, shown as a citation format). No licence (CC BY etc.), commercial-use, caching or redistribution statement found, so those fields
  stay unknown. Data is downloadable as CSV/KML/GPKG/TIFF and OGC WMS/WFS geoservices (bulk_download yes). Fire-hotspot data partly derives from NASA satellites (not assessed). Free access quote: "Todos
  os dados e produtos ficam disponíveis para acesso livre sem nenhum custo após sua geração" (FAQ).'
