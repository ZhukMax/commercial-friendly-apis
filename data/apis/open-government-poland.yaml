notes: 'Page is JS-rendered; read via Playwright (Regulations, https://dane.gov.pl/en/regulations, Section
  5). Portal regulations allow commercial and non-commercial use of Information Resources. Providers may
  attach per-dataset reuse conditions (source attribution, informing about processing, liability scope,
  personal data, database/work rights); where none is set the portal shows that the dataset can be reused
  without limitation. So the verdict holds only for datasets without extra conditions: check each dataset.
  API docs at api.dane.gov.pl/doc (page is a JS Swagger shell); no API-specific terms or rate limits read.
  Homepage banner also says: use public data free of charge, also for commercial purposes.'
