notes: 'Read developers, licensing and terms pages with Playwright (curl returns 403). Free API key (required):
  personal, journalistic, academic and civic use only, with visible attribution. Commercial products need
  the Indie ($99 CAD/mo, one product under $100k revenue, ''no redistribution'') or Business ($499/mo,
  bulk CSV, SLA) licence; Enterprise adds a redistribution licence. Caching/storage terms of the paid
  licence are not public. Terms page says ERstat aggregates public wait-time data from provincial health
  authorities and hospital systems, so upstream terms may apply; and ERstat also generates model predictions.
  Rights for display in paid tiers likely yes but unconfirmed, left unknown.'
