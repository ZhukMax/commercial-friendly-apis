notes: Free API tier is non-commercial with attribution; pricing page lists "Commercial use" from the
  Developer plan ($29/mo) up, so paid-only. Terms forbid resale, sublicensing, bulk redistribution and
  substitute data feeds; cached responses expire after 7 days. Compiled dataset (selection, derived fields,
  grades, narratives) is proprietary; three datasets (DTC, SGO crash reports, quarterly reports) are CC
  BY 4.0. Underlying EPA/NHTSA records are public domain; manufacturer press-kit figures are transcribed
  from official documents (rights not assessed). Whether attribution is needed on paid plans is unclear
  (ambiguous).
