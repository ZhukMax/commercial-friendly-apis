notes: Read Slack API Terms of Service (slack.com/terms-of-service/api). The API only serves workspace
  data to installed apps, so it is not a data source for a public commercial site. Commercial Distribution
  (any app where users could pay, incl. freemium or a free app tied to a paid product) needs a Marketplace
  listing or separate Salesforce/Slack agreement, hence ambiguous. The same page also forbids selling,
  renting, redistributing or syndicating access to the APIs. Data licence and attribution not stated on
  that page.
