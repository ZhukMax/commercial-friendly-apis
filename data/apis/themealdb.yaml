notes: 'Read https://www.themealdb.com/terms_of_use.php (terms) and the API docs page. Free API = development/educational test key ''1''; production/public release requires a paid (one-off lifetime) key;
  paid terms permit apps and services within rate limit. Reselling the API is forbidden. Data and artwork are crowd-sourced by users (artwork may carry its own CC tag; third-party content not allowed without
  owner permission), so no single data licence is stated. The page text is shared by TheMealDB/TheCocktailDB (this copy even says ''TheMealDB''). Website scraping is forbidden; only official endpoints.
  Doubt: whether a free-key ad-supported website counts as ''publishing'' is not spelled out; paid-only is the conservative reading.'
