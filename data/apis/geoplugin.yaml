notes: 'Read /aup (Acceptable Use Policy; the only terms page, /terms is 404) and /pricing. Free use is
  described as a "free webmaster resource" within "normal use"; commercial use is neither allowed nor
  forbidden explicitly, so ambiguous. Data derives from MaxMind GeoLite and the AUP says use is under
  CC BY-SA 3.0 (share-alike flows to users). Caching/storage and display not addressed: unknown. Paid
  plans (Basic $10/mo, 100 req/day up to Enterprise) exist but plan terms say nothing different about
  commercial rights.'
