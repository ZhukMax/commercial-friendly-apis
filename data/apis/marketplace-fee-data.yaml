notes: 'Dataset licence is CC BY 4.0 stated on the data page and in each JSON file (license + attribution
  fields); CC BY 4.0 deed read for storage/display. The values are marketplace fee schedules compiled
  by SellersCalc from each platform''s published fee pages (officialSource link per platform); the underlying
  marketplaces'' own terms were not checked, and the site says rates are typical US rates, estimates only,
  revised without notice. SellersCalc /terms covers calculators (''free for personal and commercial use''),
  not the data licence. Small single-site dataset, not a general data API. share_alike=no: CC BY, not
  SA.'
