  guidance, no recommendation to buy), keeping vendor/affiliate links unchanged and showing affiliate
  disclosure, and forbid redistributing bulk copies as your own dataset or building a competing price
  dataset. Caching limited to 24h (research) and 1h (prices). Research/study endpoints need no key; vendor,
  product and price endpoints need a key. Vendor price data comes from third-party vendor sites.
