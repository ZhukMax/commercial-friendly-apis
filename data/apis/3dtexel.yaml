notes: Read /developers (public read-only search API, no key), /asset-license (version of 16 Oct 2026)
  and /terms. The licence terms cited apply to the free handmade CC0 library only. The same API also lists
  AI-generated/premium/community assets under the 3DTexel License (commercial use in finished projects
  allowed, but no resale/redistribution of the files as assets), so the license field per asset must be
  checked; the green verdict applies to the CC0 assets. The API returns metadata and links; terms of the
  Terms page do not address metadata caching specifically. Other API endpoints need an account key and
  credits (not assessed).
