  data as your own without permission and scraping beyond the API, and say underlying Roblox data belongs
  to Roblox and creators. So commercial use is ambiguous (CC BY CSV vs personal licence for the rest);
  caching and display not addressed beyond that. Fields like estimated revenue are model estimates. Not
  affiliated with Roblox.
