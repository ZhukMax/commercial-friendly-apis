  unknown, verdict unknown). Pricing page: Pro ''No attribution required'', so attribution applies on
  the Free plan. Aggregator: /sources lists per-institution credit lines and licences (ECB; Chile BDE;
  Kazakhstan; Ukraine CC BY; Colombia CC BY-SA; Peru; Fed public domain; Malaysia; CNB; US Treasury; INE
  Chile CC BY-SA, share-alike for the CLF rate). Equity data carries no market-data licence from exchanges
  (ToS 1c); crypto/metals from third-party market data. Upstream terms may be stricter than shown.'
