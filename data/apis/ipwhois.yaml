notes: The documentation pricing blurb says "Commercial use allowed" for both the free and Pro endpoints.
  The Terms of Service (updated May 21, 2026) grant a licence for "personal or internal business purposes"
  and forbid copying, reselling, sublicensing or redistributing the materials or services, and mirroring
  them on other platforms, without written permission. It is unclear whether showing looked-up geolocation
  on public pages to visitors counts as redistribution, so redistribution_display is ambiguous. Caching/storage
  and attribution are not addressed. Data sources are public registries (RIPE, APNIC, ARIN, AFRINIC) and
  unnamed third-party providers; no data licence stated.
