notes: 'Portal is ArcGIS Hub (JS-rendered). Pages read: City Open Data Policy page (linked from portal
  footer as "Open Data Policy"), CC0 deed, and the portal DCAT-US feed (/api/feed/dcat-us/1.1.json, 285
  datasets). Portal footer links the CC0 licence and the home page says datasets are "shared free of charge
  and with minimal licensing" (that markup sits inside the page JSON config, not verifiable as plain text).
  DCAT licence field: 238 datasets CC0, 10 CC BY-SA 4.0 (e.g. Assessors Parcel Data 2020, Future LandUse,
  Commercial Corridors), ~30 blank, ~5 custom GIS disclaimer text (reference use only, no warranty). Per-dataset
  licences differ, so check each dataset before use; share-alike applies to the BY-SA ones. Cities are
  not required to give attribution under CC0.'
