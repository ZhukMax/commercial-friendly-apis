notes: 'Read data.gov.ro Terms (termeni.html: only a disclaimer of liability, no reuse terms) and the
  ''Licența deschisă'' page. The portal does not impose one licence: each dataset must carry an open licence;
  CC BY 4.0 is recommended and the OGL ROU 1.0 licence is integrated. Law 179/2022 art. 11 says reuse
  is not subject to conditions unless objective and proportionate. No explicit statement on commercial
  use, caching or display at portal level, so commercial_use is ambiguous and the rest unknown; check
  each dataset''s licence. API terms/rate limits not stated (CKAN API).'
