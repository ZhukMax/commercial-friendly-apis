notes: Developer Policy (https://developer.spotify.com/policy; old beta URL redirects to developer.spotify.com/documentation/web-api).
  A non-streaming app (metadata display) may sell advertising and e-commerce; streaming apps may not monetise.
  Metadata/cover art must not be offered as a standalone product and must link back to Spotify. Policy
  bans using Spotify Content to train ML/AI models. Policy does not address storing/caching Spotify Content
  (only user personal data), so storage_caching unknown; the separate Developer Terms of Service and quota
  rules (development mode limits, extended-quota review) were not read. Spotify requires per-app approval
  for larger audiences; treat as a restricted, not open, data source.
