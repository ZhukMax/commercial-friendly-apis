notes: 'Read https://tastedive.com/read/api (legacy API docs; page says TasteDive joined Qloo and the
  legacy API is supported until migration), the TasteDive Developer API Terms of Use (https://tastedive.com/read/api-terms,
  1.27.2025) and the site ToS (/read/terms). Pages are Cloudflare-protected for curl, read with Playwright.
  API Terms: access licence is "solely for the purpose of integrating TasteDive functionality into your
  application, website, or service" (no explicit commercial grant or ban, so commercial_use unknown),
  caching beyond real-time processing is prohibited (storage=no), and redistribution/modification is barred
  only for competing purposes (ambiguous). Terms also forbid building a competing service. Recommendations
  name movies, music, games, books (third-party titles; no rights to underlying media). verdict.py gives
  unknown because commercial_use is unconfirmed, but the caching ban alone makes this a poor fit for storing
  results: consider red.'
