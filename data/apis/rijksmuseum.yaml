notes: 'Read the data services home, docs, Information and Data Policy (intro page; the full policy PDF
  was not read). The old apiKey API has been replaced by the new data services (Search API, OAI-PMH, LDES,
  Linked Data resolver, data dumps), which need no key (Search API docs: ''No API key is needed''), so
  auth changed to none. Licence is per object: most data/images are Public Domain/CC0, some are CC BY
  4.0 (credit required), and the collection site also contains photographs still under copyright that
  are not freely available (copyright holder is shown). Per-object copyright notice must be checked before
  storing/displaying images; hence confidence medium and attribution ambiguous.'
