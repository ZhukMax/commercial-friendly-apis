notes: Read Disqus Terms of Service (help.disqus.com article 1717102), section "Feeds and API", and the
  Publisher Terms of Service. The API is part of the Service; it may not be used to display any portion
  of the Disqus database or copy the service, and the Publisher terms ban harvesting/reading data in bulk
  or passing the API through to third parties. The clause is aimed at mirroring the service, but it is
  wide enough that display of API output on other sites is ambiguous. No explicit statement on commercial
  use, caching or attribution, so those stay unknown.
