notes: 'Read https://www.flickr.com/services/api/tos/ (redirects to /help/terms/api) via Playwright; curl
  returns an error page. An ad-supported site that uses Flickr photos is explicitly a commercial application
  and needs a commercial API key (application form; SmugMug may charge fees, so commercial_use is ambiguous
  rather than paid-only, and no page read says that paid plans permit it). Photos belong to the photographers:
  commercial use is only allowed for photos carrying a Creative Commons licence that permits it, plus
  that licence conditions (attribution etc.); all-rights-reserved photos cannot be used. Other limits:
  max 30 photos per page, no caching beyond reasonable periods, remove content within 24 hours on owner
  request, no replicating Flickr, mandatory disclaimer notice, no use of the Flickr logo without permission,
  privacy/ad disclosure in footer. Auth listed as OAuth; the API terms do not cover this detail.'
