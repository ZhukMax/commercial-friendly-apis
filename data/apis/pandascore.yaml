notes: 'Read PandaScore T&Cs (pandascore.co/terms-and-condition, Articles 2 and 6) and developers.pandascore.co/docs/introduction
  (Fixtures plan free). Proprietary database licence, not open: data may be reproduced only on the customer''s
  own website for information purposes, excluding "marketing of said data"; raw data may not be passed
  on to third parties; only separately processed results may be marketed; "Source: PandaScore" must be
  shown. Whether an ad/affiliate site counts as marketing the data is unclear -> commercial_use ambiguous.
  Low Latency subscription data may NOT be shown publicly at all; odds products are forbidden. Storage/caching
  is not addressed (only that use ceases on termination) -> unknown. Free Fixtures plan (1k req/h) falls
  under the same T&Cs. Esports data also derives from game publishers/tournament organisers; no rights
  to underlying content (logos, game art) are granted by this page. Entry covers the same service as the
  other PandaScore entry (pandascore / pandascore-api). Merged duplicate entry `pandascore-api`.'
