notes: 'Read Terms (28 Oct 2026) https://serpkite.com/legal/terms and Acceptable Use Policy https://serpkite.com/legal/acceptable-use.
  Own products built on results are allowed; resale or raw API access, public SERP-like search engines
  and bulk substitute datasets are forbidden. Results are third-party search engine content; SerpKite
  grants no rights in it beyond the law and the user is responsible for storing/publishing it, so storage
  and display are ambiguous (no express yes). Other AUP bans: people-search, cold outreach lists, republishing
  copyrighted content. SerpKite states no indemnity for its collection method (see /legal/how-we-collect,
  not read). Attribution not mentioned: unknown.'
