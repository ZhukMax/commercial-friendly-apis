notes: 'Read via Playwright (JS site; curl gets a Cloudflare challenge) /terms and /terms/commercial-redistribution.
  Free tier: freemium endpoints limited to 90 days, 15-minute delay; licence covers internal business
  use/personal analysis only. Showing data to your site visitors needs a paid subscription plus the paid
  Commercial Redistribution add-on (registered surfaces, audience-metered, pixel + attribution required);
  raw API pass-through, feeds, bulk downloads, marketplaces and competing products are forbidden. Internal
  storage unlimited in time, but customer-facing use of stored copies must stop when the add-on ends.
  Data are macro releases/FX reference rates from central banks etc.; publisher terms ''do not get overridden''
  so may be stricter. Add-on pricing not recorded.'
