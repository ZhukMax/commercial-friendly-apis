notes: 'Aggregator: OMOPHub says it ''ACTS SOLELY AS A TECHNICAL INTERMEDIARY AND IS NOT THE LICENSOR
  OF THIRD-PARTY CONTENT''. Users must hold the licences of each vocabulary themselves (SNOMED CT affiliate
  licence, LOINC licence, UMLS licence for RxNorm); upstream terms may be stricter and can forbid commercial/storage
  use. ToS plus Data Use Agreement (effective 1 Dec 2025) allow incorporating vocabulary data into applications
  for end users subject to those licences, bar resale/sublicensing, require upstream attribution notices,
  and require deleting cached data on termination unless licences allow retention. Commercial scope of
  the Free Tier is not stated. Docs URL redirects to /introduction.'
