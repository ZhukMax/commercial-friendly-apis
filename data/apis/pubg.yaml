notes: 'Read the PUBG Developer Portal Terms of Use (last modified 2019-03-05; page /tos, which includes
  a Monetization Policy and Trademark Guidelines). Allowed: ads (preferred), paid ad removal, donations,
  subscriptions that do not gate API-based features. Forbidden: charging for exclusive access to features
  based on API data, crowdfunding with perks; PUBG may require removal of any monetization case by case.
  Data may be shown/stored only inside your own software product, not sold or distributed stand-alone;
  purpose must benefit PUBG players. Affiliate links are not mentioned (unknown). Attribution is only
  required for PUBG trademarks and by keeping notices -> ambiguous. API is for player/match data of PUBG;
  game IP stays with KRAFTON. Green is computed but medium confidence because the monetization rules are
  discretionary.'
