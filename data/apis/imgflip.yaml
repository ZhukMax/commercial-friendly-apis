notes: 'Read the API docs page (https://imgflip.com/api) and the general Terms of Service (https://imgflip.com/terms).
  Upstream auth was stale: every endpoint now requires an API key sent as a Bearer token (free and Premium
  tiers; Premium from $9.99/month adds watermark removal, GIFs, search). The docs state nothing about
  commercial use, caching or redistribution of template data; the general ToS says content from the services
  needs the owner permission, and templates are user-uploaded third-party images (studios, photographers,
  meme authors), so no rights are granted. Free tier adds an imgflip.com watermark to generated memes.
  All core fields except display left unknown; display is ambiguous because of the third-party clause.'
