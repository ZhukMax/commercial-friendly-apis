notes: Read the API licence at /terms and the plan list at /product. Free plan is labelled "Non-Commercial
  Use"; the Standard plan and above are labelled commercial use, so commercial_use is paid-only. The licence
  lets you display data to end users of your app for their personal reference, but forbids reproducing/copying
  and posting data in any public forum (incl. internet) and forbids end-user storage, so storage and display
  are ambiguous (a public page of stored weather data likely breaches it). Attribution is only "highly
  appreciated".
