notes: 'Read registrum.co.uk/terms (updated 2026-11-08) and the landing page; api.registrum.co.uk/docs
  is a Swagger UI requiring JS (not read). Terms: any lawful purpose; forbidden: circumventing rate limits,
  reselling raw API responses without transformation, building a competing API, breaching OGL v3.0. Underlying
  Companies House data is OGL v3.0 (OGL text read: commercial exploitation allowed with source acknowledgement).
  Responses include personal data on officers/PSCs: you become a separate controller under UK GDPR and
  must not contact/profile individuals unexpectedly. Storage is only implied by the GDPR sentence and
  OGL copying right, so confidence medium. Pricing/plans page 404; limits not documented. Companies House''s
  own API terms were not read.'
