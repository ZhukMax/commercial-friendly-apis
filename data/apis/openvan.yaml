notes: 'Read the API docs (OpenAPI description). All data are declared CC BY 4.0 with required visible
  attribution; no separate terms page found (/terms and /api-terms return 404). CC BY 4.0 legal code read
  at creativecommons.org. Caveat: OpenVan is an aggregator (fuel prices, visa rules, weather scores, holidays,
  news etc. compiled from other providers); the docs do not say which upstream sources/licences apply,
  which may be stricter than CC BY. Hence confidence medium. Docs also advise adding ?source=<your-domain>
  to every request.'
