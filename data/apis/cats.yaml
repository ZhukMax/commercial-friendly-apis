attribution_text: Disclose prominently (app store description and in-app intro/about page) that the app
  uses The Cat API when monetised on the free plan.
notes: Read the API Terms of Service (effective 2023-07-01, shared with The Dog API). Monetisation with
  ads is allowed; on the free account the use of The Cat API must be disclosed prominently (the paid account
  waives it, 3.3.b). No reselling; app title must not contain "Cat API"; official logo must not be used.
  The terms say nothing on caching/storage or on rights in the images (many are user-uploaded; uploaders
  warrant rights only to the API operator), so those stay unknown and the API grants no explicit rights
  to the underlying photos. API key required (auth apiKey).
