notes: 'Pages read: FAQ "Data Usage" section and API docs (docs say "If you use this data, include attribution").
  The FAQ allows using the API to power your own app with attribution and a link back to the specific
  location listing, but bans functionality that clones the site ("where to find pinball" at scale) except
  by arrangement. It never mentions ads, affiliate links or paid products, and the named data-license
  text was not found, so commercial_use is ambiguous. Storage/caching not addressed. upstream auth "none"
  is stale: FAQ says an API key is required (also: do not expose it in client-side code). Do not make
  thousands of requests quickly.'
