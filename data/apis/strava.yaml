notes: 'Not a general data source: account-scoped OAuth API. Read API Agreement and API Policy (both effective
  1 Jun 2026) and the brand guidelines. Data of a user may be shown only to that same user (even publicly
  viewable data of others may not be shown), cache max 7 days, no bulk export/persistent index, no analytics/aggregation,
  no AI/ML use, no resale. Apps may carry ads but Strava Data may not be used in ads, and charging end
  users for access to Strava functionality is barred (charging for non-duplicative extra functionality
  is allowed), so commercial_use is ambiguous. ''Powered by Strava''/''View on Strava'' branding optional
  per brand guidelines; Garmin-sourced data needs Garmin attribution. Useless for a public content site
  with stored/displayed third-party data.'
