notes: 'Pages read: obis.org/data/datapolicy (extract of the OBIS manual policy) and obis.org/data/access.
  Licence is per dataset: most CC BY 4.0, but some are NC / ND / SA, so a commercial site cannot assume
  every record is usable; the dataset licence field must be checked per record (not done). Policy also
  "discourages commercial exploitation without proper attribution". Storage/caching not addressed. Aggregator
  of thousands of provider datasets; providers retain ownership.'
