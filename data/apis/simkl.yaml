notes: Read the API rules page on the new docs site api.simkl.org (the old Apiary docs at the listed URL
  say they have moved). Free for non-commercial apps and for commercial apps earning less than $150/month;
  at $150/month or more a commercial licence (negotiated via Discord) is required, so commercial_use is
  ambiguous rather than yes/paid-only. Mandatory per-item link back to Simkl (and a Simkl-named title
  for trending lists). Competing trackers must also offer Simkl sync; for raw metadata Simkl points developers
  to TVDB/TMDB. Caching is encouraged in the best-practices section but no storage licence is stated,
  so unknown. Film/TV/anime data and posters are third-party rights; no rights granted to underlying content.
  The full Simkl Terms (simkl.com/about/policies/terms) were behind a Cloudflare check and not read.
