notes: 'Read ToS and data-access page. Free charts and what the free API returns without a key are CC
  BY 4.0 (commercial use ok with credit+link). Plus/Pro plans are personal only; republishing or using
  data in a product from those tiers needs the API & Team plan, which covers CryptoKeyhole''s own derived
  series but not reselling as a dataset. Limit: only charts visible in full without a paid plan are CC
  BY; raw exchange and other third-party data are not licensed for redistribution. Verify the chart you
  use is a free one.'
