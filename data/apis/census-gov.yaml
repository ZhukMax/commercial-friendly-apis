notes: 'API ToS permits building a service to search/display/analyze data and has no commercial-use ban,
  but never says "commercial use is allowed" and says nothing on caching/storage; no explicit data license
  (public domain not stated on pages read). Required prominent non-endorsement notice; must not modify
  content and still cite Census as source; no re-identification of respondents. Auth corrected to apiKey:
  an API key is required for all data queries per the Query Limits page. storage_caching set to unknown:
  the ToS is silent on caching.'
