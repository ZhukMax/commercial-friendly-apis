notes: 'Pages read (Dutch): API-voorwaarden (voorwaarden), Bronnen & licenties, home/pricing. Terms are
  very short: service is "as is", energy labels only per address (no bulk), third-party data reusable
  only as far as each source licence allows (sources are BAG public domain, CBS/RIVM/Politie CC BY 4.0,
  several CC0, EP-Online with its own terms), no resale of the compilation or derived values. Nothing
  says whether use on a commercial/ad-supported site is allowed, nor about caching/storage, so those stay
  unknown. Per-source attribution lines exist on the Bronnen page. Free key: 100 lookups/month; same address
  within 24 h not counted (cache).'
