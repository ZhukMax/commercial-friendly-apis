notes: 'Small single-author service. Integrations/FAQ page says the API is free for personal and commercial
  use and asks (not requires) a link to cazimi.live. The methodology page declares the dataset as CC BY
  4.0 only in hidden JSON-LD metadata (license: creativecommons.org/licenses/by/4.0/), not in visible
  text, so data_license is left unknown. The Terms of Use page (app + site) has a generic IP clause saying
  content may not be copied, modified or distributed without written permission; it does not mention the
  API, so caching/storage is ambiguous (CC BY dataset declaration vs generic clause). Terms are one page,
  informal; no explicit caching rule. share_alike left unknown.'
