notes: 'Pages read: Smarty Subscription Agreement (legal/terms-of-service, incl. Exhibit A product terms)
  and pricing page. Only a 42-day / 1,000-lookup free trial exists; ongoing use needs a paid subscription
  (hence paid-only). The licence allows use and storage of Output Data for "Internal Business Purposes"
  (as limited by the Sales Order; some products require deletion or a perpetual licence), which includes
  embedding the API in your website or app so results reach end users interacting with your interface.
  It excludes resale, sublicensing, redistribution, "other commercial exploitation" and making bulk Output
  Data available to third parties, so showing data on an ad/affiliate site is a grey area (redistribution_display
  ambiguous). Attribution not required in the terms read (left unknown). Same terms apply to both smarty.com
  and smartystreets.com entries (smartystreets.com redirects to smarty.com). Merged duplicate entry `us-zipcode-smartystreets`.'
