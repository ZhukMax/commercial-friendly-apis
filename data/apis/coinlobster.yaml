notes: Read ToS (coinlobster.com/terms, updated 2026-09-16) and /developers. ToS permits quoting individual
  figures incl. commercially with credit+link, unaltered with window/as-of notes, but forbids bulk extraction/systematic
  copying of a dataset and redistributing feeds; a general clause also bars storing/republishing Service
  material without written consent. Developers page says paid plans cover "internal and product use, not
  reselling raw rows"; a free key (250 credits) and keyless endpoints exist; their terms are not spelled
  out separately. Underlying exchange data (18 exchanges) may carry upstream limits (not checked). Storing
  and live display of the feed on a commercial site is therefore unclear.
