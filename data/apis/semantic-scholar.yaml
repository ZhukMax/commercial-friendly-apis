notes: 'API License Agreement (updated May 2023) read in full. It grants a limited licence to access and
  display S2 Data, but says use of S2 Data is separately governed by accompanying licences such as CC
  BY-NC or ODC-BY, and by third-party content licences, so commercial use depends on the dataset/licence;
  it forbids repackaging, selling or sublicensing the API. Attribution to Semantic Scholar required; S2
  marks need to follow branding rules. Storage/caching not addressed. Aggregator of publisher content:
  upstream terms may be stricter. The listed api.semanticscholar.org URL redirects to the product page,
  which is the same service.'
