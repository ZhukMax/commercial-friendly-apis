notes: 'Read gzw-data.dev/terms-of-service/, /data-sources/ and the home page (the listed gzw-data.vercel.app redirects to gzw-data.dev). Code is MIT; game data is scraped from the Gray Zone Warfare Wiki
  on Fandom, generally CC BY-SA 3.0, so share-alike applies (verdict yellow) and "individual records, images, and assets may be subject to separate rights". ToS: "Gray Zone Warfare, its logos, and related
  game content are the property of their respective owners" (MADFINGER Games); the API grants no rights to the underlying game content. Some prices come from GZW Items under the maintainers'' permission.
  Caching: ToS says "Automated clients should cache responses and make reasonable requests"; no explicit long-term storage statement, so storage_caching stays unknown. Display is inferred from the CC BY-SA
  reuse-with-credit statement, hence medium confidence.'
