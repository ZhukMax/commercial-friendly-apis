notes: 'Pages read via Playwright (terms and plans pages return Cloudflare 403 to curl): /terms and /plans-pricing. Free tiers (Explorer, Hobbyist/Academic) are listed as not including commercial use; the
  Pay As You Go plan (10,000 free calls/month, then metered) and Enterprise list commercial use as included, so paid-only. Auth is an API key (stale ''none''). Interline''s general Terms of Service not
  read; storage/caching and display not addressed on pages read. Aggregator: each source feed has its own licence and consumers must confirm and meet it (terms page lists them per feed; some are restrictive,
  e.g. SFMTA ''nonexclusive, limited, and revocable license''). Hosted API vs self-hosting open-source transitland-lib is a separate path.'
