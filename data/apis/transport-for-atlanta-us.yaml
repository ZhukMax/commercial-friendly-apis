notes: 'Read the developer resources page (GTFS, GTFS-realtime, Rail Realtime REST API; rail API needs
  a signup key, GTFS feeds need none) and the MARTA website Terms and Conditions. The developer page states
  no data licence and no caching/display/attribution rules; it only forbids use of MARTA logos/trademarks.
  The site-wide terms ban commercial use of "this information" without written permission, but they speak
  about the website, so whether they cover the API/GTFS data is unclear: ambiguous, not confirmed. Storage,
  display and attribution left unknown. Ask MARTA in writing before using for an ad-supported site.'
