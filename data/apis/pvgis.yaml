notes: 'The PVGIS API page (JRC) states no licence or terms of its own and says nothing on commercial
  use, caching or display. The only terms found are the European Commission legal notice (the JRC site
  footer links to it): unless otherwise indicated, EU-owned content on the website is CC BY 4.0, reuse
  allowed with credit. Whether that covers computed API output (as opposed to website content) is not
  stated, so commercial_use and display are ambiguous. PVGIS radiation databases come from third parties
  (e.g. CM SAF, ERA5) whose terms were not checked. Redirected URL followed to the _en page. The PVGIS
  user manual and FAQ pages carried no licence text.'
