notes: 'Read XML API Terms of Use and "Using the XML API" via Playwright (curl gets a Cloudflare block).
  Registration and an authorization token are mandatory (auth fixed from none to apiKey). Free licence
  only for strictly non-commercial use; a site with ads or sales is "commercial" and needs a commercial
  licence granted case by case (often free up to ~1000 users for ad-funded apps, paid for sales; BGG may
  refuse apps it deems competing). So commercial_use is ambiguous, not a flat yes; mandatory "Powered
  by BGG" logo means at best yellow. Data may not be modified; storage/caching is not addressed -> unknown.
  Use to train AI/LLMs prohibited. Data includes user submissions, publisher cover art and Wikipedia text
  under CC BY-NC-SA: BGG grants no rights in third-party game content. Terms may change at any time ("proceed
  at your own risk").'
