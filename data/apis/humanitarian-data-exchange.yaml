notes: 'Portal: no single licence. HDX Terms of Service (docs.humdata.org; old URL data.humdata.org/faqs/terms
  redirects there, read via Playwright) say each contributing organisation picks the licence and users
  must follow the dataset''s licence. The Data Licenses page lists CC BY, CC BY-IGO, CC BY-SA and ODbL
  options (CC BY: ''for any purpose, even commercially''; CC BY-SA and ODbL add share-alike). No dataset-level
  licence was read, so commercial use, attribution and display are ambiguous per dataset; check each dataset
  before use. Datasets may also be restricted or on request (HDX Connect). The API is CKAN-based; no API-specific
  terms found.'
