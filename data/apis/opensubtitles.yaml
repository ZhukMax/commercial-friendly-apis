notes: 'Read ''Terms of use for integrators'' (last updated 13 October 2026) and the API Subscription
  prices page on the Stoplight docs via Playwright (opensubtitles.com itself returned 403 to curl; /en/terms
  is 404). Commercial use, including ad-supported apps, is allowed: a free key works when each user signs
  in with their own account, a paid plan (from $20/month) is needed when one key serves anonymous users.
  Subtitles are user-submitted and the API is explicitly not a licence to them; a commercial site cannot
  keep a shared server-side library of subtitles or redistribute/sell them, and AI training is prohibited,
  so display/redistribution of the subtitle text itself is ambiguous (rights holders'' permission needed).
  Metadata exports may be copied.'
