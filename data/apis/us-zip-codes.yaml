notes: Metadapi Zip Code API (old URL redirects to /API-Directory/Zip-Code-API). Its Terms of Use page covers only the web site (communication services, links, etc.) and has no API data-use terms; no data
  licence, caching, display or attribution rules found on the API page, FAQ or support pages. The pricing labels the free tier "Free Test Workloads" and paid tiers "Production Workloads", but that is a
  plan label, not an explicit ban on commercial use of the free tier. Underlying data comes from USPS, IRS SOI and Census ACS (partly public domain) but this was not verified against the vendor terms. All
  core terms unknown.
