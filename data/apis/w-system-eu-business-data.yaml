notes: Read ToS v2 (wsystem.dev/terms), the Data sources and licences page and llms.txt. Aggregator of
  official sources (VIES, EORI, sanctions lists, company registers), each with its own licence and attribution
  rule (some, e.g. UN list, have no explicit open licence; VAT data belongs to member states), so upstream
  terms may be stricter. ToS bans reselling raw access without permission but is silent on commercial
  use of results, storage and display; paid plans are business-only. Core terms left unknown, attribution
  ambiguous (per-source).
