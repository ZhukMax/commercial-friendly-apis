  as produced works only needs attribution, so yellow is conservative. Web service code is AGPL-3.0 on
  GitHub (self-host possible). Data is collected from public government sources listed per country under
  Data Sources; upstream authorities may have their own terms (not individually checked). No separate
  API terms/ToS page found (/terms 404). Link redirects to /en/.
