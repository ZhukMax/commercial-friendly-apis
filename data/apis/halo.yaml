notes: 'Read the Halo Game Data Terms of Use on developer.haloapi.com (Azure API Management portal; last
  updated 2018-05-22, API is labelled Beta). Use must be non-commercial except three listed cases: crowdfunding
  to build the app, non-restricted advertisements shown with the Game Data, and an in-app purchase solely
  to remove ads; no fees for download/access/features; no bundling third-party products/services for consideration
  (this likely excludes affiliate links). A mandatory Microsoft notice must be displayed and Game Data
  may not be commingled with other games'' data. Microsoft can demand purge of Game Data at any time (storage
  conditions unclear -> unknown). Entry covers Halo 5 and Halo Wars 2 data; whether the beta API is still
  maintained was not verified. No rights in Halo IP beyond the licence.'
