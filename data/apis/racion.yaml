notes: 'Read the Russian developer page (/developers) and Terms (/terms, updated 2026-09-19). They conflict:
  the developer page says building a product on the API is allowed and only republishing the recipe DB/photos
  wholesale or in large chunks is not; the ToS says recipe texts, photos, collections and the DB are for
  personal non-commercial use and may not be published on other sites, in advertising or paid products
  without written permission. Hence ambiguous on all core fields. priceSource must be shown next to prices
  if a sum is published (developer page). Prices are estimates from official statistics (Rosstat, Eurostat,
  BLS). Contact info@racion.app for limits/partnership.'
