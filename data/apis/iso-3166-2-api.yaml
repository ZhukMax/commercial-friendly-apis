notes: Hobby project hosted on Vercel with no API terms of use. The GitHub repo is MIT-licensed (read
  the LICENSE file), which covers the software and documentation files; the README says the data is compiled
  from the ISO Online Browsing Platform and other sources, and ISO claims copyright over ISO 3166 content,
  which the MIT file does not address. Commercial use is therefore ambiguous rather than yes. /api/coords
  proxies OSM Nominatim (its own policy applies). Storage, display and attribution duties not stated for
  the hosted API.
