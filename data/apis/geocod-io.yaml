notes: 'ToS section 8.4 lets customers store, sell and otherwise use results provided the underlying data
  sources permit it. Terms summary: storage is permanent in most countries/uses, but UK reverse geocoding
  (and some Australian derived data) has data-licence limits (UK data stored only up to 12 months after
  the subscription ends). Attribution depends on each underlying source and is the customer''s responsibility,
  hence ambiguous. No sell/display restriction on map brand.'
