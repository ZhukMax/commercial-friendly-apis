notes: 'Not a data source: Metabase is self-hosted BI software (the ''API'' is the REST API of your own
  instance, returning your own data). The licence page says use of the open-source edition must follow
  AGPL, and embedding iframes in your app requires abiding by the AGPL, the Embedding License (keeping
  the ''Powered by Metabase'' logo) or buying a commercial licence; Enterprise features need the Metabase
  Commercial Software License; Metabase Cloud has separate hosting terms (not read). Those conditions
  make commercial use conditional rather than plainly allowed, hence ambiguous. Storage and display of
  output depend on the user''s own data, left unknown.'
