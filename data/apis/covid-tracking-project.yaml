notes: 'Conflicting terms on the same site: the Data License page (page footer (c) 2022) says CC BY 4.0,
  while the Terms and Conditions (last updated 2 June 2020) restrict the sites to journalistic/research/non-commercial
  use, ban commercial storage/sale of data and point to CC BY-NC 4.0 (with a carve-out for healthcare/public-health
  use incl. for-profit). The newer licence page suggests CC BY 4.0 was adopted later, but the T&C was
  not updated, so ambiguous. Project stopped collecting data in March 2021 (not verified on a page read
  here); API v2 is a static historical archive. Data aggregated from US state dashboards; upstream state
  terms not checked.'
