notes: 'API docs page (Arabic) says the static JSON API is free for personal AND commercial use with source
  credit and a link, no rate limit, data refreshed daily via TMDB. The site Terms of Use (shoofaflam.tv/terms,
  updated 18 Oct 2026) conflict in part: copying/storing/republishing site content needs prior written
  permission (except fair use), reuse needs a prominent active link plus the name, and resale of the compiled
  databases or mirror sites needs permission; AI/search use allowed. Titles, posters and descriptions
  come from TMDB (''uses the TMDB API but is not endorsed by TMDB''), whose own terms govern that metadata
  and artwork and which Shoof Aflam cannot sublicense; films/posters are studio property. Hence commercial_use
  and storage ambiguous. Page read: Arabic-language docs plus Terms.'
