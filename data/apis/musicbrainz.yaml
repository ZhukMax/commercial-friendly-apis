notes: 'Two levels: data is mostly CC0 (core) with supplementary parts CC BY-NC-SA 3.0, but the hosted
  web service is free for non-commercial use only; commercial use needs a paid MetaBrainz commercial plan
  (tiers from $100/month on the supporters page; a non-profit/stealth tier at $0 exists). Storage/display/attribution
  evidence applies to CC0 core data only; supplementary data needs credit, non-commercial and share-alike,
  hence attribution ambiguous and share_alike unknown. Link redirects to /doc/MusicBrainz_API (read).
  MusicBrainz metadata describes recordings but grants no rights to the music itself; cover art is hosted
  by the Cover Art Archive with its own licences (not checked).'
