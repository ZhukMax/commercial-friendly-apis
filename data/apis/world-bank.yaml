notes: CC-BY 4.0 is the default for datasets produced by the World Bank; many datasets (esp. third-party
  sourced indicators) have other licenses labelled in the Data Catalog, so check per indicator. CC-BY
  4.0 comes with additional mandatory terms (mediation/dispute clause). The general site Terms and Conditions
  limit the SITE materials to non-commercial use and refer to dataset terms for datasets, so use the dataset
  license, not site terms. The "terms-of-use-for-datasets" URL redirects to terms-conditions; the license
  page is the Data Catalog public-licenses page. API-specific terms (datahelpdesk) and rate limits not
  checked. bulk_download left unknown (not verified).
