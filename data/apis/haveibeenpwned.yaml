notes: 'Two pages read: API v3 docs (licence section) and Terms of Use. The quoted commercial-use sentence
  in the Terms covers only Pwned Passwords and the unauthenticated breach-catalogue endpoints (/breaches,
  /breach/{name}, /latestbreach, /dataclasses). The breached-account/paste APIs need a paid API key and
  are limited to the ''Permitted Purpose''; the Terms forbid reselling HIBP data as a product, building
  a similar breach search service, and displaying results without attribution. Whether showing the data
  on your own pages counts as redistribution is not clear, hence ambiguous. Storage/caching not addressed
  (unknown).'
