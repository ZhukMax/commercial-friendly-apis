notes: 'Read humorapi.com/terms (last updated Sept 1, 2021) and the pricing block on humorapi.com. Storage
  is forbidden: no copying/storing of API data; with prior written permission, user-requested data may
  be cached for max 1 hour, and all data must be deleted if access ends (so storage_caching=no, cache_limit
  1 hour with permission). Display on your own website/app is allowed, but you may not build something
  providing the same experience or competing. No explicit commercial/non-commercial clause: the terms
  are for paying subscribers and the free plan carries "Backlink Required" (a mandatory backlink on the
  free plan; paid plans say "No Backlink"), so attribution is ambiguous per plan and commercial use is
  ambiguous. Humor API may add its logo, links or ads to the API. Jokes/memes/gifs are largely third-party
  content: the terms disclaim responsibility for any text or images shown even if from the API, and grant
  no rights to underlying content.'
cache_limit: None without permission; max 1 hour with Humor API prior written permission
