notes: 'Terms are a 3-page PDF (dated 27 Feb 2023) linked from dip.bundestag.de/über-dip/nutzungsbedingungen;
  read via curl + pdftotext (the API help page is JS-rendered, read via Playwright). Commercial reuse
  allowed with source credit plus, for commercial use, a mandatory notice with link that data is free
  in DIP. PDF documents (Drucksachen, Plenarprotokolle) are official works: no alteration, excerpts only
  with source; edits/annotations must be marked. No defamatory/disparaging or extremist-context use. A
  public API key is published on the API help page (no registration); personal keys on request; abuse
  can get the key swapped/blocked. The notice duty goes beyond plain credit but verdict is computed from
  the fields. verify_quotes may report unfetchable (PDF).'
