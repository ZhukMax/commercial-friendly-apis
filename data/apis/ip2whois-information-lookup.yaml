notes: ip2whois.com says to sign up for the free API at ip2location.io; the only applicable terms found
  are the IP2Location.io Web API Terms of Service (Hexasoft), whose definition of "Data" speaks of IP
  geolocation/proxy/threat data, so applicability to WHOIS responses is assumed, not confirmed. Grant
  is for "internal business operations or integration into Customer's software applications"; no explicit
  commercial-use, public-display or attribution statement, so those stay unknown. Bans reselling raw responses
  as a standalone service and building a competing database. Underlying WHOIS record data is registrant/registry
  data with its own rights (not assessed). The IP2Location downloadable-database licence (ip2location.com/terms)
  is a different product and was not applied.
